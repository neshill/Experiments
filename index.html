<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#e7d7b4">
<title>Fali Ti Jedan Papir</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: portrait one-screen game in 1980s Yugoslav-modernist government stationery.
   Pinned HUD tiles on top; scrolling middle (office backdrop + clerk intent, gossip, checklist); pinned hand of illustrated cards at the bottom.
   Deliberately single-theme: warm paper, ink navy, signal orange/red. */
:root{
  --paper:#f2e5c8; --paper-2:#fbf4e2; --wall:#e7d7b4; --ink:#18283a; --navy:#153c62;
  --orange:#e76a36; --red:#c93f31; --turquoise:#4c9e9b; --gold:#e8b44b; --sage:#7d9d80;
  --muted:#6d6656; --line:rgba(24,40,58,.16); --stamp:#4a3a8c;
  --radius-card:8px; --border-ink:2px;
  --shadow:0 1px 0 rgba(24,40,58,.10),0 4px 12px rgba(24,40,58,.14);
  --f-display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --f-led:"Share Tech Mono","Courier New",monospace;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--wall);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;
  background-image:radial-gradient(rgba(24,40,58,.05) 1px,transparent 1px);background-size:6px 6px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--turquoise);outline-offset:2px}
#app{height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-block:10px 14px}
main>*{flex-shrink:0}

/* ---------- HUD ---------- */
.hud{display:flex;flex-direction:column;gap:7px;padding-block:8px 8px;border-bottom:2px solid var(--ink)}
.tiles{display:grid;grid-template-columns:25% minmax(0,1fr) auto auto auto;gap:6px}
.menubtn{display:grid;place-items:center;padding:4px 8px;min-width:0}
/* narrow phones: the dots already show the time left, so the number goes */
@media (max-width:430px){.tnum{display:none}}
.menubtn svg{width:24px;height:24px}
.hbtn{text-align:left;cursor:pointer;border-color:rgba(24,40,58,.35);box-shadow:0 2px 0 rgba(24,40,58,.35)}
.hbtn:active{transform:translateY(2px);box-shadow:none}
.mapic{width:16px;height:16px;flex:0 0 auto}
.trail .stop-chip{font-size:10.5px}
.tile{background:var(--paper-2);border:1.5px solid var(--line);border-radius:6px;padding:4px 7px 5px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:0 1px 0 rgba(24,40,58,.08)}
.tile .lbl{font-family:var(--f-display);font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .val{display:flex;align-items:center;gap:5px;font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.dots{display:flex;gap:3px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--navy);background:transparent}
.dot.on{background:var(--navy);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.heart{width:17px;height:15px;flex:0 0 auto}
.pbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:1px}
.pbar i{display:block;height:100%;background:var(--red)}
.deckic{width:16px;height:18px;flex:0 0 auto}
.led{background:#1b1512;border-color:#000;color:#ff3b28}
.led .lbl{color:#bfa69a}
.led .val{font-family:var(--f-led);font-size:21px;letter-spacing:.06em;text-shadow:0 0 6px rgba(255,59,40,.65)}
.trail{display:flex;gap:5px;align-items:stretch}
.stop-chip{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:4px;padding:2px 5px 2px 2px;border-radius:5px;border:1.5px solid var(--line);background:var(--paper-2);font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.01em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden}
.stop-chip img{width:20px;height:18px;object-fit:cover;border-radius:3px;flex:0 0 auto}
.stop-chip.now{border-color:var(--ink);color:var(--ink);background:#fff}
.stop-chip.done{opacity:.6}
.stop-chip.done span{text-decoration:line-through}
.relics{display:flex;gap:5px;flex-wrap:wrap}
.relic{font-family:var(--f-display);font-weight:600;font-size:12px;background:var(--paper-2);border:1.5px dashed var(--turquoise);color:#24605e;padding:0 7px;border-radius:10px}

/* ---------- office stage ---------- */
.stage{position:relative;border-radius:var(--radius-card);overflow:hidden;border:var(--border-ink) solid var(--ink);box-shadow:var(--shadow);background:var(--navy)}
.stage .bg{display:block;width:100%;height:266px;object-fit:cover;object-position:50% 60%;filter:brightness(.82) saturate(.9)}
/* the counter top along the bottom edge, so the half-figure reads as standing behind it */
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16%;z-index:1;pointer-events:none;
  background:linear-gradient(to bottom,rgba(24,40,58,0),rgba(24,40,58,.55) 40%,rgba(24,40,58,.8))}
.portrait{position:absolute;left:-2%;bottom:0;height:calc(100% - 22px);width:auto;max-width:56%;object-fit:contain;object-position:left bottom;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.45));pointer-events:none}
.band{z-index:2}
.band{position:absolute;left:0;top:0;padding:5px 10px 6px;color:#fff;font-family:var(--f-display);line-height:1;border-bottom-right-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.band b{display:block;font-weight:800;font-size:19px;letter-spacing:.03em;text-transform:uppercase}
.band span{font-weight:600;font-size:12.5px;letter-spacing:.04em;opacity:.9}
.intent{position:absolute;z-index:2;left:50%;right:8px;bottom:8px;display:flex;gap:9px;align-items:center;background:var(--paper-2);border:1.5px solid var(--ink);border-radius:7px;padding:6px 8px 6px 6px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.intent .face{width:48px;height:48px;border-radius:5px;object-fit:cover;flex:0 0 auto;border:1.5px solid var(--ink)}
.intent .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.intent .k{font-family:var(--f-display);font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.intent .who{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.05}
.intent .act{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.05;color:var(--red)}
.intent .eff{font-size:13px;line-height:1.25}
.intent .ic{width:34px;height:34px;flex:0 0 auto;color:var(--ink)}
.intent.blocked .act,.intent.blocked .eff{text-decoration:line-through;color:var(--muted)}
.intent.blocked .k{color:var(--turquoise)}

/* ---------- gossip: speech bubbles that pop up on the stage now and then ---------- */
.bubble{position:absolute;z-index:3;bottom:calc(var(--ib,74px) + 18px);left:40%;right:10px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:7px 12px 9px;
  box-shadow:4px 4px 0 rgba(24,40,58,.45);font-size:14px;font-weight:500;line-height:1.3;color:var(--ink);cursor:pointer;transform-origin:0 50%}
.bubble b{display:block;font-family:var(--f-display);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);line-height:1.1;margin-bottom:2px}
.bubble.c::before,.bubble.c::after{content:"";position:absolute;left:-14px;bottom:14px;border:7px solid transparent;border-right:14px solid var(--ink);border-left:0}
.bubble.c::after{left:-9.5px;bottom:16.5px;border-width:4.5px;border-right-width:10px;border-right-color:#fff}
.bubble.k{left:auto;right:16px;width:calc(60% - 26px);transform-origin:100% 50%;background:var(--paper-2);border-style:dashed}
.bubble.k b{color:var(--navy)}
.bubble.k::before,.bubble.k::after{content:"";position:absolute;right:-14px;bottom:14px;border:7px solid transparent;border-left:14px solid var(--ink);border-right:0}
.bubble.k::after{right:-9.5px;bottom:16.5px;border-width:4.5px;border-left-width:10px;border-left-color:var(--paper-2)}
.bubble.pop{animation:bubpop .28s cubic-bezier(.2,1.6,.4,1)}
.bubble.out{animation:bubout .22s ease-in forwards}
@keyframes bubpop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bubout{to{transform:scale(.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.bubble.pop,.bubble.out{animation:none}}

/* ---------- checklist ---------- */
.check{position:relative;background:var(--paper-2);border:1.5px solid rgba(24,40,58,.35);border-radius:6px;box-shadow:3px 3px 0 #e2d2ad,6px 6px 0 #d8c59b,var(--shadow);margin-right:6px}
.check-head{display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1.5px solid rgba(24,40,58,.25)}
.logo{width:26px;height:26px;border-radius:4px;flex:0 0 auto;display:grid;place-items:center}
.logo svg{width:18px;height:18px}
.check-head b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.check-head span{font-size:13px;color:var(--muted);border-left:1.5px solid var(--line);padding-left:8px;line-height:1.15;min-width:0}
.rows{list-style:none;margin:0;padding:2px 0}
.rows li{display:flex;align-items:center;gap:6px;padding-right:9px;border-bottom:1px solid var(--line)}
.rows li:last-child{border-bottom:0}
.row{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:8px 4px 8px 11px;text-align:left;background:none;border:0}
.box{flex:0 0 24px;height:24px;border:2px solid var(--ink);border-radius:4px;display:grid;place-items:center;background:#fff}
.box svg{width:18px;height:18px;color:#fff}
.rows li{position:relative;transition:background .2s}
.rows li.done{background:linear-gradient(90deg,rgba(47,125,74,.2),rgba(47,125,74,.07));box-shadow:inset 6px 0 0 #2f7d4a}
.rows li.done .box{background:#2f7d4a;border-color:#2f7d4a;box-shadow:0 0 0 2px rgba(47,125,74,.25)}
.row.done .row-label .nm{color:#2c5c3d;text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:rgba(47,125,74,.75)}
.row.done .row-label em{color:#4f7a5c}
.row.done .thumb{opacity:.7;filter:grayscale(.4)}
.row-label .ok{font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:#2f7d4a}
.mini-stamp.ok{color:#2f7d4a;border-color:#2f7d4a;font-size:13.5px;border-width:2.5px;opacity:1}
.rows li.fresh{animation:rowflash 1.1s ease-out}
.rows li.fresh .mini-stamp{animation:stampin .4s cubic-bezier(.2,1.6,.4,1)}
.rows li.fresh .box{animation:boxpop .35s cubic-bezier(.2,1.8,.4,1)}
@keyframes rowflash{0%{background:rgba(47,125,74,.55)}100%{}}
@keyframes stampin{from{transform:rotate(-6deg) scale(2.6);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
@keyframes boxpop{from{transform:scale(.4)}to{transform:scale(1)}}
.check-head .count{margin-left:auto;border:0;padding:0;font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.04em;color:#2f7d4a;white-space:nowrap}
.thumb{width:26px;height:34px;flex:0 0 auto;border-radius:2px;border:1px solid rgba(24,40,58,.3);object-fit:cover;background:#fff}
.row-label{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-label .nm{font-weight:600;font-size:14.5px;line-height:1.15}
.row-label em{font-style:normal;color:var(--muted);font-size:12.5px;line-height:1.2}
.row-label .have{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.03em;color:#2f7d4a}
.row-label .have.no{color:var(--red)}
.row.done .row-label .nm{color:var(--muted)}
.tag{font-family:var(--f-display);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:3px;white-space:nowrap}
.tag.new{border:1.5px solid var(--muted);color:var(--muted)}
.tag.ft{background:var(--red);color:#fff}
.mini-stamp{font-family:var(--f-display);font-weight:800;font-size:12.5px;letter-spacing:.08em;color:var(--stamp);border:2px solid var(--stamp);border-radius:3px;padding:0 5px;transform:rotate(-6deg);text-transform:uppercase;white-space:nowrap;opacity:.85}
.mini-stamp.bribe{color:var(--red);border-color:var(--red)}
.row.pick{background:rgba(76,158,155,.14);outline:2px dashed var(--turquoise);outline-offset:-3px}
.fetch{flex:0 0 auto;font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;border:2px solid var(--ink);background:#fff;border-radius:5px;padding:5px 8px;white-space:nowrap;box-shadow:0 2px 0 var(--ink)}
.fetch:active{transform:translateY(2px);box-shadow:none}
.fetch.urgent{border-color:var(--red);color:var(--red);box-shadow:0 2px 0 var(--red)}
.ftmeter{display:flex;align-items:center;gap:8px;padding:7px 11px 9px;border-top:1.5px solid rgba(24,40,58,.2);font-family:var(--f-display);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.segs{display:flex;gap:3px;flex:1}
.seg{height:7px;flex:1;background:var(--line);border-radius:2px}
.seg.on{background:#2f7d4a}
.ftmeter.hot{color:var(--red)}


.log{font-size:13px;color:var(--muted);min-height:1.3em;line-height:1.35;margin:0;padding-inline:2px}
.banner{background:var(--navy);color:#fff;padding:7px 10px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:13.5px;flex-wrap:wrap}
.banner.warn{background:var(--red)}
.banner .bb{display:flex;gap:6px}
.banner button{background:transparent;border:1.5px solid currentColor;padding:3px 10px;border-radius:4px;color:inherit;font-weight:700}
.banner button.solid{background:#fff;color:var(--ink);border-color:#fff}

/* ---------- dock + cards ---------- */
#app{position:relative}
main.withdock{padding-bottom:342px;scroll-padding-bottom:342px}
.dock{position:absolute;left:0;right:0;bottom:0;z-index:5;pointer-events:none;
  background:linear-gradient(to bottom,rgba(231,215,180,0) 0,var(--wall) 24px,var(--wall) 66px,rgba(231,215,180,.84) 104px,rgba(231,215,180,.92) 100%);
  padding:22px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px}
.dock>*{pointer-events:auto}
.dock>.lane{pointer-events:none}
.dock .card{pointer-events:auto}
.ledmini{display:flex;align-items:center;gap:6px;background:#1b1512;color:#ff3b28;border-radius:6px;padding:4px 8px;border:1.5px solid #000}
.ledmini b{font-family:var(--f-led);font-size:22px;line-height:1;text-shadow:0 0 6px rgba(255,59,40,.65);font-weight:400}
.ledmini span{font-family:var(--f-display);font-weight:700;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#bfa69a;line-height:1.05}
button.piles{background:none;border:0;padding:4px 0;text-decoration:underline;text-decoration-color:rgba(24,40,58,.3);text-underline-offset:3px}
.lane{display:flex;gap:9px;overflow-x:auto;padding:16px 4px 4px;scroll-snap-type:x proximity;min-height:30px}
/* Radial fan: every card pivots around the centre of the round End-turn button, which sits half below the screen edge. */
.fanwrap{--pc:calc(20px + env(safe-area-inset-bottom,0px)*.6);--r:70px;position:relative;height:calc(var(--pc) + var(--r) + 212px);margin:0 calc(-1*max(12px,env(safe-area-inset-left,0px)))}
.lane.fan{position:absolute;inset:0;display:block;padding:0;min-height:0;overflow:visible;touch-action:none;pointer-events:none}
.lane.fan .empty{position:absolute;left:0;right:0;bottom:calc(var(--pc) + 80px);text-align:center}
.lane.fan .card{position:absolute;left:50%;bottom:calc(var(--pc) + var(--r));width:122px;height:200px;margin-left:-61px;transform-origin:50% calc(100% + var(--r));
  transform:rotate(var(--rot,0deg)) translateY(var(--lift,0px));touch-action:none;transition:transform .12s ease-out,opacity .12s,filter .12s}
.lane.fan .card:active{--lift:0px}
.endbtn{position:absolute;left:50%;bottom:calc(var(--pc) - 80px);width:160px;height:160px;margin-left:-80px;border-radius:50%;z-index:90;pointer-events:auto;background:none;border:0;padding:0;color:#fff;-webkit-tap-highlight-color:transparent}
.endbtn svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.endbtn .face{position:absolute;left:50%;top:50%;width:118px;height:118px;margin:-59px 0 0 -59px;border-radius:50%;border:3px solid var(--ink);
  background:radial-gradient(circle at 50% 28%,#f39a63,var(--orange) 52%,#c6532a);box-shadow:inset 0 3px 0 rgba(255,255,255,.3);display:flex;justify-content:center;padding-top:22px;transition:transform .08s,background .2s}
.endbtn:active .face{transform:translateY(3px) scale(.98)}
.endbtn .et{font-family:var(--f-display);font-weight:800;font-size:15.5px;letter-spacing:.07em;text-transform:uppercase;line-height:1;text-shadow:0 1px 0 rgba(0,0,0,.28);white-space:nowrap}
.endbtn .bezel{fill:none;stroke:#1b1512;stroke-width:21}
.endbtn .seg{fill:none;stroke-width:6;stroke-linecap:butt;stroke:#4b1a14;transition:stroke .3s}
.endbtn .seg.on{stroke:#ff3b28;filter:drop-shadow(0 0 3px rgba(255,59,40,.85))}
.endbtn .arcl{font-family:var(--f-display);font-weight:700;font-size:9.5px;letter-spacing:.14em;fill:#bfa69a;text-transform:uppercase}
.endbtn.low .arcl{fill:#ff6a55}
.endbtn.low .seg.on{animation:ledblink 1s steps(2,end) infinite}
@keyframes ledblink{50%{opacity:.3}}
.endbtn::before{content:'';position:absolute;inset:-3px;border-radius:50%;pointer-events:none}
.endbtn.ready::before{animation:readyglow 1.6s ease-in-out infinite}
@keyframes readyglow{0%,100%{box-shadow:0 0 0 0 rgba(231,106,54,.6)}60%{box-shadow:0 0 0 12px rgba(231,106,54,0)}}
.endbtn.keepmode .face{background:radial-gradient(circle at 50% 28%,#5db0ab,#2d6f6c 60%,#235855)}
.pilebtn{position:absolute;bottom:calc(var(--pc) + 2px);z-index:85;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--paper-2);border:2px solid var(--ink);border-radius:8px;padding:4px 8px 3px;box-shadow:0 2px 0 var(--ink);min-width:50px}
.pilebtn b{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1;font-variant-numeric:tabular-nums}
.pilebtn span{font-family:var(--f-display);font-weight:700;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pilebtn.l{left:max(12px,env(safe-area-inset-left,0px))}.pilebtn.r{right:max(12px,env(safe-area-inset-right,0px))}
@media (prefers-reduced-motion:reduce){.endbtn.low .seg.on,.endbtn.ready::before{animation:none}}
.lane.fan .card .nm{font-size:14px}
.card img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
.lane.fan .card .art{height:74px}
.lane.fan .card.press{--lift:-12px;z-index:79!important}
.lane.fan .card.launch{--lift:-56px!important;outline-color:#2f7d4a!important;box-shadow:0 0 0 4px rgba(47,125,74,.35),0 12px 26px rgba(0,0,0,.35)!important}
.lane.fan .card.peek{--lift:-28px;z-index:80!important;outline:3px solid var(--orange);outline-offset:1px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.lane.peeking .card:not(.peek){filter:brightness(.88) saturate(.8)}
.lane.fan .card .tx{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.controls .btn{white-space:nowrap}
.lane.fan .card.off{opacity:.85;filter:grayscale(.75) brightness(.96)}
.lane .empty{font-size:13px;color:var(--muted);align-self:center}
.card{--c:#efe3c6;flex:0 0 118px;height:194px;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:6px 6px 7px;background:var(--c);border:1.5px solid rgba(24,40,58,.45);border-radius:var(--radius-card);box-shadow:var(--shadow);transition:transform .12s,opacity .12s}
.card{transform:translateY(var(--lift,0px)) rotate(var(--rot,0deg)) translateY(var(--dy,0px));-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.card:active{--lift:-4px}
.card .nm{font-family:var(--f-display);font-weight:800;font-size:13.5px;line-height:1;letter-spacing:.02em;text-transform:uppercase;min-height:27px;display:flex;align-items:center;justify-content:center;text-wrap:balance}
.card .sub{font-family:var(--f-display);font-weight:700;font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-top:2px;padding:0 5px;border-radius:3px;background:rgba(255,255,255,.55);color:var(--ink)}
.card .sub.copy{background:#fff;color:var(--muted);outline:1px dashed var(--muted)}
.card .sub.certified{background:var(--stamp);color:#fff}
.card .sub.shady{background:var(--ink);color:var(--gold)}
.art{position:relative;width:100%;height:68px;margin-top:5px;border-radius:4px;overflow:hidden;border:1.5px solid rgba(24,40,58,.4);background:#fff;flex:0 0 auto}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.card.doc .art img{object-position:50% 40%}
.art.copy img{filter:grayscale(1) contrast(1.15) brightness(1.05)}
.art.certified img{filter:grayscale(1) contrast(1.1)}
.seal{position:absolute;right:3px;bottom:3px;width:34px;height:34px;border-radius:50%;border:2px solid var(--stamp);color:var(--stamp);font-family:var(--f-display);font-weight:800;font-size:7.5px;letter-spacing:.04em;display:grid;place-items:center;transform:rotate(-12deg);background:rgba(255,255,255,.55);line-height:1}
.fallback{width:100%;height:100%;display:grid;place-items:center;background:repeating-linear-gradient(#fff 0 6px,#e9e3d3 6px 7px)}
.fallback svg{width:38px;height:38px;color:var(--ink);opacity:.8}
.costs{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:-13px;position:relative;z-index:1;height:26px}
.cost{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.cost.free{background:#fff;color:var(--ink);border-color:var(--ink)}
.pcost{display:flex;align-items:center;gap:2px;height:22px;padding:0 6px 0 4px;border-radius:11px;background:var(--red);color:#fff;font-family:var(--f-display);font-weight:800;font-size:13px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pcost svg{width:11px;height:10px}
.card .tx{font-size:11px;line-height:1.2;margin-top:3px;font-weight:500}
.card .foot{margin-top:auto;font-family:var(--f-display);font-weight:700;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.card.shady{border:2px dashed rgba(24,40,58,.6)}
.card.off{opacity:.45;filter:saturate(.5)}
.card.targetable{outline:3px dashed var(--turquoise);outline-offset:2px}
.card.keep{--lift:-14px;outline:3px solid var(--turquoise);outline-offset:1px}
.card.keep::after{content:'KEEP';position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--turquoise);color:#fff;font-family:var(--f-display);font-weight:800;font-size:11px;letter-spacing:.08em;padding:1px 8px;border-radius:9px;border:2px solid #fff}
.card.tossing{opacity:.55;filter:saturate(.4)}
.banner.keepbar{background:#2d6f6c}
.card.armed{--lift:-14px;z-index:40!important;outline:3px solid var(--orange);outline-offset:1px}
.controls{display:flex;align-items:center;gap:10px}
.piles{font-family:var(--f-display);font-weight:700;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.spacer{flex:1}
.btn{font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:.05em;text-transform:uppercase;border:2px solid var(--ink);background:#fff;padding:9px 16px;border-radius:6px;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.primary{background:var(--orange);color:#fff}
.btn.quiet{background:transparent;box-shadow:none;border-color:rgba(24,40,58,.35);color:var(--muted)}

/* ---------- other screens ---------- */
.sheet{background:var(--paper-2);border:1.5px solid rgba(24,40,58,.3);border-radius:8px;box-shadow:var(--shadow);padding:16px 15px;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.sheet p{margin:0;font-size:15px;line-height:1.5;max-width:62ch}
.kicker{font-family:var(--f-display);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.poster{display:flex;gap:12px;align-items:flex-end}
.title{margin:0;font-family:var(--f-display);font-weight:800;font-size:58px;line-height:.86;letter-spacing:-.01em;text-transform:uppercase}
.title span{display:block}
.title .t1{color:var(--ink)}.title .t2{color:var(--red)}.title .t3{color:var(--navy)}
/* ---------- title screen: office backdrop in navy duotone, logo comped from document cards, stacked menu ---------- */
.ts-bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--navy)}
.ts-bg img{width:100%;height:100%;object-fit:cover;object-position:50% 45%;filter:grayscale(1) contrast(1.15) brightness(1.05);mix-blend-mode:multiply;opacity:.55;transform:scale(1.04)}
.ts-bg::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,60,98,.15),rgba(21,60,98,.35) 45%,rgba(24,40,58,.92))}
.ts-bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(242,229,200,.13) 1.2px,transparent 1.4px);background-size:5px 5px}
main.ts{position:relative;z-index:1;justify-content:center;align-items:center;gap:0;padding:28px 0 calc(22px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--paper)}
.ts-logo{position:relative;display:flex;flex-direction:column;align-items:center;margin:auto 0 40px}
.ts-papers{position:relative;width:236px;height:112px;margin-bottom:-12px}
.ts-p{position:absolute;bottom:0;left:50%;width:70px;height:94px;margin-left:-35px;transform:translateX(var(--x)) rotate(var(--r));border-radius:5px;border:2px solid var(--ink);background:var(--paper-2);padding:4px;box-shadow:3px 4px 0 rgba(0,0,0,.35);transform-origin:50% 140%}
.ts-p img{width:100%;height:100%;object-fit:cover;border-radius:2px;display:block;filter:saturate(.9)}
.ts-p.miss{background:transparent;border:2.5px dashed var(--paper);box-shadow:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:44px;color:var(--orange);text-shadow:2px 2px 0 var(--ink)}
.ts-title{margin:0;position:relative;font-family:var(--f-display);font-weight:800;text-transform:uppercase;line-height:.84;letter-spacing:-.005em;font-size:clamp(60px,19vw,96px);text-align:left}
.ts-title span{display:block;white-space:nowrap;width:max-content}
.ts-title .l1{color:var(--paper);text-shadow:4px 4px 0 var(--red)}
.ts-title .l2{color:var(--orange);margin-left:.55em;text-shadow:4px 4px 0 var(--ink)}
.ts-stamp{position:absolute;right:0;bottom:-30px;transform:rotate(-8deg);font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#cfc4f5;border:3px solid #cfc4f5;border-radius:5px;padding:1px 9px;opacity:.9;mix-blend-mode:screen}
.ts-menu{display:flex;flex-direction:column;gap:12px;width:min(300px,82%)}
.ts-menu .btn{font-size:21px;padding:13px 16px;background:var(--paper-2);color:var(--ink)}
.ts-menu .btn.primary{background:var(--orange);color:#fff}
.ts-menu .btn.quiet{background:transparent;color:var(--paper);border-color:rgba(242,229,200,.55);box-shadow:none}
/* Menu hover: a springy grow + tilt. The overshooting curve on the way in makes it "boing" into place; release eases back a little slower. Each button tilts its own way. */
.ts-menu .btn{transition:transform .32s cubic-bezier(.34,1.56,.64,1),box-shadow .25s ease,background-color .2s,border-color .2s;will-change:transform}
.ts-menu .btn:nth-child(1){--tilt:-2.5deg}.ts-menu .btn:nth-child(2){--tilt:2deg}.ts-menu .btn:nth-child(3){--tilt:-1.5deg}
@media (hover:hover){
  .ts-menu .btn:hover{transform:scale(1.07) rotate(var(--tilt));box-shadow:0 7px 0 var(--ink),0 12px 22px rgba(0,0,0,.28);transition:transform .38s cubic-bezier(.34,1.8,.5,1),box-shadow .25s ease}
  .ts-menu .btn.quiet:hover{border-color:var(--paper);background:rgba(242,229,200,.08);box-shadow:none}
}
.ts-menu .btn:active{transform:scale(.96) rotate(calc(var(--tilt) * -.5));box-shadow:0 1px 0 var(--ink);transition-duration:.08s}
.ts-menu .btn:focus-visible{transform:scale(1.05) rotate(var(--tilt))}
@media (prefers-reduced-motion:reduce){.ts-menu .btn,.ts-menu .btn:hover,.ts-menu .btn:active{transform:none;transition:none}}
/* pause menu */
.panel.pause{z-index:40;align-items:center;background:rgba(24,40,58,.62)}
.pm-in{max-width:420px;height:auto;max-height:100%;display:flex;flex-direction:column;gap:10px;position:relative;padding-top:22px}
.panel.pause .panel-in>.pclose{position:sticky;align-self:flex-end;float:none}
.pm-in .rules{margin-top:4px}
.pm-btns{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.pm-btns .btn{font-size:19px;padding:11px 16px}
.btn.danger{color:var(--red);border-color:rgba(201,63,49,.55)}
.btn.primary.danger{background:var(--red);color:#fff;border-color:var(--ink)}
/* PAUZA sign, in three beats when the menu opens: the shade fades in, then the sign drops straight down from the top
   edge (gravity: slow start, fast finish), then it swings a little on its strings, pivoting at the ceiling, and settles.
   Two layers so the moves don't fight: .pause-sign falls (up/down only), .ps-swing rotates. */
.panel.pause{flex-direction:column;align-items:center;padding-top:clamp(132px,19vh,200px)}
.pause-sign{position:absolute;top:0;left:0;right:0;margin:0 auto;width:max-content;z-index:2;pointer-events:none}
.ps-swing{position:relative;transform-origin:50% 0;padding-top:clamp(30px,6vh,64px);display:flex;flex-direction:column;align-items:center}
.ps-swing::before,.ps-swing::after{content:"";position:absolute;top:0;height:calc(clamp(30px,6vh,64px) + 10px);width:3px;background:var(--ink);border-radius:2px}
.ps-swing::before{left:22%}.ps-swing::after{right:22%}
.pause-sign b{position:relative;display:block;background:var(--paper);border:4px solid var(--ink);border-radius:8px;padding:.05em .5em .02em;
  font-family:var(--f-display);font-weight:800;font-size:clamp(46px,11vw,96px);line-height:1;letter-spacing:.14em;text-transform:uppercase;color:var(--red);
  box-shadow:0 6px 0 var(--ink),0 18px 34px rgba(0,0,0,.35);background-image:repeating-linear-gradient(90deg,rgba(24,40,58,.03) 0 3px,transparent 3px 7px)}
.pause-sign b::before,.pause-sign b::after{content:"";position:absolute;top:8px;width:9px;height:9px;border-radius:50%;background:var(--ink)}
.pause-sign b::before{left:calc(22% - 3px)}.pause-sign b::after{right:calc(22% - 3px)}
.pause-sign small{margin-top:10px;font-family:var(--f-display);font-weight:800;font-size:clamp(13px,2.4vw,17px);letter-spacing:.2em;text-transform:uppercase;color:var(--paper);text-shadow:0 1px 0 var(--ink)}
@keyframes shadein{from{background-color:rgba(24,40,58,0)}}
@keyframes boxin{from{opacity:0;transform:translateY(10px)}}
@keyframes signfall{from{transform:translateY(-140%)}to{transform:translateY(0)}}
@keyframes signswing{0%{transform:rotate(0)}18%{transform:rotate(3.2deg)}42%{transform:rotate(-2.2deg)}64%{transform:rotate(1.2deg)}84%{transform:rotate(-.5deg)}100%{transform:rotate(0)}}
.panel.pause.enter{animation:shadein .28s ease-out both}
.panel.pause.enter .pm-in{animation:boxin .28s ease-out .08s both}
.pause-sign.drop{animation:signfall .34s cubic-bezier(.55,0,.95,.45) .32s both}
.pause-sign.drop .ps-swing{animation:signswing 1.5s ease-in-out .66s both}
@media (prefers-reduced-motion:reduce){.panel.pause.enter,.panel.pause.enter .pm-in,.pause-sign.drop,.pause-sign.drop .ps-swing{animation:none}}
.ts-sound{position:fixed;z-index:3;top:max(14px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;background:rgba(24,40,58,.55);border:2px solid rgba(242,229,200,.6);color:var(--paper);padding:0}
.ts-sound svg{width:22px;height:22px}
.ts-sound.light{background:var(--paper-2);border-color:var(--ink);color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.ts-carry{margin-top:16px;font-size:13.5px;color:var(--gold);max-width:300px}
.ts-foot{margin-top:auto;padding-top:22px;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(242,229,200,.7)}
@media (max-height:640px){.ts-papers{height:84px;transform:scale(.8)}.ts-logo{margin-bottom:24px}.ts-title{font-size:clamp(52px,15vw,80px)}}
/* Whimsy: each paper bobs and sways on its own slow loop (different lengths and offsets, so they never move in sync); the missing one wobbles more. */
@keyframes tsfloat{0%,100%{transform:translateX(var(--x)) translateY(0) rotate(var(--r))}30%{transform:translateX(calc(var(--x) + 2px)) translateY(-7px) rotate(calc(var(--r) + 3deg))}65%{transform:translateX(calc(var(--x) - 2px)) translateY(-3px) rotate(calc(var(--r) - 2.5deg))}}
@keyframes tswobble{0%,100%{transform:translateX(var(--x)) translateY(0) rotate(var(--r))}25%{transform:translateX(calc(var(--x) + 3px)) translateY(-9px) rotate(calc(var(--r) + 7deg))}55%{transform:translateX(var(--x)) translateY(-4px) rotate(calc(var(--r) - 5deg))}80%{transform:translateX(calc(var(--x) - 2px)) translateY(-8px) rotate(calc(var(--r) + 3deg))}}
@media (prefers-reduced-motion:no-preference){.ts-p{animation:tsfloat var(--t,5s) ease-in-out var(--d,0s) infinite}.ts-p.miss{animation-name:tswobble}
  .ts-logo{animation:tsin .5s cubic-bezier(.2,1.3,.4,1)}@keyframes tsin{from{transform:translateY(-14px) scale(.96);opacity:0}}}
.route{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.route figure{margin:0;display:flex;flex-direction:column;gap:3px}
.route img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:5px;border:1.5px solid rgba(24,40,58,.35)}
.route figcaption{font-family:var(--f-display);font-weight:700;font-size:11.5px;line-height:1.05;text-transform:uppercase;letter-spacing:.03em}

.rules{margin:0;padding-left:18px;font-size:14px;line-height:1.45;display:flex;flex-direction:column;gap:5px}

.choice.pic{display:grid;grid-template-columns:64px 1fr;column-gap:10px;align-items:center}

.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.card-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding-top:8px}

/* ---------- side pages ---------- */
.panel{position:fixed;inset:0;z-index:15;background:rgba(24,40,58,.45);display:flex;justify-content:center;padding:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 10px max(10px,env(safe-area-inset-left,0px))}

.rel{margin:0;padding-left:18px;font-size:14px;line-height:1.4}

#peek .pk-card{position:relative;width:calc(118px * var(--s,1.6));height:calc(194px * var(--s,1.6))}
#peek .card{position:absolute;left:0;top:0;width:118px;height:194px;transform:scale(var(--s,1.6))!important;transform-origin:0 0;box-shadow:0 14px 34px rgba(0,0,0,.45);opacity:1!important;filter:none!important;outline:0!important}
#peek .pk-lbl{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:12px;background:#2f7d4a;color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);max-width:86vw;text-align:center}
#peek .pk-lbl.no{background:var(--red)}
#peek .pk-lbl.keep{background:#2d6f6c}
#peek .pk-lbl.hint{background:var(--ink)}
#peek .pk-lbl.go{background:#2f7d4a;transform:scale(1.08)}
#peek.center::before{content:'';position:fixed;inset:-100vh -100vw;background:rgba(24,40,58,.3);z-index:-1}

/* ---------- overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(24,40,58,.55);display:grid;place-items:center;z-index:20;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));border:0;width:100%}
.ov-box{background:var(--paper-2);border:2px solid var(--ink);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:18px 18px 14px;max-width:400px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:left}
.ov-top{display:flex;align-items:center;gap:10px}
.ov-top .ovface{width:56px;height:62px;flex:0 0 auto;border-radius:6px;border:1.5px solid var(--ink);background:var(--navy) no-repeat 50% 6%/175% auto}
.ov-head{font-family:var(--f-display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.ov-stamp{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;color:var(--red);border:4px solid var(--red);border-radius:6px;padding:5px 14px;transform:rotate(-5deg);text-transform:uppercase;align-self:center;text-align:center;animation:thump .35s cubic-bezier(.2,1.6,.4,1)}
.ov-stamp.violet{color:var(--navy);border-color:var(--navy)}
.ov-box p{margin:0;font-size:15px;line-height:1.45}
.ov-box small{color:var(--muted);text-align:center;font-family:var(--f-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
@keyframes thump{from{transform:rotate(-5deg) scale(2.2);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.ov-stamp,.rows li.fresh,.rows li.fresh .mini-stamp,.rows li.fresh .box{animation:none}.card,.card.armed,#peek{transition:none}}
@media (max-width:360px){.tiles{grid-template-columns:26% minmax(0,1fr) auto auto auto}.tile .val{font-size:17px}.title{font-size:48px}}

/* ================= landscape / desktop / handheld (Steam Deck-class 1280×800) =================
   Three columns: the office on the left, the hand in the middle, the checklist on the right.
   Everything is visible at once, so nothing hides behind the fan. */
.lane.fan .card{cursor:pointer}
#rotate{display:none}
@media (orientation:landscape) and (min-width:900px) and (min-height:540px){
  #app{max-width:1600px;--cw:clamp(360px,calc(var(--lvw,12.8px)*40),600px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hud{padding-block:8px}
  .tiles{width:min(820px,100%);margin:0 auto}
  /* Office and checklist side by side, centred, above the hand; the log line runs under both. */
  main.withdock{display:grid;grid-template-columns:minmax(320px,500px) minmax(340px,480px);justify-content:center;grid-template-rows:minmax(0,1fr) auto;
    grid-template-areas:"stage check" "log log";gap:10px 18px;overflow:hidden;padding:14px 0 calc(var(--fanh,306px) + 4px);scroll-padding-bottom:0}
  main.withdock>.stage{grid-area:stage;align-self:stretch;min-height:0}
  main.withdock>.check{grid-area:check;align-self:start;max-height:100%;overflow-y:auto;margin-right:6px}
  main.withdock>.log{grid-area:log;align-self:start;justify-self:center;max-width:720px;text-align:center;font-size:14px;background:var(--paper-2);border:1.5px solid var(--line);border-radius:8px;padding:6px 12px;min-height:0}
  main.withdock>.log:empty{visibility:hidden}
  .stage .bg{position:absolute;inset:0;height:100%}
  .bubble{font-size:14.5px;line-height:1.27;padding:6px 12px 7px}
  .intent{padding:4px 8px 4px 6px}
  .dock{left:calc(50% - var(--cw)/2);right:calc(50% - var(--cw)/2);z-index:6;background:none;padding-left:0;padding-right:0;padding-top:0}
  .dock .banner{box-shadow:var(--shadow)}
  .fanwrap{margin:0}
  main:not(.withdock){align-items:center}
  .ts-title{font-size:104px}
  main:not(.withdock)>.sheet{width:min(860px,100%)}
  .route{grid-template-columns:repeat(5,1fr)}
  .check-head{flex-wrap:wrap;row-gap:2px}
}
/* Short landscape windows (below the 690 px design height): shrink the hand a little to give the office and checklist room. */
@media (orientation:landscape) and (min-width:900px) and (min-height:540px) and (max-height:689px){
  .fanwrap{transform:scale(.84);transform-origin:50% 100%}
  main.withdock{padding-bottom:calc(var(--fanh,306px)*.84 + 4px)}
  .bubble{font-size:14px}
}
/* Phones turned sideways are too short for the hand: ask to rotate. */
@media (orientation:landscape) and (max-height:500px) and (pointer:coarse){
  #rotate{display:grid;place-items:center;position:fixed;inset:0;z-index:200;background:var(--wall);text-align:center;padding:24px}
  #rotate b{display:block;font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;margin-bottom:6px}
  #rotate span{font-size:15px;color:var(--muted)}
}
</style>

let S, META={carry:null};
try{META.carry=JSON.parse(localStorage.getItem('ft1p.carry'))||null}catch(e){}
function saveCarry(){try{localStorage.setItem('ft1p.carry',JSON.stringify(META.carry))}catch(e){}}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function reg(c){S.cards[c.uid]=c;return c}
function mkDoc(doc,form='original',extra={}){return reg({uid:S.uid++,kind:'doc',doc,form,...extra})}
function mkAct(key){return reg({uid:S.uid++,kind:'act',key})}
function addToDeck(c){S.deck.push(c.uid);return c}
function hasRelic(k){return S.relics.includes(k)}
function cur(){return OFFICES[S.officeIdx]}
const clerkName=d=>`${d.title} ${d.clerk}`;
function C(uid){return S.cards[uid]}
function timeCost(c){if(c.kind==='doc')return 0;if(c.key==='notary'&&hasRelic('notaryneighbor'))return 1;return ACTIONS[c.key].time}
function patCost(c){if(c.kind==='doc')return 0;const p=ACTIONS[c.key].pat||0;return p&&hasRelic('policeuncle')?p-1:p}
function docName(doc,form){return DOCS[doc].single?DOCS[doc].name:`${DOCS[doc].name} (${FORM[form].toLowerCase()})`}
const isFeeRow=r=>!!DOCS[r.doc].fee;
const STAMPS=['stamp_mun','stamp_fed','stamp_adm'];
function accepts(r,c){if(isFeeRow(r))return c.kind==='doc'&&c.doc===DOCS[r.doc].fee;return c.kind==='doc'&&r.doc===c.doc&&(r.form===c.form||(r.form==='alt'&&(c.form==='original'||c.form==='certified')))}
// Clerk keeps: copies, certified copies, stamps, photos, and any original handed in for an "original or certified copy" item.
function keeps(c,r){return c.form!=='original'||!!DOCS[c.doc].single||r.form==='alt'}

function newRun(){
  S={v:9,keeping:null,paused:null,screen:'intro',patience:80,maxP:80,relics:[],cards:{},deck:[],uid:1,officeIdx:0,office:null,
     overlays:[],target:null,confirm:null,log:'',choices:null,result:null,pending:null,stats:{turns:0,detours:0,bribes:0,paid:0},carried:null};
  [mkDoc('id'),mkDoc('birth'),mkDoc('birth'),mkDoc('rental'),mkDoc('utility'),mkDoc('joboffer'),mkDoc('stamp_mun'),mkDoc('stamp_fed'),mkDoc('stamp_fed'),mkDoc('stamp_adm'),mkDoc('photo'),mkDoc('photo'),
   mkAct('wait'),mkAct('wait'),mkAct('breath'),mkAct('smile'),mkAct('photocopy'),mkAct('photocopy'),mkAct('notary'),mkAct('rulebook'),mkAct('envelope')
  ].forEach(addToDeck);
  addToDeck(mkDoc(rnd(STRANGE)));
  if(META.carry&&DOCS[META.carry.doc]){addToDeck(mkDoc(META.carry.doc,META.carry.form));S.carried=META.carry}
}

/* ============ office loop ============ */
function enterOffice(){
  const d=cur();
  S.office={rows:d.rows.map(([doc,form])=>({doc,form,done:false})),rulesLeft:d.rules.slice(),ft1pFired:false,
    turnsLeft:d.turns,turn:0,draw:shuffle(S.deck),hand:[],discard:[],exhaust:[],time:3,bonusTime:0,timePenalty:0,
    intent:null,skipIntent:false,story:0,usedGossip:[]};
  S.screen='office';S.target=null;S.confirm=null;
  S.log=`${clerkName(d)} looks up from her screen. Then back down.`.replace('her',d.title==='Mr.'?'his':'her');
  S.office.intent=rollIntent();
  startTurn();
}
function startTurn(){
  const o=S.office;o.turn++;S.stats.turns++;
  o.time=Math.max(0,3+o.bonusTime-o.timePenalty);o.bonusTime=0;o.timePenalty=0;
  drawN(Math.max(0,HAND_SIZE-o.hand.length));rollGossip();
}
function drawN(n){
  const o=S.office;
  for(let i=0;i<n;i++){
    if(o.hand.length>=12)break;
    if(!o.draw.length){if(!o.discard.length)break;o.draw=shuffle(o.discard);o.discard=[]}
    o.hand.push(o.draw.pop());
  }
}
// Each turn, sometimes the clerks drop a hint about what the clerk does next (queued between story scenes).
function rollGossip(){
  const o=S.office;
  GB.tell=Math.random()<.45&&GOSSIP_TELL[o.intent.type]?rnd(GOSSIP_TELL[o.intent.type]).slice():null;
}
function rollIntent(){
  const o=S.office,dmg=cur().dmg+Math.floor(o.turn/2);
  const opts=[{type:'sigh',w:3},{type:'break',w:1.5},{type:'phone',w:1.2}];
  if(o.rulesLeft.length&&o.turn>=1)opts.push({type:'rule',w:3});
  if(o.turn>=1&&o.rows.some(r=>r.done&&!r.ft1p&&!r.bribed))opts.push({type:'reject',w:1.6});
  let t=Math.random()*opts.reduce((s,x)=>s+x.w,0),pick=opts[0];
  for(const x of opts){t-=x.w;if(t<=0){pick=x;break}}
  const it={type:pick.type,dmg};
  if(it.type==='sigh'){it.name='Sighs loudly';it.effect=`−${dmg} patience`}
  if(it.type==='rule'){it.name='Remembers a new rule';it.effect='+1 item on the form, −1 patience'}
  if(it.type==='reject'){it.name='"This one is not valid"';it.effect='Un-ticks one item'}
  if(it.type==='break'){it.dmg=Math.max(1,dmg-1);it.name='Coffee break';it.effect=`−${it.dmg} patience, −1 time next turn`}
  if(it.type==='phone'){it.name='Personal phone call';it.effect='Nothing happens'}
  it.text=`${it.name}. ${it.effect}`;
  return it;
}
function loseP(n){if(n<=0)return;S.patience=Math.max(0,S.patience-n);if(S.patience<=0){S.screen='end';S.result='lose';S.overlays=[];S.target=null;S.confirm=null}}
function hit(n){if(hasRelic('thickskin'))n=Math.max(0,n-1);loseP(n);return n}
function pileCards(){const o=S.office;return [...o.hand,...o.draw,...o.discard].map(C)}
function inFolder(r){return pileCards().some(c=>accepts(r,c))}
function rowFor(c){const rs=S.office.rows.filter(r=>!r.done&&accepts(r,c));return rs.find(r=>r.form===c.form)||rs[0]}
function argueRow(){const rs=S.office.rows.filter(r=>r.added&&!r.done);return rs[rs.length-1]}
function handHas(f){return S.office.hand.some(u=>f(C(u)))}
const isOriginalCopyable=c=>c.kind==='doc'&&c.form==='original'&&!DOCS[c.doc].single;
const isCopy=c=>c.kind==='doc'&&c.form==='copy';

function canPlay(c){
  const o=S.office;
  if(timeCost(c)>o.time)return false;
  if(c.kind==='doc')return !!rowFor(c);
  if(patCost(c)>=S.patience)return false;
  switch(c.key){
    case 'photocopy':case 'backdoor':return handHas(isOriginalCopyable);
    case 'notary':return handHas(isCopy);
    case 'envelope':return o.rows.some(r=>!r.done);
    case 'argue':return !!argueRow();
  }
  return true;
}
function whyNot(c){
  if(timeCost(c)>S.office.time)return 'Not enough time left this turn.';
  if(c.kind==='doc')return `Nobody here asked for ${docName(c.doc,c.form)}.`;
  if(patCost(c)>=S.patience)return 'You don\'t have the nerves for that right now.';
  if(c.key==='photocopy'||c.key==='backdoor')return 'You need an original document in your hand first.';
  if(c.key==='notary')return 'You need a copy in your hand to notarize.';
  if(c.key==='argue')return 'There is no new rule to argue about.';
  return 'Not now.';
}
function removeFromHand(uid){const o=S.office;o.hand.splice(o.hand.indexOf(uid),1)}
function handIn(c,r){
  const o=S.office,d=cur();removeFromHand(c.uid);r.done=true;o.fresh=o.rows.indexOf(r);
  if(keeps(c,r)){S.deck=S.deck.filter(u=>u!==c.uid);
    S.log=r.form==='alt'&&c.form==='original'?`${clerkName(d)} files your original ${DOCS[c.doc].name}. It's gone for good.`:`${clerkName(d)} files your ${docName(c.doc,c.form)}. You won't see it again.`}
  else{o.discard.push(c.uid);S.log=`${clerkName(d)} glances at your ${DOCS[c.doc].name} and hands it back.`}
  afterRows();
}
function useAction(c,tgt){
  const o=S.office,d=cur(),a=ACTIONS[c.key];
  o.time-=timeCost(c);removeFromHand(c.uid);loseP(patCost(c));if(S.screen==='end')return;
  if(a.burn)S.deck=S.deck.filter(u=>u!==c.uid);else (a.once?o.exhaust:o.discard).push(c.uid);
  switch(c.key){
    case 'wait':drawN(3);loseP(1);S.log='The queue moves. Barely.';break;
    case 'breath':S.patience=Math.min(S.maxP,S.patience+3);S.log='In for four. Out for four.';break;
    case 'smile':drawN(2);S.log=`${clerkName(d)} does not smile back. You use the moment to dig through your papers.`;break;
    case 'rulebook':if(o.intent.type==='rule'||o.intent.type==='reject'){o.skipIntent=true;S.log='You quote the regulation, article and paragraph. She lets it go.'}else{o.guard=true;S.log='You keep the rulebook open on the counter.'}break;
    case 'photocopy':{const n=mkDoc(tgt.doc,'copy',{temp:true});o.hand.push(n.uid);S.log=`Copy of ${DOCS[tgt.doc].name} added to your hand for this office.`;break}
    case 'backdoor':{const n=mkDoc(tgt.doc,'certified',{temp:true});o.hand.push(n.uid);S.log=`The notary owes you one. Certified copy of ${DOCS[tgt.doc].name}, no questions.`;break}
    case 'notary':tgt.form='certified';S.log=`Your copy of ${DOCS[tgt.doc].name} is now certified.`;break;
    case 'envelope':tgt.done=true;tgt.bribed=true;o.fresh=o.rows.indexOf(tgt);S.stats.bribes++;S.log='A small envelope changes hands. Your wallet feels lighter. Your conscience too, somehow.';return afterRows();
    case 'coffee':o.skipIntent=true;S.log=`${clerkName(d)} accepts the coffee. "Just this once."`;break;
    case 'cousin':o.skipIntent=true;drawN(2);S.log='Your cousin knows a guy who knows her supervisor.';break;
    case 'argue':{const r=argueRow();o.rows.splice(o.rows.indexOf(r),1);loseP(4);S.log='You win the argument. It costs you.';if(S.screen==='end')return;return afterRows()}
    case 'number':o.bonusTime+=2;S.log='Ticket 247. Now serving: 231.';break;
  }
}
// Copies you made this office stay in your hand until you use them; everything else is discarded at end of turn.
function ownedDocs(){return [...S.deck].map(C).filter(c=>c.kind==='doc')}
// End of turn: you always pick which cards to keep (0 to KEEP_MAX); the rest are discarded. Keeping none redraws a fresh hand.
function requestEndTurn(){
  const o=S.office;S.target=null;S.confirm=null;
  if(!o.hand.length)return endTurn([]);
  S.keeping=[];
}
function toggleKeep(uid){const k=S.keeping,i=k.indexOf(uid);if(i>=0)k.splice(i,1);else if(k.length<KEEP_MAX)k.push(uid)}
function afterRows(){
  const o=S.office,d=cur(),left=o.rows.filter(r=>!r.done).length;
  if(left===0)return officeDone();
  if(left===1&&!o.ft1pRolled){
    o.ft1pRolled=true;
    const last=S.officeIdx===OFFICES.length-1;
    if(!(Math.random()<FT1P_CHANCE||(last&&!S.stats.ft1p)))return;
    o.ft1pFired=true;S.stats.ft1p=(S.stats.ft1p||0)+1;o.rows.push({doc:d.ft1p,form:'original',ft1p:true});
    S.overlays.push({stamp:'Fali ti jedan papir',text:`"You're missing one paper." ${clerkName(d)} also needs your ${DOCS[d.ft1p].name}. You have never heard of this document.`,
      hint:`Tap "Go get it" next to it on the form, or slip her a Small Envelope.`});
    if(hasRelic('insider')){drawN(2);o.time+=1;S.log='Your friend inside slips you a tip.'}
  }
}
function endTurn(keep){
  const o=S.office,d=cur();
  S.target=null;S.confirm=null;S.keeping=null;
  keep=(keep||[]).filter(u=>o.hand.includes(u)).slice(0,KEEP_MAX);
  o.discard.push(...o.hand.filter(u=>!keep.includes(u)));o.hand=keep;
  if(o.pendingPaper){o.hand.push(o.pendingPaper);o.pendingPaper=null}
  const it=o.intent;
  if(o.guard&&(it.type==='rule'||it.type==='reject'))o.skipIntent=true;
  o.guard=false;
  const who=clerkName(d),head=`${who}'s turn`;let ann;
  if(o.skipIntent){o.skipIntent=false;ann={head,stamp:'Blocked',violet:true,text:`${who} was about to act (${it.name.toLowerCase()}), but didn't.`}}
  else switch(it.type){
    case 'sigh':{const t=hit(it.dmg);ann={head,stamp:`−${t} patience`,text:`${who} sighs loudly, looks at the clock, and sighs again.`};break}
    case 'rule':{const [doc,form]=o.rulesLeft.shift();o.rows.push({doc,form,added:true});loseP(1);ann={head,stamp:'New rule',violet:true,text:`"Ah, I almost forgot." You also need: ${docName(doc,form)}. It's on the form now. −1 patience.`};break}
    case 'reject':{const rs=o.rows.filter(r=>r.done&&!r.ft1p&&!r.bribed&&!r.paid);if(rs.length){const r=rnd(rs);r.done=false;ann={head,stamp:'Un-ticked',violet:true,text:`"${isFeeRow(r)?'This fee stamp is from the old series':'This '+DOCS[r.doc].name+' is the old format'}." That item is no longer ticked. Hand in another one.`}}else ann={head,stamp:'Nothing',violet:true,text:`${who} looks for a problem and, for once, finds none.`};break}
    case 'break':{const t=hit(it.dmg);o.timePenalty=1;ann={head,stamp:`−${t} patience`,text:'"Back in fifteen minutes." It takes forty. You also get 1 less time next turn.'};break}
    case 'phone':ann={head,stamp:'Nothing',violet:true,text:'A long phone call about a cousin\'s wedding. You wait. Nothing else happens.'};break;
  }
  S.log=`${ann.stamp}: ${ann.text}`;
  if(S.screen==='end')return;
  ann.itype=it.type;S.overlays.push(ann);
  o.turnsLeft--;
  if(o.turnsLeft<=0){
    o.turnsLeft=d.turns;o.turn=0;loseP(5);
    S.overlays.push({head:'End of the day',stamp:'Closed',violet:true,text:'The window closes at 15:00 sharp. Come back tomorrow. −5 patience. Ticked items still count.'});
  }
  if(S.screen==='end')return;
  o.intent=rollIntent();startTurn();
}
function officeDone(){
  const d=cur();S.target=null;S.confirm=null;
  S.deck=S.deck.filter(u=>!C(u).temp);
  if(!d.reward){S.screen='end';S.result='win';return}
  addToDeck(mkDoc(d.reward,'original'));
  const notOwned=STRANGE.filter(x=>!ownedDocs().some(c=>c.doc===x)&&OFFICES.slice(S.officeIdx+1).some(o=>o.ft1p===x));
  const docPick=notOwned.length&&Math.random()<0.6?mkDoc(rnd(notOwned)):mkDoc(rnd([...STAMPS,'photo','birth','utility']));
  S.screen='reward';S.choices=[...shuffle(REWARD_POOL).slice(0,2).map(k=>mkAct(k).uid),docPick.uid];
}

/* ============ paying a fee at the bank (costs the rest of your turn) ============ */
function payAtBank(i){
  const o=S.office,r=o.rows[i];if(!r||r.done||!isFeeRow(r))return;
  r.done=true;r.paid=true;o.fresh=i;S.stats.paid++;S.target=null;S.confirm=null;
  S.overlays.push({head:'Bank, two streets away',stamp:'Paid',violet:true,text:'You queue at the bank, pay the fee, and come back with a stamped payment slip. The rest of your turn is gone.'});
  afterRows();
  if(S.screen==='office')requestEndTurn();
}

/* ============ errands (leaving the window) ============ */
function errandFor(r){
  const key=r.ft1p?r.doc:DOCS[r.doc].single?r.doc:r.form==='original'?'any':'copy';
  const getForm=r.form==='alt'?'certified':r.form;
  return {...PLACES[key]||PLACES.any,get:docName(r.doc,getForm),doc:r.doc,form:getForm};
}
// An errand costs the rest of your turn: the clerk acts while you are away. The paper is in your hand next turn.
function goErrand(){
  const o=S.office,r=o.rows[S.pending];if(!r||r.done){S.screen='office';return}
  const e=errandFor(r);
  const c=addToDeck(mkDoc(e.doc,e.form));
  S.stats.detours++;o.pendingPaper=c.uid;S.screen='office';
  S.overlays.push({head:e.place,stamp:'Obtained',violet:true,text:`${e.text} ${e.get} will be in your hand next turn. While you were away, the window kept working.`});
  requestEndTurn();
}
function backToWindow(){const o=S.office,d=cur();o.intent=rollIntent();startTurn();S.screen='office';S.log=`Next morning, back at ${d.window}. ${clerkName(d)} does not remember you.`}

/* ============ between offices & runs ============ */
function pickReward(uid){if(uid)addToDeck(C(uid));S.officeIdx++;S.screen='stop';S.choices=shuffle(Object.keys(STOPS)).slice(0,3)}
function pickStop(k){
  if(k==='drawer'){const pool=STRANGE.filter(x=>!ownedDocs().some(c=>c.doc===x)&&OFFICES.slice(S.officeIdx).some(o=>o.ft1p===x));const x=pool.length?rnd(pool):rnd(STRANGE);
    addToDeck(mkDoc(x));S.overlays.push({head:"Your aunt's drawer",stamp:'Found',violet:true,text:`Between old phone bills and a 1987 calendar: your ${DOCS[x].name}. It joins your cards.`});enterOffice();return}
  if(k==='cafe'){S.patience=Math.min(S.maxP,S.patience+10);enterOffice()}
  else if(k==='kiosk'){STAMPS.forEach(x=>addToDeck(mkDoc(x)));addToDeck(mkDoc('photo'));enterOffice()}
  else if(k==='copyshop')S.screen='copyshop';
  else if(k==='shred')S.screen='shred';
  else if(k==='cousin'){S.screen='relic';S.choices=shuffle(Object.keys(RELICS).filter(r=>!hasRelic(r))).slice(0,2)}
}
function carryOptions(){
  const seen=new Set(),out=[];
  S.deck.map(C).filter(c=>c.kind==='doc'&&!c.temp).forEach(c=>{const k=c.doc+'|'+c.form;if(!seen.has(k)){seen.add(k);out.push(c)}});
  return out;
}

function endBtnHTML(o,d){
  const n=d.turns,left=o.turnsLeft,cx=80,cy=80,rs=74.5,span=168,gap=n>5?4:5,seg=(span-gap*(n-1))/n;
  const pt=(a,r)=>[(cx+r*Math.sin(a*Math.PI/180)).toFixed(2),(cy-r*Math.cos(a*Math.PI/180)).toFixed(2)];
  const arc=(a0,a1,r)=>{const [x0,y0]=pt(a0,r),[x1,y1]=pt(a1,r);return `M${x0} ${y0}A${r} ${r} 0 0 1 ${x1} ${y1}`};
  // Segments fill from the left: the rightmost lit one goes out each turn.
  const segs=Array.from({length:n},(_,i)=>{const a0=-span/2+i*(seg+gap);return `<path class="seg ${i<left?'on':''}" d="${arc(a0,a0+seg,rs)}"/>`}).join('');
  const playable=o.hand.some(u=>canPlay(C(u)));
  const cls=[left<=1?'low':'',S.keeping?'keepmode':'',!S.keeping&&!S.target&&!S.confirm&&!playable?'ready':''].join(' ');
  const lbl=left<=1?'Last turn today':`${left} turns left`;
  return `<button class="endbtn ${cls}" data-act="end" aria-label="${S.keeping?`Keep ${S.keeping.length} cards, discard the rest and end turn`:'End turn'}. ${left} of ${n} turns left before the window closes.">
    <svg viewBox="0 0 160 160" aria-hidden="true"><circle class="bezel" cx="80" cy="80" r="69.5"/>${segs}
      <path id="arcp" d="${arc(-62,62,63.5)}" fill="none"/><text class="arcl" dy="3.3"><textPath href="#arcp" startOffset="50%" text-anchor="middle">${lbl}</textPath></text></svg>
    <span class="face"><span class="et">${S.keeping?(S.keeping.length?`Keep ${S.keeping.length}`:'Keep none'):'End turn'}</span></span></button>`;
}
function officeView(){

    const canCopy=!r.done&&!have&&!isFee&&r.form!=='original'&&pileCards().some(c=>c.kind==='doc'&&c.doc===r.doc&&c.form==='original');

    <div class="fanwrap">
      <div class="lane fan">${fanHTML(o.hand)}</div>
      <button class="pilebtn l" data-act="view" data-v="deck" aria-label="Draw pile, ${o.draw.length} cards"><b>${o.draw.length}</b><span>Draw</span></button>
      <button class="pilebtn r" data-act="view" data-v="deck" aria-label="Used pile, ${o.discard.length+o.exhaust.length} cards"><b>${o.discard.length+o.exhaust.length}</b><span>Used</span></button>

function rulesBody(){return `      <p>You got the job. Your employer pays salaries only into a local bank account, and your first payday is soon. The bank wants your Employment Registration. The employment bureau wants a Tax Number. The tax office wants a Certificate of Residence. The police want a Citizenship Certificate. The registry wants your birth certificate. You have 80 patience.</p>

        <li>Shady actions (dashed border) also cost <b>patience</b>, shown with a red heart. Patience is your health. At zero you give up.</li>
        <li>Copies, stamps and photos are kept by the clerk. Originals come back, unless the line says "original or certified copy" and you hand over the original.</li>
        <li>Sometimes, just when one line is left, the clerk says <b>fali ti jedan papir</b> and asks for a strange paper. You might already have it: strange papers turn up in your starting cards, as rewards, and in your aunt's drawer. If not, tap <b>Go get it</b> or bribe it.</li>

        <li><b>Controls.</b> Touch: tap a card to play, hold to look, slide up to play what you're looking at. Mouse: hover to look, click to play. Keys: 1–9 play a card, Space ends the turn, Esc cancels or pauses, P pause, M map, C cards. The ☰ Menu button pauses the game.</li>
        <li>When the run ends, keep one paper for the next run.</li>

/* ============ music ============
   Two looping tracks: the menu theme on the title and rules screens, and the in-game track during a run
   (office, errands, rewards, stops). Switching crossfades between them; pausing turns the in-game track down
   to a murmur; the end-of-run screen is quiet. Browsers only allow sound after the player has touched or
   clicked the page, so the first tap anywhere starts it. One on/off setting covers both, remembered per device. */
const TRACKS={menu:{src:'waiting-room-shuffle.mp3',vol:.55},game:{src:'ingame-music.mp3',vol:.38}};
const MENU_SCREENS=['intro','rules'],QUIET_SCREENS=['closed','end'];
for(const t of Object.values(TRACKS)){t.a=typeof Audio==='function'?new Audio(t.src):null;if(t.a){t.a.loop=true;t.a.preload='auto';t.a.volume=0}t.fade=null;t.target=-1}
let musicOn=true;
try{musicOn=localStorage.getItem('ft1p.music')!=='off'}catch(e){}
function fadeTrack(t,v,ms){const a=t.a;if(!a||t.target===v)return;t.target=v;clearInterval(t.fade);
  if(v>0&&a.paused){const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{t.target=-1})}
  const from=a.volume,t0=Date.now();
  t.fade=setInterval(()=>{const k=Math.min(1,(Date.now()-t0)/ms);a.volume=Math.max(0,Math.min(1,from+(v-from)*k));
    if(k>=1){clearInterval(t.fade);if(v===0)a.pause()}},40)}
function musicSync(){
  if(!S)return;
  const want=!musicOn||QUIET_SCREENS.includes(S.screen)?null:MENU_SCREENS.includes(S.screen)?'menu':'game';
  const m=TRACKS.menu,g=TRACKS.game;
  // a play() refused before the first tap leaves the track paused: try again on the next sync
  for(const t of [m,g])if(t.a&&t.a.paused&&t.target>0)t.target=-1;
  fadeTrack(m,want==='menu'?m.vol:0,want==='menu'?900:1000);
  fadeTrack(g,want==='game'?(S.paused?g.vol*.3:g.vol):0,want==='game'?(S.paused?350:1400):700);
}
function soundBtn(light){return `<button class="ts-sound ${light?'light':''}" data-act="music" aria-label="${musicOn?'Turn music off':'Turn music on'}" aria-pressed="${musicOn}">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${musicOn?'<path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>':'<path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'}</svg></button>`}
// First touch / click / key anywhere unlocks audio (browser autoplay rule).
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>musicSync(),{capture:true,passive:true}));
// Title logo: shrink the type until both lines fit the screen (fallback fonts are wider than Barlow Condensed).
function fitTitle(){const t=$app.querySelector('.ts-title');if(!t)return;t.style.fontSize='';
  const max=Math.min(innerWidth,$app.clientWidth||innerWidth)*0.9;let f=parseFloat(getComputedStyle(t).fontSize),n=0;
  while(t.scrollWidth>max&&f>30&&n++<40){f-=2;t.style.fontSize=f+'px'}}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(S)fitTitle()});
/* ============ gossip bubbles ============
   The clerks talk continuously while you are at the window: one line at a time, a short gap between lines,
   a longer one between scenes. The office's STORY plays in order (progress is saved in the run); a hint about
   the clerk's next move can slip in between scenes; once the story is told, they fall back to small talk.
   Everything waits while an announcement, a side page or the pause menu is open. Tap a bubble to skip it.
   This runs on timers outside render(); render() only re-attaches the current bubble. */
const GB={line:null,t:null,on:false,tell:null,small:[],office:-1};
function drawBubble(anim){
  const stage=$app.querySelector('.stage');if(!stage)return;
  const old=stage.querySelector('.bubble');if(old)old.remove();
  const ln=GB.line;if(!ln)return;
  const d=cur(),[w,l]=ln,clerk=w==='C';
  const el=document.createElement('div');
  el.className=`bubble ${clerk?'c':'k'} ${anim?'pop':''}`;el.setAttribute('role','status');el.dataset.gb='1';
  el.innerHTML=`<b>${esc(clerk?d.clerk:d.pal+', next window')}</b>${esc(l)}`;
  stage.appendChild(el);
  aimBubble(stage,el,d.name);
}
// Where each clerk's face ends on the right, as a fraction of the portrait's width (the bubble starts just past it).
const FACE_RIGHT={'Registry':.68,'Police':.66,'Tax Office':.70,'Bureau':.67,'Bank':.70};
// The bubble sits just above the next-action box, beside the clerk's face, with a short tail toward her.
// The portrait is scaled to fit its box (object-fit: contain, anchored bottom-left), so the drawn picture's width is worked out first.
function aimBubble(stage,el,office){
  const it=stage.querySelector('.intent');if(it)stage.style.setProperty('--ib',it.offsetHeight+'px');
  const img=stage.querySelector('.portrait'),fr=FACE_RIGHT[office];if(!img||!fr||!el.classList.contains('c'))return;
  if(!img.naturalWidth){img.addEventListener('load',()=>{if(el.isConnected)aimBubble(stage,el,office)},{once:true});return}
  const W=stage.clientWidth,iw=img.clientWidth,ih=img.clientHeight,k=Math.min(iw/img.naturalWidth,ih/img.naturalHeight);
  const face=img.offsetLeft+fr*img.naturalWidth*k;
  el.style.left=Math.round(Math.max(W*.34,Math.min(W*.5,face+14)))+'px';
}
function gbLater(fn,ms){clearTimeout(GB.t);GB.t=setTimeout(fn,ms)}
function nextLine(){
  const o=S.office,sc=STORY[cur().name]||[];
  const atBreak=o.story===0||sc[o.story-1]===null||o.story>=sc.length;
  if(GB.tell&&GB.tell.length&&atBreak&&!GB.inTell){GB.small=GB.tell;GB.tell=null;GB.inTell=true}
  if(GB.small.length)return {line:GB.small.shift()};
  GB.inTell=false;
  if(o.story<sc.length){const ln=sc[o.story++];return ln?{line:ln}:{gap:4200+Math.random()*2500}}
  // story told: small talk now and then
  const pool=GOSSIP_LIFE[cur().clerk],idx=pool.map((x,i)=>i).filter(i=>!o.usedGossip.includes(i)),k=idx.length?rnd(idx):Math.floor(Math.random()*pool.length);
  o.usedGossip.push(k);GB.small=pool[k].slice();
  return {gap:9000+Math.random()*7000};
}
function gossipStep(){
  if(!S||S.screen!=='office'||!S.office){GB.on=false;GB.line=null;return}
  if(S.overlays.length||S.view||S.paused){gbLater(gossipStep,700);return}
  const old=$app.querySelector('.stage .bubble');
  if(GB.line){GB.line=null;if(old){old.classList.remove('pop');old.classList.add('out')}gbLater(gossipStep,650+Math.random()*500);return}
  if(old)old.remove();
  const n=nextLine();
  if(n.gap){gbLater(gossipStep,n.gap);return}
  GB.line=n.line;drawBubble(true);
  gbLater(gossipStep,2300+n.line[1].length*55);
}
function gossipTick(){
  const o=S.office;
  if(S.screen!=='office'||!o){if(GB.on){clearTimeout(GB.t);GB.on=false;GB.line=null}return}
  if(GB.office!==S.officeIdx){GB.office=S.officeIdx;GB.small=[];GB.inTell=false;GB.line=null;GB.on=false}
  if(o.story==null)o.story=0;
  if(!GB.on){GB.on=true;gbLater(gossipStep,1400)}
  else if(GB.line)drawBubble(false);
}
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('[data-gb]')){e.stopPropagation();if(GB.line)gossipStep()}},true);

/* ============ input ============ */
// Layout switches between portrait and landscape: redraw (fan geometry depends on the width).
// Big landscape screens: scale the whole layout up from a 1280×800 baseline (Steam Deck size) so it doesn't look lost.
const LANDSCAPE='(orientation:landscape) and (min-width:900px) and (min-height:540px)';
function fitScreen(){
  const land=matchMedia(LANDSCAPE).matches,z=land?Math.max(1,Math.min(innerWidth/1100,innerHeight/690,1.9)):1,r=document.documentElement.style;
  r.setProperty('--z',z);r.setProperty('--lvh',(innerHeight/z/100)+'px');r.setProperty('--lvw',(innerWidth/z/100)+'px');
  $app.style.zoom=z===1?'':String(z);
}
fitScreen();
let rsT=null;addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{fitScreen();if(S)render()},120)});
function tapCard(uid){
  const c=C(uid),tg=S.target;
  if(S.keeping){toggleKeep(uid);return}
  if(tg){
    if(tg.src===uid){S.target=null;return}
    const ok=(tg.type==='original'&&isOriginalCopyable(c))||(tg.type==='copy'&&isCopy(c));
    if(ok){S.target=null;useAction(C(tg.src),c)}
    return;
  }
  if(S.confirm){S.confirm=null}
  if(!canPlay(c)){S.log=whyNot(c);return}
  if(c.kind==='doc'){const r=rowFor(c);
    if(r.form==='alt'&&c.form==='original'){S.confirm={uid,row:S.office.rows.indexOf(r)};return}
    return handIn(c,r)}
  if(ACTIONS[c.key].target){S.target={type:ACTIONS[c.key].target,src:uid};return}
  useAction(c);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,uid=+b.dataset.uid;
  if(S.paused){if(!['resume','pauseMenu','pauseRules','music','endRun','endRunYes'].includes(a))return}
  else{if(S.overlays.length&&a!=='dismiss')return;
  if(S.view&&a!=='view')return;}
  switch(a){
    case 'dismiss':S.overlays.shift();break;
    case 'view':S.view=b.dataset.v||null;break;
    case 'start':enterOffice();break;
    case 'rules':S.screen='rules';break;
    case 'pause':S.paused='menu';S.target=null;S.confirm=null;break;
    case 'resume':S.paused=null;break;
    case 'pauseMenu':S.paused='menu';break;
    case 'pauseRules':S.paused='rules';break;
    case 'endRun':S.paused='confirm';break;
    case 'endRunYes':S.paused=null;newRun();break;
    case 'title':S.screen='intro';break;
    case 'music':musicOn=!musicOn;try{localStorage.setItem('ft1p.music',musicOn?'on':'off')}catch(_){}break;
    // Quit: a web page can only close itself if a script opened it, so fall back to a "closed" screen.
    case 'quit':S.screen='closed';render();try{window.close()}catch(_){}return;
    case 'card':tapCard(uid);break;
    case 'confirmYes':{const cf=S.confirm;S.confirm=null;handIn(C(cf.uid),S.office.rows[cf.row]);break}
    case 'row':{const tg=S.target;if(tg&&tg.type==='row'){const r=S.office.rows[+b.dataset.i];if(!r.done){S.target=null;useAction(C(tg.src),r)}}break}
    case 'cancel':S.target=null;S.confirm=null;break;
    case 'end':if(S.keeping)endTurn(S.keeping);else requestEndTurn();break;
    case 'keepCancel':S.keeping=null;break;
    case 'pay':payAtBank(+b.dataset.i);break;
    case 'fetch':S.pending=+b.dataset.i;S.target=null;S.confirm=null;S.screen='errand';break;
    case 'errandGo':goErrand();break;
    case 'stay':S.screen='office';break;
    case 'back':backToWindow();break;
    case 'reward':pickReward(uid||null);break;
    case 'stop':pickStop(b.dataset.k);break;
    case 'relic':S.relics.push(b.dataset.k);enterOffice();break;
    case 'copy':{if(uid){const c=C(uid);addToDeck(mkDoc(c.doc,'copy'));addToDeck(mkDoc(c.doc,'copy'))}enterOffice();break}
    case 'shred':if(uid)S.deck=S.deck.filter(u=>u!==uid);enterOffice();break;
    case 'carry':{if(uid){const c=C(uid);META.carry={doc:c.doc,form:c.form}}else META.carry=null;saveCarry();newRun();break}
  }
  render();
});

/* ============ hand gestures ============
   Tap a card            -> play it (lifts slightly the moment you touch it, plays on release).
   Hold ~0.28 s          -> big preview above the fan. Release to close, nothing is played.
   Slide sideways        -> preview follows your finger through the hand (with a little "stickiness" so it doesn't flicker).
   While previewing, slide UP out of the fan -> "Release to play", let go to play it.
   Other screens: hold a card to enlarge it. */
if(typeof document.createElement==='function'){
  const HOLD_MS=280,OTHER_MS=240,SLIDE_PX=14,STICKY_DEG=2.5;
  const pk=document.createElement('div');pk.id='peek';pk.hidden=true;document.body.appendChild(pk);
  let g=null,swallow=false;
  const fanCards=()=>[...document.querySelectorAll('.lane.fan .card[data-uid]')];
  function fingerAngle(x,y){const b=document.querySelector('.endbtn');if(!b)return 0;const r=b.getBoundingClientRect();return Math.atan2(x-(r.left+r.width/2),(r.top+r.height/2)-y)*180/Math.PI}
  // Cards share one pivot (the End-turn button centre): the card under the finger is the one whose angle is closest.
  function cardAt(x,y,cur){const a=fingerAngle(x,y);let best=null,bd=1e9;for(const el of fanCards()){const d=Math.abs(+el.dataset.ang-a);if(d<bd){bd=d;best=el}}
    if(cur&&best&&best!==cur&&Math.abs(+cur.dataset.ang-a)-bd<STICKY_DEG)return cur;return best}
  const verb=c=>S.keeping?(S.keeping.includes(c.uid)?'drop':'keep'):c.kind==='doc'?'hand in':'play';
  let ptr='touch',hv=null;
  function label(c,launch){
    if(S.screen!=='office'||!S.office||!S.office.hand.includes(c.uid)||S.confirm)return '';
    if(S.target)return '';
    if(!S.keeping&&!canPlay(c))return `<span class="pk-lbl no">${esc(whyNot(c))}</span>`;
    if(launch)return `<span class="pk-lbl go">Release to ${verb(c)}</span>`;
    return ptr==='mouse'?`<span class="pk-lbl hint">Click to ${verb(c)}</span>`:`<span class="pk-lbl hint">↑ Slide up to ${verb(c)}</span>`;
  }
  function place(el,fan){
    const vw=innerWidth,vh=innerHeight,W=118,H=194;
    if(fan){
      const wrap=el.closest('.fanwrap').getBoundingClientRect(),top=wrap.top+10;
      const s=Math.max(1.1,Math.min(1.75,(top-64)/H,(vw-28)/W)),w=W*s,h=H*s,r=el.getBoundingClientRect();
      const cx=Math.max(w/2+10,Math.min(vw-w/2-10,r.left+r.width/2));
      pk.style.setProperty('--s',s);pk.style.left=cx+'px';pk.style.top=Math.max(8,top-h-38)+'px';pk.classList.remove('center');
    }else{
      const s=Math.min(1.8,(vh-80)/H,(vw-28)/W),h=H*s;
      pk.style.setProperty('--s',s);pk.style.left=vw/2+'px';pk.style.top=Math.max(8,(vh-h)/2-16)+'px';pk.classList.add('center');
    }
  }
  function preview(el,fan,launch){
    const c=C(+el.dataset.uid);
    pk.innerHTML=label(c,launch)+`<div class="pk-card">${cardHTML(c,{act:'zoom'})}</div>`;
    place(el,fan);
    if(pk.hidden){pk.hidden=false;requestAnimationFrame(()=>pk.classList.add('on'))}
  }
  function focus(el){ // move the lifted card + preview to el
    if(!g||g.el===el&&g.mode==='peek')return;
    if(g.el)g.el.classList.remove('press','peek','launch');
    g.el=el;g.launch=false;el.classList.add('peek');preview(el,true,false);
  }
  function startPeek(){if(!g||g.mode==='peek')return;clearTimeout(g.t);g.mode='peek';
    if(g.fan){g.el.closest('.lane').classList.add('peeking');g.el.classList.remove('press');const el=g.el;g.el=null;focus(el)}
    else preview(g.el,false,false)}
  function clear(){
    if(g){clearTimeout(g.t);if(g.el){g.el.classList.remove('press','peek','launch');const l=g.el.closest('.lane');if(l)l.classList.remove('peeking')}}
    pk.classList.remove('on');pk.hidden=true;g=null;
  }
  // Mouse: hovering a hand card lifts it and shows the big preview; no holding needed.
  function hoverOff(){if(hv&&hv.isConnected){hv.classList.remove('peek');const l=hv.closest('.lane');if(l)l.classList.remove('peeking')}hv=null;if(!g){pk.classList.remove('on');pk.hidden=true}}
  document.addEventListener('pointermove',e=>{
    ptr=e.pointerType||'mouse';
    if(ptr!=='mouse'||g||e.buttons)return;
    const over=e.target.closest&&e.target.closest('.lane.fan .card[data-uid]');
    if(!over||S.overlays.length||S.view||S.paused){if(hv)hoverOff();return}
    const el=cardAt(e.clientX,e.clientY,hv&&hv.isConnected?hv:null)||over;
    if(el===hv)return;
    if(hv&&hv.isConnected)hv.classList.remove('peek');
    hv=el;el.classList.add('peek');el.closest('.lane').classList.add('peeking');preview(el,true,false);
  });
  document.addEventListener('pointerleave',hoverOff);
  document.addEventListener('pointerdown',e=>{
    ptr=e.pointerType||'mouse';
    if(ptr==='mouse'&&e.button!==0)return;
    if(hv)hoverOff();
    if(g)clear();
    const hit=e.target.closest('.card[data-uid]');if(!hit||hit.closest('#peek'))return;
    const fan=!!hit.closest('.lane.fan');
    const el=fan?(cardAt(e.clientX,e.clientY)||hit):hit;
    g={el,fan,sx:e.clientX,sy:e.clientY,mode:'press',launch:false,id:e.pointerId};
    if(fan)el.classList.add('press');
    // With a mouse, hover already previews, so a press is always a click (no hold timer); dragging still works.
    if(!(fan&&ptr==='mouse'))g.t=setTimeout(startPeek,fan?HOLD_MS:OTHER_MS);
  });
  document.addEventListener('pointermove',e=>{
    if(!g||e.pointerId!==g.id)return;
    const dx=e.clientX-g.sx,dy=e.clientY-g.sy;
    if(!g.fan){if(g.mode==='press'&&Math.hypot(dx,dy)>10){clearTimeout(g.t);g=null}return}
    if(g.mode==='press'){
      if(Math.abs(dx)>SLIDE_PX){startPeek();focus(cardAt(e.clientX,e.clientY,g.el)||g.el)}
      else if(dy<-SLIDE_PX)startPeek();
      else return;
    }
    // Peeking: above the fan = launch zone for the focused card; inside the fan = scrub.
    const top=g.el.closest('.fanwrap').getBoundingClientRect().top+40,inZone=e.clientY<top;
    if(inZone!==g.launch){g.launch=inZone;g.el.classList.toggle('launch',inZone);preview(g.el,true,inZone)}
    if(!inZone){const el=cardAt(e.clientX,e.clientY,g.el);if(el&&el!==g.el)focus(el)}
  });
  document.addEventListener('pointerup',e=>{
    if(!g||e.pointerId!==g.id)return;
    const {el,fan,mode,launch}=g;
    clear();
    if(mode==='peek'&&!fan){swallow=true;setTimeout(()=>swallow=false,350);return}
    if(!fan)return; // a plain tap on a non-fan card goes through the normal click
    if(mode==='press'||launch)el.dispatchEvent(new MouseEvent('click',{bubbles:true}));
  });
  document.addEventListener('pointercancel',()=>{if(g)clear()});
  // Native clicks on fan cards are ignored: pointerup above decides (so tap vs hold is never guessed twice).
  document.addEventListener('click',e=>{
    if(e.isTrusted&&swallow){e.stopPropagation();e.preventDefault();swallow=false;return}
    if(e.isTrusted&&e.detail>0&&e.target.closest('.lane.fan .card[data-uid]')){e.stopPropagation();e.preventDefault()}
  },true);
  document.addEventListener('contextmenu',e=>{if(e.target.closest('.card'))e.preventDefault()});
  // Keyboard: 1–9 play a card, Space/E end turn, Esc cancel/close, M map, C cards, Enter/Space dismiss announcements.
  document.addEventListener('keydown',e=>{
    if(!S||e.metaKey||e.ctrlKey||e.altKey)return;
    const k=e.key;
    const inRun=!['intro','rules','closed','end'].includes(S.screen);
    if(S.paused){if(k==='Escape'||k==='p'||k==='P'){e.preventDefault();S.paused=S.paused==='menu'?null:'menu';render()}return}
    if(S.overlays.length){if(k==='Enter'||k===' '||k==='Escape'){e.preventDefault();S.overlays.shift();render()}return}
    if((k==='p'||k==='P')&&inRun){S.paused='menu';render();return}
    if(k==='Escape'){if(S.view)S.view=null;else if(S.target||S.confirm){S.target=null;S.confirm=null}else if(S.keeping)S.keeping=null;else if(inRun)S.paused='menu';else return;render();return}
    if(k==='m'||k==='M'||k==='c'||k==='C'){const v=/m/i.test(k)?'map':'deck';if(['intro','rules','closed'].includes(S.screen))return;S.view=S.view===v?null:v;render();return}
    if(S.view||S.screen!=='office')return;
    if(k===' '||k==='e'||k==='E'){e.preventDefault();if(S.keeping)endTurn(S.keeping);else requestEndTurn();render();return}
    if(/^[1-9]$/.test(k)){const el=document.querySelectorAll('.lane.fan .card[data-uid]')[+k-1];if(el){if(g)clear();hoverOff();el.dispatchEvent(new MouseEvent('click',{bubbles:true}))}}
  });
  document.addEventListener('dragstart',e=>{if(e.target.closest&&e.target.closest('.card'))e.preventDefault()});
}

/* ============ boot (keeps an in-progress run across page updates) ============ */
function boot(data){
  if(data&&data.S&&data.S.cards&&data.S.v===9){S=data.S;if(data.META)META=data.META}else{newRun()}
  S.v=9;render();
}
window.claude?.hot?.snapshot?.(()=>({S,META}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
