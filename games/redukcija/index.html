// ---------- engine.js ----------
// Rules and numbers. No drawing here, so tools/sim.js can run it headless.
const SAVE_KEY='redukcija.save', SAVE_V=3, LADDER_KEY='redukcija.ladder';
const METERS=['water','spirits','face','money'];
const MLABEL={water:'Water',spirits:'Spirits',face:'Face',money:'Money'};
const START=50, CARDS_PER_DAY=5;
const ARROW=[0,8,15], JIT=[0,2,3];         // ▲ is about 8 (6–10), ▲▲ about 15 (12–18)
const WARN_LOW=20, WARN_HIGH=80;           // the night's "Running low / Running high"
const PROMISE_BREAK=-15;                   // Spirits, the night a promise breaks
const FACE_DRIFT=0.25;                     // each night Face moves a quarter of the way back to 50
const EVENT_P=0.25;                        // chance an event starts on a morning when none is on
const WEEKDAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const dayName=d=>WEEKDAYS[(d-1)%7];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const val=(x,s,...a)=>typeof x==='function'?x(s,...a):x;

// seeded randomness: the state carries its own generator, so a saved run (or a replayed morning) plays out the same
function rnd(s){let t=(s.r=(s.r+0x6D2B79F5)>>>0);t=Math.imul(t^t>>>15,1|t);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296;}
const ri=(s,a,b)=>a+Math.floor(rnd(s)*(b-a+1));
const pickr=(s,a)=>a[Math.floor(rnd(s)*a.length)];
function wpick(s,items,wf){const ws=items.map(wf),tot=ws.reduce((a,b)=>a+b,0);if(tot<=0)return null;let x=rnd(s)*tot;for(let i=0;i<items.length;i++){x-=ws[i];if(x<=0)return items[i];}return items[items.length-1];}

// ---------- rolling a run ----------
function rollLook(s,g,old){
  const female=g==='f';
  const hs=old?(female?pickr(s,['bun','bob','short']):pickr(s,['short','bald'])):female?pickr(s,LOOK.fstyle):pickr(s,LOOK.mstyle);
  const style=pickr(s,LOOK.tops),wear=[];
  if(!female&&rnd(s)<.4)wear.push('beard');if(rnd(s)<(old?.6:.2))wear.push('glasses');if(female&&rnd(s)<.35)wear.push('earrings');
  const lk={skin:pickr(s,LOOK.skin),hair:[hs,old?pickr(s,LOOK.grey):pickr(s,LOOK.hair)],style,top:pickr(s,LOOK.top),bottom:pickr(s,LOOK.bottom),shoes:pickr(s,LOOK.shoes),wear};
  if(old)lk.size='teen';
  if(female&&rnd(s)<.3){lk.skirt=pickr(s,LOOK.bottom);lk.tights=pickr(s,['#cfc6b8','#4a4a4a','#b6604e']);}
  return lk;}
function rollPerson(s,used,old,g){g=g||(rnd(s)<.5?'m':'f');
  const pool=NAMES[(old?'old':'')+g].filter(n=>!used.includes(n));const name=pickr(s,pool);used.push(name);
  return {name,g,look:rollLook(s,g,old)};}
const FLOORS=['ground floor','first floor','second floor','third floor','fourth floor','fifth floor'];
function newRun(level=1,seed=(Date.now()^Math.random()*1e9)>>>0){
  const L=LEVELS[level];
  const s={v:SAVE_V,seed,r:seed>>>0,level,day:1,stage:'brief',m:{water:START,spirits:START,face:START,money:START},
    tags:{},people:{},mem:{},log:[],promises:{},sched:[],beats:[],cool:{},seen:{},events:[],ann:[],deck:[],idx:0,
    ext:0,jump:0,splash:0,evDays:0};
  const used=[];
  // the household: size is the level
  s.people.you={...rollPerson(s,used),role:'You',id:'you'};
  if(L.size>=2)s.people.partner={...rollPerson(s,used),role:'Your partner',id:'partner'};
  // circumstances: 1 at level 1, 1–2 at level 2 (top and ground floor exclude each other)
  const cs=Object.keys(CIRCS),n=L.size>=2&&rnd(s)<.5?2:1;s.circ=[];
  while(s.circ.length<n){const c=pickr(s,cs);if(s.circ.includes(c))continue;if((c==='top'&&s.circ.includes('ground'))||(c==='ground'&&s.circ.includes('top')))continue;s.circ.push(c);}
  s.floor=s.circ.includes('top')?5:s.circ.includes('ground')?0:ri(s,1,3);
  // the building: one neighbour per archetype (v5.0), each on a different floor
  const floors=[0,1,2,3,4,5].filter(f=>f!==s.floor);
  for(const a of Object.keys(ARCHETYPES)){const A=ARCHETYPES[a];
    let fl;if(a==='elder'){fl=floors.filter(f=>f>s.floor);fl=fl.length?pickr(s,fl):pickr(s,floors);}else fl=pickr(s,floors);floors.splice(floors.indexOf(fl),1);
    s.people[a]={...rollPerson(s,used,A.old),role:A.role,id:a,arch:a,floor:fl,disp:A.start};}
  // the story context, and its beats placed in time
  s.ctx=pickr(s,Object.keys(CONTEXTS));
  if(s.ctx==='wedding')s.people.sib={...rollPerson(s,used),role:'Your sibling',id:'sib'};
  if(s.ctx==='newhere')for(const a of Object.keys(ARCHETYPES))s.people[a].disp=Math.min(s.people[a].disp,0);
  s.kin=pickr(s,['your cousin in the hills','your aunt in the next town','an old friend across the river','your parents, two hours away']);
  // the reduction: announced length, and how the city will change it
  s.announced=L.announced;s.end=L.announced;s.extPlan=[];
  if(rnd(s)<L.extP[0]){s.extPlan.push({day:L.announced-ri(s,1,2),add:ri(s,...L.extLen)});
    if(rnd(s)<L.extP[1])s.extPlan.push({day:L.announced+ri(s,2,3),add:ri(s,2,3)});}

  s.rota=[0];for(let d=1;d<=L.maxLen+2;d++)s.rota.push(d===1||rnd(s)<L.delivP?ri(s,...L.deliv):0);
  s.beats=CONTEXTS[s.ctx].beats(s.announced).map(([id,day])=>({id,day,done:false})).filter(b=>b.day>=1);

}
const who=(s,id)=>s.people[id]||CITY[id]||null;

// ---------- text ----------
const PRON={m:{he:'he',him:'him',his:'his',He:'He',His:'His'},f:{he:'she',him:'her',his:'her',He:'She',His:'Her'}};
function fill(t,s){if(t==null)return '';
  return String(t).replace(/\{(\w+)(?:\.(\w+))?\}/g,(m,id,f)=>{
    if(id==='end')return s.end;if(id==='endDay')return dayName(s.end);
    if(id==='wedDay')return dayName(s.announced+1);if(id==='examDay')return dayName(s.announced);
    if(id==='kin')return s.kin;
    if(id==='partnerLine')return s.people.partner?fill('{partner} goes to stay with {partner.his} sister. You go to {kin}. You agree it isn’t forever, and you both say it twice.',s):fill('You go to {kin} for a while. It isn’t giving up. The pipes were never your job.',s);
    const p=who(s,id);if(!p)return m;if(!f)return id==='you'?'you':p.name;
    if(f==='floor')return FLOORS[p.floor]||'top floor';if(f==='name')return p.name;
    return (PRON[p.g]||PRON.m)[f]||m;});}
const cardById=id=>CARDS.find(c=>c.id===id);
const currentCard=s=>cardById(s.deck[s.idx]);
// The card's text is fixed when the card comes up (one variant, picked with the run's own dice), so it reads the same after a reload.
function cardText(s,c){c=c||currentCard(s);const k=c.id+'@'+s.day;s.textPick=s.textPick||{};
  let t=val(c.text,s);if(Array.isArray(t)){if(s.textPick[k]==null)s.textPick[k]=Math.floor(rnd(s)*t.length);t=t[s.textPick[k]%t.length];}
  return fill(t,s);}

// ---------- options ----------
// What an option does, with circumstances folded in (so the arrows on the card are always the whole truth).
function optionView(o,s){
  const fx={...val(o.fx,s)},x=val(o.x,s)||{};
  if(o.p==='carry'&&s.circ.includes('top'))fx.spirits=(fx.spirits||0)-1;      // five floors, no lift
  if(o.p==='queue'&&s.circ.includes('nightshift'))fx.spirits=(fx.spirits||0)-1; // queueing after a night at the ovens
  for(const k of METERS)if(fx[k])fx[k]=clamp(fx[k],-2,2);
  return {label:fill(val(o.l,s),s),pict:o.p,fx,x};}
// Arrows become numbers only when the choice lands: ▲ 6–10, ▲▲ 12–18.
function rollFx(s,fx){const out={};for(const k of METERS){const a=fx[k]||0;if(!a)continue;const n=Math.abs(a);out[k]=Math.sign(a)*(ARROW[n]+ri(s,-JIT[n],JIT[n]));}return out;}
function applyDelta(s,d){const L=LEVELS[s.level];for(const k of METERS){if(!d[k])continue;s.m[k]=clamp(s.m[k]+d[k],0,100);}}
// Which edge (if any) the meters are on. Low edges always end the run; the top edges only from level 2.
function edgeHit(s){const L=LEVELS[s.level];
  for(const k of METERS){if(s.m[k]<=0)return EDGE_OF[k].low;if(L.top&&s.m[k]>=100)return EDGE_OF[k].high;}
  return null;}
function choose(s,c,i){

  const d=rollFx(s,v.fx);applyDelta(s,d);

  if(x.tag)s.tags[x.tag]=1;

  if(x.inc)for(const[k,n]of Object.entries(x.inc))s.tags[k]=(+s.tags[k]||0)+n;
  const dd={...(x.disp||{})};if(x.dispBest)dd[bestNb(s)]=(dd[bestNb(s)]||0)+x.dispBest;
  for(const[a,n]of Object.entries(dd))if(s.people[a])s.people[a].disp=clamp(s.people[a].disp+n,-2,2);
  if(x.sched){const[id,a,b]=x.sched;s.sched.push({id,day:s.day+ri(s,a,b),done:false});}
  if(x.mem)for(const[a,t]of Object.entries(x.mem)){(s.mem[a]=s.mem[a]||[]).push(fill(t,s));}
  if(x.promise){const p=x.promise;s.promises[p.id]={text:p.text,who:p.who,due:val(p.due,s),state:'open'};}
  if(x.keep&&s.promises[x.keep])s.promises[x.keep].state='kept';
  if(x.brk&&s.promises[x.brk])s.promises[x.brk].state='broken';
  if(x.end){const was=s.end;s.end=clamp(s.end+x.end,s.day+1,LEVELS[s.level].maxLen);if(s.end!==was)s.ann.push({day:s.day,kind:'pull',text:`The city moves the end date to ${dayName(s.end)}.`});}
  s.log.push({day:s.day,id:c.id,who:c.who,title:fill(c.title,s),choice:v.label,pict:v.pict,fx:v.fx,d});
  s.result={choice:v.label,pict:v.pict,fx:v.fx,d,resp,who:c.who,place:c.place,promise:x.promise?x.promise.id:null,keep:x.keep,brk:x.brk,end:x.end};

const FALLBACK={l:'Make do.',p:'wait',fx:{spirits:-1},r:'You find another way. It isn’t a better way, but it is a way.',x:{}};
function advance(s){
  if(s.pending)return finish(s,s.pending);
  s.idx++;if(s.idx>=s.deck.length)nightfall(s);else s.stage='card';}

// ---------- the bag: which cards can come up today, and how likely ----------
function cardOK(c,s){
  if(c.fam==='arc'||c.sched)return false;
  if(c.who==='partner'&&!s.people.partner)return false;
  if(ARCHETYPES[c.who]&&!s.people[c.who])return false;
  if(c.once&&s.seen[c.id])return false;
  const last=s.cool[c.id];if(last!=null&&s.day-last<(c.cd??4))return false;
  if(c.when&&!c.when(s))return false;
  return true;}
function weight(c,s){let w=val(c.w??1,s);
  for(const e of s.events)if(c.boost&&c.boost[e.id])w=Math.max(w,c.boost[e.id]);   // an event makes its cards likely
  if(c.who==='partner')w*=1.3;
  if(s.seen[c.id])w*=0.6;                              // lean on what you haven't seen this run
  return Math.max(0,w);}
function buildDeck(s){
  const deck=[];
  const take=id=>{deck.push(id);s.seen[id]=(s.seen[id]||0)+1;s.cool[id]=s.day;};
  // story beats placed in time come first, then consequences that were scheduled for today, then the bag
  for(const b of s.beats)if(!b.done&&b.day<=s.day&&deck.length<2){b.done=true;
    if(b.id==='x_wed_4'&&s.day>s.end)continue;take(b.id);}
  for(const q of s.sched)if(!q.done&&q.day<=s.day&&deck.length<3){q.done=true;take(q.id);}
  while(deck.length<CARDS_PER_DAY){const pool=CARDS.filter(c=>!deck.includes(c.id)&&cardOK(c,s));
    const c=wpick(s,pool,c=>weight(c,s));if(!c)break;take(c.id);}

  const head=deck.filter(id=>cardById(id).fam==='arc'),rest=deck.filter(id=>cardById(id).fam!=='arc');
  for(let i=rest.length-1;i>0;i--){const j=Math.floor(rnd(s)*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]];}
  s.deck=[...head,...rest];s.idx=0;}

// ---------- a day ----------
function radioTone(s){return s.ext>=2||s.day>s.announced+2?'silent':s.ext>=1?'defensive':'calm';}
function deliveryFor(s,d){if(s.events.some(e=>e.id==='strike'&&e.until>=d&&e.from<=d))return 0;
  let n=s.rota[d]||0;if(!n)return 0;if(s.circ.includes('ground'))n+=3;if(s.circ.includes('top'))n-=3;return Math.max(0,n);}
function startDay(s,first=false){

      s.ann.push({day:s.day,kind:'ext',from:was,text:`Extended to ${dayName(s.end)}. Because of the burst main on Titova street.`});}}

  const dv=deliveryFor(s,s.day);s.arrival=dv;if(dv){s.m.water=clamp(s.m.water+dv,0,100);}

function afterBrief(s){s.stage=s.deck.length?'card':'night';if(!s.deck.length)nightfall(s);}

// ---------- the night: the household uses water, money and patience; time may jump ----------
function nightDrain(s,d){const L=LEVELS[s.level],n={...L.night};
  if(s.events.some(e=>e.id==='heat'&&e.from<=d&&e.until>=d))n.water-=3;

  if(s.circ.includes('wfh'))n.money+=2;
  return n;}
function nightfall(s){

// ---------- the ladder (kept across runs) ----------
function ladderDefault(){return {level:1,best:1,endings:{},runs:0,clears:0};}
function ladderAfter(L,s){L=JSON.parse(JSON.stringify(L||ladderDefault()));L.runs++;L.endings[s.ending]=(L.endings[s.ending]||0)+1;

  return L;}

// ---------- save ----------
// ---------- illustrations (v4.4) ----------
// Flat, hand-drawn-looking vector scenes drawn in code as SVG: soft shapes, no outlines, short hatching strokes
// for texture (shared patterns), and a muted palette (cream, brick, sand, sage, pale blue, charcoal).
// Every scene is a flat, front-on stage 860×400: the back wall (or the street front) above y=268, the floor below.
// Scene data (SCENES, BRIEFS…) keeps v4's stage coordinates: x 0..29 is depth (0 = back wall), y 0..76 runs right
// to left, z is height. SX/FY/SC turn them into screen x, floor line and scale.
const PAL={cream:'#f0eee8',paper:'#faf8f3',ink:'#3f4042',char:'#4a4a4a',char2:'#5b5b5b',brick:'#b6604e',brick2:'#9c4c3e',
  sand:'#c4ad7f',sand2:'#a99263',beige:'#e5cfb3',beige2:'#d9bf9f',wall:'#ebdcc8',sage:'#7c9b9c',sage2:'#62807f',pale:'#d5e3e4',
  mint:'#c1dacf',teal:'#6f9a93',blue:'#5a8aa6',water:'#6e9fbf',sky:'#e4ece9',grey:'#a8a8a6',grey2:'#cfcfcc',white:'#f8f7f2',
  wood:'#b8996c',wood2:'#97784f',mustard:'#cfa349',plum:'#8a6f8f',navy:'#46546a',rose:'#c98b7f'};
const IL={W:860,H:400,HOR:268};
const SX=y=>830-y*10.6, FY=x=>IL.HOR+x*4.2, SC=x=>0.8+x*0.0075;
const fx=n=>Math.round(n*10)/10;
function mixc(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);
  return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');}

const ROOMBG={Morning:'#e2ebe9',Midday:'#e4edf1',Afternoon:'#ede6d6',Evening:'#efcfae',Night:'#3d4a63'};
function skyIn(x,y,w,h,st,city=true){
  const t=st.time||'Morning',n=t==='Night';let o=Sh(rr(x,y,w,h),ROOMBG[t]);

  if(city){ // red roofs and firs across the street, flat
    const roof=n?'#5a4a55':PAL.brick,house=n?'#6b6870':PAL.beige,fir=n?'#3f5458':PAL.sage;
    for(let i=0;i<4;i++){const bx=x+i*w/4+((i*13)%9),bw=w/4.4,bh=h*.32+((i*7)%3)*8;
      o+=Sh(rr(bx,y+h-bh,bw,bh),house,'v')+Sh(pg([[bx-4,y+h-bh],[bx+bw/2,y+h-bh-bw*.45],[bx+bw+4,y+h-bh]]),roof,'h');
      if(n)o+=Sh(rr(bx+bw*.35,y+h-bh*.6,bw*.3,bh*.25),'#f2d27a');}
    for(let i=0;i<3;i++){const fx0=x+20+i*w/3.1;o+=Sh(pg([[fx0-14,y+h],[fx0,y+h-h*.55],[fx0+14,y+h]]),fir,'dv');}
  }
  return o;}

// ---------- composing a scene ----------
const TIMETINT={Morning:['#fff1d6',.08],Midday:null,Afternoon:['#f6e2bc',.08],Evening:['#e9915a',.2],Night:['#4a5f95',.55]};
function sceneSVG(sc){
  const room=(ROOMS[sc.room]||ROOMS.kitchen)(sc),items=[...room.front.map(([d,svg])=>({d,svg}))];
  for(const s of sc.street||[]){const[name,...a]=s;const r=STREET[name]&&STREET[name](...a);if(r)items.push({d:r[0],svg:r[1]});}
  for(const c of sc.cast||[]){const spec={...CAST[c.who],...c},x=c.x,s=SC(x),px=SX(c.y),fy=FY(x)-(c.pose!=='sit'&&c.z?c.z*7*s:0)-(sc.room==='bathroom'&&sc.bath&&c.pose==='sit'&&!c.z?34:0);
    let svg='';if(spec.pose==='sit'&&c.z&&sc.room!=='bathroom')spec.chair=true;
    svg+=`<ellipse cx="${fx(px)}" cy="${fx(fy)}" rx="${fx(30*s)}" ry="${fx(6*s)}" fill="#000" opacity=".08"/>`;
    svg+=G(px,fy,s,person(spec).svg);items.push({d:x+.01,svg});}
  for(const pr of sc.props||[]){let[name,x,y,z,turn]=pr;if(sc.room==='stairwell'&&x>15)z=0;if(ITEMS[name])items.push({d:x+.02,svg:ITEMS[name](SX(y),FY(x)-(z||0)*7*SC(x),SC(x),{})});}
  items.sort((a,b)=>a.d-b.d);
  // the camera: frame the people, not the whole room (a wider shot when they stand apart)
  const xs=[...(sc.cast||[]).map(c=>SX(c.y)),...(sc.billboard?[40,240]:[])],ys=(sc.cast||[]).map(c=>FY(c.x));
  let vb=[0,0,IL.W,IL.H];
  if(xs.length&&!sc.wide){const lo=Math.min(...xs),hi=Math.max(...xs),w=Math.max(600,Math.min(IL.W,hi-lo+340)),h=w*IL.H/IL.W;
    const cx=Math.max(w/2,Math.min(IL.W-w/2,(lo+hi)/2)),bot=Math.min(IL.H,Math.max(...ys)+34);
    // keep everyone's head in frame: widen the shot if the tallest head would be cut
    const TALL={adult:240,teen:215,child:150,big:255},tops=(sc.cast||[]).map(c=>FY(c.x)-(c.z||0)*7*SC(c.x)-TALL[CAST[c.who]?.size||'adult']*SC(c.x)-30);
    let top=Math.max(0,bot-h);const need=Math.min(...tops);
    if(need<top){const h2=Math.min(IL.H,bot-Math.max(0,need)),w2=h2*IL.W/IL.H,cx2=Math.max(w2/2,Math.min(IL.W-w2/2,cx));vb=[cx2-w2/2,bot-h2,w2,h2];}
    else vb=[cx-w/2,top,w,h];}
  let o=room.back+items.map(i=>i.svg).join('');
  const tint=TIMETINT[sc.time];if(tint)o+=`<rect width="${IL.W}" height="${IL.H}" fill="${tint[0]}" opacity="${tint[1]}" style="mix-blend-mode:multiply"/>`;
  if(sc.time==='Night'||sc.time==='Evening')for(const[x,y,r]of room.lamps||[])o+=`<circle cx="${x}" cy="${y+r*.5}" r="${r}" fill="url(#il-glow)" opacity="${sc.time==='Night'?1:.5}"/>`;
  return {svg:o,vb:vb.map(fx).join(' ')};
}

const ARW=n=>n>0?'▲'.repeat(n):'▼'.repeat(-n);
function achip(k,n){const kind=n>0?'gain':'cost';
  return `<span class="chip px achip ${kind}" style="--c:${RCOL[k]}" title="${MLABEL[k]} ${n>0?'up':'down'}${Math.abs(n)>1?' a lot':''}">${px(k,15,kind==='gain'?'#fff':null)}<b>${ARW(n)}</b><span class="sr">${MLABEL[k]} ${n>0?'up':'down'}${Math.abs(n)>1?' a lot':''}</span></span>`;}
function promiseChip(t,label,cls='cost'){return `<span class="chip px ${cls}" style="--c:var(--promise)" title="${esc(t)}">${px('promise',15,cls==='gain'?'#fff':null)}${esc(label)}</span>`;}
function arrowChips(fx,x={}){
  const out=METERS.filter(k=>fx[k]).map(k=>achip(k,fx[k]));
  if(x.promise)out.push(promiseChip(`A promise: ${x.promise.text}`,'Promise'));
  if(x.keep)out.push(promiseChip('Keeps your promise','Keeps promise','gain'));
  if(x.brk)out.push(`<span class="chip px cost" style="--c:var(--strain)" title="Breaks your promise">${px('promise',15,'var(--strain)')}Breaks promise</span>`);
  if(x.end<0)out.push(`<span class="chip px gain" style="--c:var(--file)" title="The end date moves closer">${px('calendar',15,'#fff')}End date −1</span>`);
  return `<span class="chips">${out.length?out.join(''):'<span class="chip px none">Nothing changes</span>'}</span>`;}
// exact changes, after the choice lands (the HUD bars show the same numbers animating)
function deltaChips(d){return `<span class="chips">${METERS.filter(k=>d[k]).map(k=>`<span class="chip px ${d[k]>0?'gain':'cost'}" style="--c:${RCOL[k]}">${px(k,15,d[k]>0?'#fff':null)}${sign(d[k])}<span class="sr">${MLABEL[k]}</span></span>`).join('')}</span>`;}

const motionOK=()=>!matchMedia('(prefers-reduced-motion: reduce)').matches;
function meterState(k,v,s=S){const top=LEVELS[s.level].top;return v<=WARN_LOW?'low':top&&v>=WARN_HIGH?'high':'';}

function bar(k,v,o={}){
  const top=LEVELS[S.level].top,from=o.from??v,anim=from!==v&&motionOK()&&!o.arrow,start=anim?from:v;
  const st=o.state??meterState(k,v);
  let pv='';if(o.arrow){const n=Math.abs(o.arrow),lo=ARROW[n]-JIT[n],hi=ARROW[n]+JIT[n],dir=Math.sign(o.arrow);
    const a=clamp(v+dir*lo,0,100),b=clamp(v+dir*hi,0,100),l=Math.min(v,a,b),w=Math.max(v,a,b)-l;
    pv=`<i class="pv ${dir<0?'lose':'gain'}" style="left:${l}%;width:${w}%"></i>`;}
  const badge=o.arrow?`<span class="abadge ${o.arrow>0?'up':'down'}">${ARW(o.arrow)}</span>`:'';
  const tag=st==='low'?'<span class="state low">Low</span>':st==='high'?'<span class="state high">High</span>':'';
  return `<div class="bar px m-${k} ${st} ${o.arrow?'previewing':''} ${o.cls||''}" style="--c:${RCOL[k]}" data-k="${k}" data-from="${start}" data-to="${v}" data-max="100" role="group" aria-label="${MLABEL[k]} ${v} of 100${st?', '+st:''}">
    <div class="bhead"><span class="lbl">${px(k,16)}${MLABEL[k]}${badge}</span><span class="val"><b class="num" data-n>${start}</b><small>/100</small></span></div>
    <div class="track"><i class="edge lo"></i>${top?'<i class="edge hi"></i>':''}<i class="ghost" style="width:${start}%"></i><i class="fill" style="width:${start}%"></i>${pv}<i class="mark" style="--at:${WARN_LOW}%"></i>${top?`<i class="mark" style="--at:${WARN_HIGH}%"></i>`:''}</div>
    <div class="bfoot">${o.foot??''}${tag}</div></div>`;}
function hud(preview){const s=S,p=preview||{},from=k=>preview||!shown?s.m[k]:shown[k];const n=nightDrain(s,s.day);
  const foot=k=>{const t=k==='face'?'drifts to 50':`tonight ${sign(n[k])}`;return `<span>${t}</span>`;};
  return `<section class="hud hud4 drop" aria-label="Meters">${METERS.map(k=>bar(k,s.m[k],{from:from(k),arrow:p[k],foot:foot(k)})).join('')}</section>`;}
function animateBars(root=document,delay=0){
  if(!motionOK())return;
  const go=()=>root.querySelectorAll('.bar[data-k]').forEach(b=>{
    const from=+b.dataset.from,to=+b.dataset.to;if(isNaN(from)||from===to)return;
    b.classList.add(to<from?'down':'up');
    const rc=b.getBoundingClientRect(),fl=document.createElement('span');fl.className=`float ${to>from?'gain':'cost'}`;fl.textContent=sign(to-from);
    fl.style.left=rc.right+scrollX+'px';fl.style.top=rc.top+scrollY-10+'px';document.body.append(fl);setTimeout(()=>fl.remove(),1700);
    const n=b.querySelector('[data-n]');if(n){const t0=performance.now()+(to<from?150:450),dur=800;
      const step=t=>{const k=clamp((t-t0)/dur,0,1);n.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1&&b.isConnected)requestAnimationFrame(step);};requestAnimationFrame(step);}
    const w=to+'%',f=b.querySelector('.fill'),g=b.querySelector('.ghost');requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.width=w;g.style.width=w;}));});

function morningNotes(){const out=[],first=S.day===1&&!S.log.length,ctx=CONTEXTS[S.ctx];
  if(S.log.length&&S.prevDay&&S.day-S.prevDay>1)out.push({eb:`${dayName(S.day)} morning`,big:jumpLine(S.day-S.prevDay-1)});
  if(first){
    out.push({eb:`Level ${S.level} · ${LEVELS[S.level].name}`,big:fill('“Water supply will be reduced for {end} days.”',S),small:`The notice on the door says it ends after ${dayName(S.end)}.`,stamp:'Planned maintenance'});
    out.push({eb:ctx.name,people:['you','partner'].filter(id=>S.people[id]),big:fill(ctx.line,S),small:S.circ.map(c=>CIRCS[c].line).join(' '),rule:S.circ.map(c=>`${CIRCS[c].name}: ${CIRCS[c].rule}`).join(' · ')});
    out.push({eb:'The building',people:['driver','elder','gossip','spiteful'],big:'Four neighbours. Each will make up their mind about you.'});}
  for(const e of S.events.filter(e=>e.from===S.day)){const E=EVENTS[e.id];out.push({eb:E.name,big:E.line,rule:E.rule});}
  for(const a of S.ann.filter(a=>a.day===S.day)){const[b1,...b2]=a.text.split('. ');out.push({eb:'Municipal water service',big:b2.length?b1+'.':a.text,small:b2.join('. ')||null,stamp:a.kind==='ext'?'Thank you for your patience':null,cls:a.kind});}
  return out;}
function noteScreen(){const n=S.notes[S.noteI];
  const ppl=n.people?`<div class="nppl">${n.people.map(id=>`<div class="who">${portrait(id,'mini',id==='you'||id==='partner'?PLACE.home.c:PLACE.stair.c)}<span>${esc(S.people[id].name)}${id==='you'?' (you)':''}</span></div>`).join('')}</div>`:'';
  shell(`${splashHTML()}<div class="drop"><button class="card pcard one px resultcard notecard ${n.cls||''}" data-act="note"><span class="nbody"><span class="eyebrow">${esc(n.eb)}</span>${ppl}<span class="nbig">${esc(n.big)}</span>${n.small?`<span class="nsmall">${esc(n.small)}</span>`:''}${n.rule?`<span class="nrule">${esc(n.rule)}</span>`:''}${n.stamp?`<span class="stamp">${esc(n.stamp)}</span>`:''}</span><span class="cta"><span>Tap to continue</span><span class="arrow" aria-hidden="true">→</span></span></button></div>`,{theme:'morning'});}
function brief(){
  const rows=[];
  rows.push(S.arrival?fcRow('confirmed',`${achip('water',S.arrival>=13?2:1)} Building delivery this morning`,px('water',18)):fcRow('none','No building delivery this morning.',px('water',18,'var(--line)')));
  for(const e of S.events){const E=EVENTS[e.id];rows.push(fcRow('expected',`<b>${E.name}</b> · <span class="muted">${esc(E.rule)}</span>`,px('sun',18)));}
  rows.push(fcRow('rumoured',esc(S.radio),px('radio',18)));
  shell(`${splashHTML()}<section class="scene morning"><div class="dayhero px"><div class="sunrise">${px('sun',30)}</div><div><span class="eyebrow">Day ${S.day} of ${S.end}${S.ext?` · was ${S.announced}`:''} · morning</span><h1>${dayName(S.day)}</h1></div></div>

    <h3 class="eyebrow sect">${px('sun',14)} Today</h3>
    <div class="notice drop">${rows.join('')}</div>
    <div class="actions drop"><button class="primary px" data-act="next">Start the day →</button></div></section>`,{theme:'morning'});}
function jumpLine(n){const lines=n>1?['Two days pass. The queue at the depot starts at four now.','Two days go by in the same grey shape: queue, carry, count, sleep.','Two days pass. Somebody has written HOW LONG? on the bus shelter.']:['A day passes. You don’t remember much of it except the stairs.','A day passes. The bread goes stale faster in the heat.','A day passes. The radio says less than it did.'];return lines[(S.day+S.seed)%lines.length];}
const TIMES=['Early','Morning','Midday','Afternoon','Evening'];
function speakerHead(id,eyebrow,place){const pl=PLACE[place]||PLACE.home;
  return `<div class="phead" style="--place:${pl.c}">${portrait(id,'big','#fbf8f1')}<div class="who"><span class="lbl">${eyebrow}</span><strong>${esc(id==='you'?'You':nameOf(id))}</strong><span>${esc(id==='you'?(S.people.partner?'Your household':'On your own'):roleOf(id))}</span></div><span class="placetag">${px('place',13)}${pl.n}</span></div>`;}
function progress(){return `<div class="progress" aria-label="Decision ${S.idx+1} of ${S.deck.length}">${S.deck.map((_,i)=>`<span class="${i<S.idx?'done':i===S.idx?'now':''}"></span>`).join('')}</div>`;}
// v5.0.1: the choices are the card's own bottom half, left choice on the left, right on the right, so the swipe and the layout agree.
function choiceBtn(v,i){return `<button class="half ${i?'r':'l'}" data-choice="${i}" title="${PICTNAME[v.pict]||''}">

    ${arrowChips(v.fx,v.x)}</button>`;}
function cardScreen(){
  const c=currentCard(S),vs=[optionView(c.a,S),optionView(c.b,S)],text=cardText(S,c);
  const eyebrow=c.fam==='arc'?`${CONTEXTS[S.ctx].name}`:`${TIMES[S.idx]||'Evening'} · ${S.idx+1} of ${S.deck.length}`;

function afterScreen(){
  const r=S.result,c=currentCard(S),last=S.idx>=S.deck.length-1,go=S.pending?'What happens next':last?'Put the day to bed':'Continue';
  const notes=[];if(r.promise)notes.push(promiseChip('A promise','Promise made'));if(r.keep)notes.push(promiseChip('Kept','Promise kept','gain'));
  if(r.brk)notes.push(`<span class="chip px cost" style="--c:var(--strain)">${px('promise',15,'var(--strain)')}Promise broken</span>`);
  if(r.end)notes.push(`<span class="chip px gain" style="--c:var(--file)">${px('calendar',15,'#fff')}New end date: ${dayName(S.end)}</span>`);
  shell(`${progress()}<div class="drop"><button class="card pcard one px resultcard" data-act="next" aria-label="${go}" aria-describedby="resbody">

    <div class="selected"><span class="pict px">${pict(r.pict,20)}</span>${esc(r.choice)}</div><div class="resfx">${deltaChips(r.d)}${notes.length?`<span class="chips">${notes.join('')}</span>`:''}</div><p class="outcome">${esc(r.resp)}</p></div>
    <span class="cta"><span>${go==='Continue'?'Tap to continue':go}</span><span class="arrow" aria-hidden="true">→</span></span></button></div>

// Night: no HUD; the household uses water, money and patience overnight, Face drifts back to the middle.
// "Running low" and, from level 2, "Running high": both edges end the run.
function nightScreen(){
  const r=S.summary,b=r.before,a=r.after,top=LEVELS[S.level].top,ends=S.pending==='cleared',edge=S.pending&&!ends;
  const n=nightDrain(S,r.tomorrow),warn=[];
  for(const k of METERS){const v=a[k],next=k==='face'?v:v+(n[k]||0)+(k==='water'?r.deliv:0);
    if(v<=WARN_LOW)warn.push(['low',`${MLABEL[k]} is low (${v}). At 0: ${EDGES[EDGE_OF[k].low].title.replace('.','')}`]);
    else if(top&&v>=WARN_HIGH)warn.push(['high',`${MLABEL[k]} is high (${v}). At 100: ${EDGES[EDGE_OF[k].high].title.replace('.','')}`]);
    else if(!ends&&next<=WARN_LOW)warn.push(['warn',`${MLABEL[k]} will be ${Math.max(0,next)} by tomorrow night unless something changes.`]);}
  const passed=r.jump?`<p class="jumpline">${r.jump>1?'Tonight and two more days pass.':'Tonight and the next day pass.'}</p>`:'';
  const foot=k=>{const d=a[k]-b[k];return `<span>${d?sign(d):'±0'} overnight${k==='face'?' · drifts to 50':''}${k==='water'&&!ends&&r.deliv?` · delivery tomorrow +${r.deliv}`:k==='water'&&!ends?' · no delivery tomorrow':''}</span>`;};
  shown={...a};
  const btn=ends?'The water comes back →':edge?'Morning →':'Sleep →';
  shell(`<section class="scene nightscreen"><div class="nighthero"><span class="eyebrow">${px('moon',16)} ${dayName(S.day)} night · day ${S.day} of ${S.end}</span>
    <h2>${ends?'The last night of the reduction.':edge?'Something has to give.':'What carries into tomorrow.'}</h2><p class="prose">${esc(nightLine())}</p></div>
    ${passed}
    <div class="drop"><div class="panel px lowbox ${warn.length?'':'fine'}"><h3>${warn.length?`${px('warn',16)} ${top?'Running low · running high':'Running low'}`:`${px('spirits',16)} Nothing is near an edge`}</h3>
      ${warn.length?warn.map(([t,x])=>`<p class="lowline"><span class="state ${t==='warn'?'warn':t}">${t==='low'?'Low':t==='high'?'High':'Soon'}</span><span>${esc(x)}</span></p>`).join(''):`<p class="lowline">Every meter is away from its edges.</p>`}</div></div>
    ${r.broke.map(id=>`<p class="warning">${px('warn',16)}<span>Promise broken: ${esc(S.promises[id].text.toLowerCase())}. Spirits ▼▼.</span></p>`).join('')}
    <h3 class="eyebrow sect">Overnight</h3>
    <div class="nightbars drop">${METERS.map(k=>bar(k,a[k],{from:b[k],cls:'wide',foot:foot(k)})).join('')}</div>
    <p class="under" style="text-align:left">${top?'Both edges end the run.':'Only the bottom edges end the run.'}</p>
    <div class="actions drop"><button class="primary px" data-act="next">${btn}</button></div></section>`,{hud:false,theme:'night'});}
function nightLine(){const t=S.tags,two=!!S.people.partner;
  const lines=[two?'{partner} leaves a bowl under the tap. You leave it there too.':'You leave a bowl under the tap. Just in case.',
    'Through the wall, someone boils a kettle.',
    S.events.some(e=>e.id==='heat')?'The heat doesn’t break at night. The building sleeps with its doors open.':'The containers wait in the hall like patient guests.',
    t.extended?'Nobody in the building says “extended” out loud.':'Someone counts down the days on the notice, in pencil.',
    two?'{partner} is asleep with the notebook open on {partner.his} chest.':'You fall asleep with the notebook open on your chest.'];
  return fill(lines[(S.day+S.seed)%lines.length],S);}
function endingScreen(){
  const s=S,cleared=s.ending==='cleared',E=EDGES[s.ending],L=LAD,next=cleared&&s.level<MAXLEVEL;
  const paras=cleared?epilogue(s):E.text.map(t=>fill(t,s));
  const title=cleared?(s.ext?`${s.day} days. They said ${s.announced}.`:'They kept their word, this time.'):E.title;
  app.innerHTML=`<section class="scene endscreen"><div class="drop"><div class="panel px">${sceneArt(endScene(s))}
    <span class="eyebrow">Level ${s.level} · ${LEVELS[s.level].name} · ${cleared?'you got through':`ending: ${E.sub.toLowerCase()}`} · day ${s.day}</span><h2>${esc(title)}</h2>
    ${paras.map(p=>`<p class="prose" style="margin-top:12px">${esc(p)}</p>`).join('')}
    ${Object.keys(s.promises).length?`<h3 class="eyebrow" style="margin-top:22px">Promises</h3>${Object.entries(s.promises).map(([id,p])=>`<div class="promise"><span>${px('promise',16)} ${esc(p.text)} · ${esc(who(s,p.who)?.name||'')}</span><span class="st ${p.state}">${p.state}</span></div>`).join('')}`:''}</div></div>
    <div class="summary drop">${METERS.map(k=>srow(px(k,18),MLABEL[k],s.m[k])).join('')}${srow(px('calendar',18),'Days',`${s.day} (announced ${s.announced}, extended ${s.ext}×)`)}${srow(px('promise',18),'Decisions',s.log.length)}</div>
    ${cleared?`<p class="lead" style="margin:6px 0 4px">${next?`Next: <b>level ${s.level+1} · ${LEVELS[s.level+1].name.toLowerCase()}</b>. ${esc(LEVELS[s.level+1].adds)}`:'You’ve cleared the top level in this build. Levels 3–5 (a baby, a full family, a large family) arrive in v5.1.'}</p>`:`<p class="lead" style="margin:6px 0 4px">Try level ${s.level} again, with a new household.</p>`}
    <div class="actions drop"><button class="primary px" data-act="new">${next?`Level ${s.level+1} →`:cleared?`Play level ${s.level} again`:'A new household →'}</button><button class="secondary px" data-act="history">This run</button><button class="secondary px" data-act="totitle">Title</button></div></section>`;}
const srow=(ic,k,v)=>`<div class="srow px"><span class="k">${ic}${k}</span><span class="v">${v}</span></div>`;
function epilogue(s){const out=[];
  out.push(fill(s.people.partner?'On the morning after {endDay} the tap coughs, spits and runs. {partner} stands in front of it for a full minute with {partner.his} hand under the water.':'On the morning after {endDay} the tap coughs, spits and runs. You stand in front of it for a full minute with your hand under the water.',s));
  out.push(fill(EPILOGUE[s.ctx](s),s));
  if(has(s,'repaired'))out.push(fill('The pipe behind the depot is fixed. {foreman} sends a photo of the new valve, with a thumbs up.',s));
  else if(cnt(s,'complaint')>=2)out.push('Your complaint file is thick enough to stand up on its own. You keep it. There will be a next time.');
  const warm=['driver','elder','gossip','spiteful'].filter(a=>disp(s,a)>0).map(a=>s.people[a].name);
  if(warm.length)out.push(`${warm.join(warm.length>2?', ':' and ').replace(/, ([^,]*)$/,' and $1')} ${warm.length>1?'wave':'waves'} from the stairwell. The building knows your name now.`);
  if(disp(s,'spiteful')<=-2)out.push(fill('{spiteful} has not forgotten. {spiteful.He} still writes down when you run the tap.',s));
  return out;}

// ---------- swipe ----------
function bindSwipe(vs){
  const el=document.getElementById('card');if(!el)return;
  let x0=null,dx=0,id=null,hit=null;lean=null;
  const setLean=l=>{if(l===lean)return;lean=l;el.dataset.lean=l??'';el.querySelectorAll('.half[data-choice]').forEach((b,i)=>b.classList.toggle('hot',i===l));setPreview(l==null?null:vs[l].fx);};
  el.addEventListener('pointerdown',e=>{if(e.button>0)return;x0=e.clientX;dx=0;id=e.pointerId;hit=e.target.closest('.half');el.setPointerCapture(id);el.classList.add('dragging');});
  el.addEventListener('pointermove',e=>{if(x0==null||e.pointerId!==id)return;dx=e.clientX-x0;el.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;setLean(dx<-30?0:dx>30?1:null);});
  const up=()=>{if(x0==null)return;el.classList.remove('dragging');const l=dx<-100?0:dx>100?1:null;x0=null;
    if(l!=null){Sound.swipe();el.style.transform=`translateX(${dx<0?-600:600}px) rotate(${dx/10}deg)`;el.style.opacity='0';setTimeout(()=>pick(l,true),180);}
    else if(Math.abs(dx)<10&&hit){el.style.transform='';pick(+hit.dataset.choice);}
    else{el.style.transform='';setLean(null);}};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.querySelectorAll('.half[data-choice]').forEach((b,i)=>{
    b.addEventListener('mouseenter',()=>setLean(i));b.addEventListener('focus',()=>setLean(i));
    b.addEventListener('mouseleave',()=>setLean(null));b.addEventListener('blur',()=>setLean(null));});}
function pick(i,played){const c=currentCard(S);if(!c||S.stage!=='card')return;if(!played)Sound.swipe();choose(S,c,i);commit();}

// ---------- sound (v4.2) ----------
// Music: a menu loop (title and epilogue) and an in-game loop (everything in between); they crossfade.
// Card sounds: one file holding eight short swipes (a "sprite"); a random one plays on every choice, never the same twice in a row.
// Played with Web Audio so the loops have no gap. Browsers keep a page silent until the player first taps or presses a key,
// so the music starts then. If the files can't be fetched (index.html opened straight from disk in Chrome), <audio> tags take over.
// Without the audio/ folder the game just plays silent.
const SOUND_KEY='redukcija.sound';
const MUSIC={
  menu:{src:'audio/menu-before-the-taps.mp3',vol:.45},   // both loop the whole file; set loopLen (seconds) to loop only the end of a file
  game:{src:'audio/game-six-cards-a-day.mp3',vol:.3}};
const SWIPES={src:'audio/card-swipes.mp3',vol:.55,cuts:[[0,.49],[.70,.32],[1.62,.88],[2.88,.51],[3.59,.31],[4.55,.68],[5.72,.51],[6.43,.62]]}; // [start, length] in s
const FADE=1.2;
const Sound=(()=>{
  const pref={music:true,sfx:true};
  try{Object.assign(pref,JSON.parse(localStorage.getItem(SOUND_KEY)||'{}'));}catch(e){}
  const keep=()=>{try{localStorage.setItem(SOUND_KEY,JSON.stringify(pref));}catch(e){}};
  const AC=window.AudioContext||window.webkitAudioContext;
  let ctx=null,started=false,useTags=!AC,scene=null,playing=null,last=-1;
  const bufs={},jobs={},nodes={},tags={};
  const get=src=>bufs[src]?Promise.resolve(bufs[src]):(jobs[src]||(jobs[src]=fetch(src).then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer();})
    .then(a=>new Promise((ok,no)=>ctx.decodeAudioData(a,ok,no))).then(b=>(bufs[src]=b))));
  // MP3 files carry a few ms of encoder silence at each end; skip it so the loop doesn't hiccup.
  function edges(b){const d=b.getChannelData(0);let i=0,j=d.length-1;while(i<j&&Math.abs(d[i])<1e-4)i++;while(j>i&&Math.abs(d[j])<1e-4)j--;return[i/b.sampleRate,(j+1)/b.sampleRate];}
  function ramp(a,to,done){clearInterval(a._r);const from=a.volume,t0=performance.now();
    a._r=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/(FADE*1000));a.volume=from+(to-from)*k;if(k>=1){clearInterval(a._r);done&&done();}},50);}
  function tag(n){return tags[n]||(tags[n]=Object.assign(new Audio(MUSIC[n].src),{loop:true,preload:'auto'}));}
  function startTrack(n){const m=MUSIC[n];
    if(useTags){const a=tag(n);a.volume=0;a.play().catch(()=>{});ramp(a,m.vol);return;}
    get(m.src).then(b=>{if(playing!==n||nodes[n])return;
      const [a,e]=edges(b),src=ctx.createBufferSource(),g=ctx.createGain(),t=ctx.currentTime;
      src.buffer=b;src.loop=true;src.loopEnd=e;src.loopStart=m.loopLen?Math.max(a,e-m.loopLen):a;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(m.vol,t+FADE);
      src.connect(g);g.connect(ctx.destination);src.start(t,src.loopStart);nodes[n]={src,g};
    }).catch(()=>{useTags=true;if(playing===n)startTrack(n);});}
  function stopTrack(n){
    if(tags[n]){const a=tags[n];ramp(a,0,()=>a.pause());}
    const x=nodes[n];if(!x)return;delete nodes[n];const t=ctx.currentTime;
    x.g.gain.cancelScheduledValues(t);x.g.gain.setValueAtTime(x.g.gain.value,t);x.g.gain.linearRampToValueAtTime(0,t+FADE);x.src.stop(t+FADE+.05);}
  function apply(){const want=started&&pref.music?scene:null;if(want===playing)return;const old=playing;playing=want;if(old)stopTrack(old);if(want)startTrack(want);}
  function unlock(){  // runs on every tap/key until the browser lets sound through
    if(AC&&!ctx){try{ctx=new AC();}catch(e){useTags=true;}}
    if(ctx&&ctx.state!=='running')ctx.resume().catch(()=>{});
    if(started)return;started=true;if(ctx)get(SWIPES.src).catch(()=>{});apply();}
  function swipe(){if(!pref.sfx||!started)return;
    let i;do i=Math.floor(Math.random()*SWIPES.cuts.length);while(i===last);last=i;const [at,len]=SWIPES.cuts[i];
    if(useTags){const a=new Audio(SWIPES.src);a.volume=SWIPES.vol;a.addEventListener('loadedmetadata',()=>{a.currentTime=at;a.play().catch(()=>{});setTimeout(()=>a.pause(),len*1000);},{once:true});return;}
    get(SWIPES.src).then(b=>{const src=ctx.createBufferSource(),g=ctx.createGain(),t=ctx.currentTime;src.buffer=b;
      g.gain.setValueAtTime(SWIPES.vol,t);g.gain.setValueAtTime(SWIPES.vol,t+len-.04);g.gain.linearRampToValueAtTime(0,t+len);
      src.connect(g);g.connect(ctx.destination);src.start(t,at,len);}).catch(()=>{useTags=true;});}
  function hidden(h){if(ctx)(h?ctx.suspend():ctx.resume()).catch(()=>{});if(playing&&tags[playing])h?tags[playing].pause():tags[playing].play().catch(()=>{});}
  ['pointerdown','touchend','keydown','click'].forEach(ev=>document.addEventListener(ev,unlock,{capture:true,passive:true}));
  document.addEventListener('visibilitychange',()=>hidden(document.hidden));
  // Download and decode while the title is showing (allowed before a tap; only playing has to wait), so the music starts right away.
  if(AC){try{ctx=new AC();[MUSIC.menu.src,SWIPES.src,MUSIC.game.src].reduce((p,src)=>p.then(()=>get(src)).catch(()=>{}),Promise.resolve());}catch(e){}}
  return {scene(n){scene=n;apply();},swipe,
    get music(){return pref.music;},get sfx(){return pref.sfx;},get on(){return pref.music||pref.sfx;},
    set(k,v){pref[k]=v;keep();apply();},toggle(){const v=!(pref.music||pref.sfx);pref.music=pref.sfx=v;keep();apply();}};
})();
function soundBtn(cls=''){return `<button class="iconbtn px ${cls}" data-act="sound" aria-pressed="${Sound.on}" aria-label="Sound" title="Sound ${Sound.on?'on':'off'} (M)">${Sound.on?icon.sound:icon.mute}</button>`;}
function refreshSoundBtns(){document.querySelectorAll('[data-act="sound"]').forEach(b=>b.outerHTML=soundBtn(b.classList.contains('sndbtn')?'sndbtn':''));if(dlg.open&&dlg.querySelector('[data-act="music"]'))modal(pauseHTML());}

// ---------- input ----------
let guardUntil=0;
// the ladder moves once per run, when its ending first shows
function settle(){if(S&&S.stage==='ending'&&!S.counted){S.counted=true;LAD=ladderAfter(LAD,S);saveLadder();}}
function commit(focus=true){if(S&&S.stage==='after')guardUntil=performance.now()+250;settle();if(S&&S.stage!=='ending')save(S);if(S&&S.stage==='ending')clearSave();render();if(focus)document.getElementById('scene')?.focus({preventScroll:true});scrollTo(0,0);}
function startLevel(n){dlg.open&&dlg.close();shown=null;S=newRun(n);commit();}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-close]');if(!t)return;
  if(t.hasAttribute('data-close')){dlg.close();return;}
  if(t.dataset.choice!=null){pick(+t.dataset.choice);return;}
  if(t.dataset.level){startLevel(+t.dataset.level);return;}
  const a=t.dataset.act;if(!a)return;
  ({continue(){shown=null;S=load();if(S)commit();},
    new(){startLevel(LAD.level);},
    rules(){modal(rulesHTML());},endings(){modal(endingsHTML());},
    quit(){app.innerHTML=`<section class="title"><div><h1 style="font-size:44px">See you tomorrow.</h1><p class="lead">Your run is saved on this device. You can close this tab.</p><div class="menu"><button class="secondary px" data-act="totitle">Back to the title</button></div></div></section>`;},
    note(){S.noteI++;commit();},
    next(){if(S.stage==='after'&&performance.now()<guardUntil)return;if(S.stage==='brief')afterBrief(S);else if(S.stage==='after')advance(S);else if(S.stage==='night')nextMorning(S);commit();},
    sound(){Sound.toggle();refreshSoundBtns();},music(){Sound.set('music',!Sound.music);refreshSoundBtns();},sfx(){Sound.set('sfx',!Sound.sfx);refreshSoundBtns();},
    pause(){modal(pauseHTML());},family(){modal(familyHTML());},history(){modal(historyHTML());},
    replay(){dlg.open&&dlg.close();shown=null;const m=JSON.parse(S.morning);m.morning=S.morning;S=m;commit();},
    totitle(){dlg.open&&dlg.close();if(S&&S.stage!=='ending')save(S);S=null;render();},
    endrun(){dlg.close();clearSave();S=null;render();}}[a]||(()=>{}))();
});
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;
  if((k==='m'||k==='M')&&!e.target.closest?.('input,textarea')){Sound.toggle();refreshSoundBtns();return;}
  if(dlg.open)return;                      // Esc closes the dialog natively
  if(!S||S.stage==='ending')return;
  if(k==='Escape'||k==='p'||k==='P'){modal(pauseHTML());e.preventDefault();return;}
  if(k==='f'||k==='F'){modal(familyHTML());return;}
  if(k==='h'||k==='H'){modal(historyHTML());return;}
  if(S.stage==='card'){if(k==='ArrowLeft'||k==='1'){pick(0);e.preventDefault();}if(k==='ArrowRight'||k==='2'){pick(1);e.preventDefault();}return;}
  const go=document.querySelector('[data-act="next"],[data-act="note"]');if((k==='Enter'||k===' '||(k==='ArrowRight'&&go?.dataset.act==='note'))&&go&&!e.target.closest?.('button')){go.click();e.preventDefault();}
});
LAD=loadLadder();
render();

})();
</script></body></html>
