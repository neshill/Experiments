<style>
/* Layout: portrait-first, one screen. Top: day tile + family/pause. HUD: a big water tank tile (one block per unit),
   three need tiles (10 blocks each), a strip of small counters. Middle: the decision card; two chunky choice buttons under it.
   Landscape (≥900px wide): the HUD becomes a left column.
   Look: light, neutral "pixel" — notched corners, hard offset shadows, dithered shading, one saturated colour per resource.
   Fonts are readable sans (no pixel fonts): Barlow Condensed for numbers and labels, Atkinson Hyperlegible for text. */
:root{
  --bg:#e8e6e0; --surface:#f8f7f3; --surface-2:#efede7; --ink:#23262b; --muted:#66655f; --line:#b9b6ad; --shade:rgba(35,38,43,.16);
  /* one colour per resource — the same everywhere: tiles, chips, icons */
  --water:#2a76c0; --water-res:#9cc0e2; --food:#cf6f12; --hygiene:#12938a; --spirits:#c63a72;
  --cash:#a7801a; --errands:#6a4fb0; --strain:#c33b2b; --file:#55677b; --promise:#b0782a;
  --go:#3f8a4a; --go-dark:#2d6a37;
  --f-num:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-text:"Atkinson Hyperlegible","Helvetica Neue",Arial,sans-serif;
  --px:3px; /* pixel unit for notches, borders and shadows */
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-text);-webkit-text-size-adjust:100%;
  background-image:radial-gradient(rgba(35,38,43,.07) 1px,transparent 1.2px);background-size:6px 6px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--water);outline-offset:3px}
button:disabled{cursor:not-allowed}
h1,h2,h3,p{margin:0}
#app{min-height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:0 max(14px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.lbl{font:700 12px/1 var(--f-num);letter-spacing:.09em;text-transform:uppercase}
.num{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.muted{color:var(--muted)}

/* ---------- pixel frame: notched corners + inset border; shadows come from the parent's drop-shadow ---------- */
.px{--bc:var(--ink);--bw:var(--px);position:relative;
  clip-path:polygon(var(--px) 0,calc(100% - var(--px)) 0,calc(100% - var(--px)) var(--px),100% var(--px),100% calc(100% - var(--px)),calc(100% - var(--px)) calc(100% - var(--px)),calc(100% - var(--px)) 100%,var(--px) 100%,var(--px) calc(100% - var(--px)),0 calc(100% - var(--px)),0 var(--px),var(--px) var(--px));
  box-shadow:inset 0 0 0 var(--bw) var(--bc)}
.drop{filter:drop-shadow(var(--px) var(--px) 0 var(--shade))}
/* dithered shading on the lower part of coloured tiles */
.dith::after{content:"";position:absolute;left:var(--px);right:var(--px);bottom:var(--px);height:38%;pointer-events:none;
  background:repeating-conic-gradient(rgba(0,0,0,.13) 0 25%,transparent 0 50%) 0 0/4px 4px;
  -webkit-mask:linear-gradient(transparent,#000 90%);mask:linear-gradient(transparent,#000 90%)}
.ico{display:inline-block;flex-shrink:0;image-rendering:pixelated;vertical-align:middle}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 10px}
.daytile{display:flex;align-items:center;gap:10px;background:var(--surface);padding:7px 12px 6px;min-width:0}
.daytile .num{font-size:24px}
.daytile .t{min-width:0}
.daytile .t div{font:700 13px/1.15 var(--f-num);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daytile .t small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .btns{display:flex;gap:8px;flex-shrink:0}
.iconbtn{background:var(--surface);border:0;height:42px;min-width:42px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 14px var(--f-num);letter-spacing:.06em;text-transform:uppercase}
.iconbtn:hover{background:#fff}
.iconbtn svg{width:18px;height:18px}
.iconbtn .badge{background:var(--promise);color:#fff;font:700 12px/18px var(--f-num);padding:0 6px;min-width:18px}

/* ---------- HUD ---------- */
.hud{display:grid;gap:8px;padding-bottom:12px}
.tile{color:#fff;padding:9px 11px 10px;--bc:rgba(0,0,0,.28)}
.tile .head{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tile .head .lbl{display:flex;align-items:center;gap:6px}
.tile .big{font-size:34px}
.tile .big small{font:700 14px var(--f-num);letter-spacing:.04em;text-transform:uppercase;margin-left:3px;opacity:.9}
.delta{font:700 15px/1 var(--f-num);padding:3px 6px 2px;background:#fff;color:var(--ink);margin-left:6px;font-variant-numeric:tabular-nums;position:relative;top:-6px;display:inline-block}
.delta.cost{color:var(--strain)}.delta.gain{color:var(--go-dark)}
.watertile{background:var(--water)}
.watertile .row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:4px}
.watertile .res{font:700 13px/1.2 var(--f-num);letter-spacing:.04em;text-transform:uppercase;text-align:right;opacity:.95}
/* the tank: one block per unit, 20 per row */
.tank{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;margin-top:8px;position:relative;z-index:1}
.tank i{aspect-ratio:1;background:rgba(0,0,0,.22);display:block}
.tank i.r{background:var(--water-res)}
.tank i.f{background:#fff}
.tank i.lose{background:repeating-linear-gradient(45deg,#fff 0 2px,#e9a59c 2px 4px);animation:blink .8s steps(2) infinite}
.tank i.gain{background:transparent;box-shadow:inset 0 0 0 2px #fff;animation:blink .8s steps(2) infinite}
.needs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.need .big{font-size:30px}
.need.food{background:var(--food)}.need.hygiene{background:var(--hygiene)}.need.spirits{background:var(--spirits)}
.segs{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin-top:7px;position:relative;z-index:1}
.segs i{height:8px;background:rgba(0,0,0,.22);display:block}
.segs i.on{background:#fff}
.segs i.lose{background:repeating-linear-gradient(45deg,#fff 0 2px,rgba(0,0,0,.25) 2px 4px);animation:blink .8s steps(2) infinite}
.segs i.gain{box-shadow:inset 0 0 0 2px #fff;background:transparent;animation:blink .8s steps(2) infinite}
.need.low{background:var(--surface);color:var(--strain);--bc:var(--strain)}
.need.low .segs i{background:rgba(195,59,43,.18)}.need.low .segs i.on{background:var(--strain)}
.need .lowtag{font:700 11px/1 var(--f-num);background:var(--strain);color:#fff;padding:3px 5px 2px;letter-spacing:.06em}
.counters{display:flex;flex-wrap:nowrap;gap:8px}
.ctr{display:inline-flex;align-items:center;gap:7px;background:var(--surface);padding:6px 10px 5px;font:700 14px/1 var(--f-num);letter-spacing:.04em;text-transform:uppercase}
.ctr .n{font-size:19px}
.ctr .delta{top:0;padding:2px 4px 1px;margin-left:0;box-shadow:inset 0 0 0 1.5px currentColor}
.pips{display:inline-flex;gap:3px}
.pips i{width:11px;height:11px;display:inline-block;box-shadow:inset 0 0 0 2px currentColor}
.pips i.on{background:currentColor}
@keyframes blink{50%{opacity:.35}}

/* ---------- stage ---------- */
main{flex:1;padding:4px 0 8px;display:flex;flex-direction:column}
.progress{display:flex;gap:4px;margin-bottom:12px}
.progress span{height:8px;flex:1;background:var(--line)}
.progress .done{background:var(--ink)}.progress .now{background:var(--water)}
.cardwrap{position:relative}
.card{background:var(--surface);padding:16px 16px 18px;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .2s steps(4);animation:enter .2s steps(3)}
.card.dragging{transition:none;cursor:grabbing}
.cardhead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
/* portrait slot: dithered frame in the speaker's colour, until the art arrives */
.portrait{width:64px;height:64px;flex-shrink:0;display:grid;place-items:center;color:#fff;font:700 30px var(--f-num);--bc:rgba(0,0,0,.3)}
.portrait::after{content:"";position:absolute;inset:var(--px);background:repeating-conic-gradient(rgba(0,0,0,.14) 0 25%,transparent 0 50%) 0 0/4px 4px;-webkit-mask:linear-gradient(transparent 45%,#000);mask:linear-gradient(transparent 45%,#000)}
.cardhead .who .lbl{color:var(--muted);display:block;margin-bottom:3px}
.cardhead .who strong{font:700 20px/1.1 var(--f-num);letter-spacing:.02em;display:block}
.cardhead .who span{font-size:13px;color:var(--muted)}
.card h2{font:700 30px/1.05 var(--f-num);letter-spacing:.01em;margin-bottom:10px;text-wrap:balance}
.prose{font-size:18px;line-height:1.55}
.lean{position:absolute;top:10px;font:700 13px/1.1 var(--f-num);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px 5px;opacity:0;background:var(--ink);color:#fff;max-width:62%;z-index:2}
.lean.l{left:10px}.lean.r{right:10px;text-align:right}
.card.dragging[data-lean="0"] .lean.l,.card.dragging[data-lean="1"] .lean.r{opacity:1}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media (max-width:420px){.choices{grid-template-columns:1fr}}
.choice{text-align:left;border:0;background:var(--surface);padding:12px 13px 13px;display:flex;flex-direction:column;gap:9px;--bw:var(--px)}
.choice:not(:disabled):hover,.choice.hot{background:#fff;--bc:var(--water)}
.choice:not(:disabled):active{transform:translate(var(--px),var(--px))}
.choice:disabled{background:var(--surface-2);color:var(--muted);--bc:var(--line)}
.ct{display:flex;gap:8px;font:700 18px/1.15 var(--f-num);letter-spacing:.02em}
.ct .arrow{color:var(--muted)}
.choice.r .ct{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:5px}
/* a chip = icon + signed number. Gains are filled with the resource colour; costs are white with a coloured frame. */
.chip{--c:var(--ink);display:inline-flex;align-items:center;gap:4px;padding:4px 7px 3px 5px;font:700 16px/1 var(--f-num);font-variant-numeric:tabular-nums;--bw:2px;--px:2px}
.chip.gain{background:var(--c);color:#fff;--bc:rgba(0,0,0,.25)}
.chip.cost{background:#fff;color:var(--c);--bc:var(--c)}
.chip.chance{background:#fff;color:var(--c);--bc:var(--c);border:0;outline:2px dashed var(--c);outline-offset:-2px}
.chip.chance .odds{font-size:12px;color:var(--muted);margin-left:2px}
.chip.none{background:var(--surface-2);color:var(--muted);--bc:var(--line)}
.chip.spill{background:#fff;color:var(--muted);--bc:var(--line)}
.blocked{display:flex;align-items:center;gap:6px;font:700 14px/1.2 var(--f-num);letter-spacing:.02em;color:var(--strain)}
.under{font-size:13px;color:var(--muted);margin-top:12px;text-align:center}
.selected{font:700 16px/1.2 var(--f-num);letter-spacing:.03em;text-transform:uppercase;color:var(--muted);padding-bottom:10px;border-bottom:2px dotted var(--line)}
.outcome{font-size:20px;line-height:1.5;margin:14px 0 14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.primary,.secondary{border:0;padding:14px 22px 13px;font:700 18px/1 var(--f-num);letter-spacing:.06em;text-transform:uppercase}
.primary{background:var(--go);color:#fff;--bc:var(--go-dark)}
.primary:hover{background:#4a9a55}
.secondary{background:var(--surface);--bc:var(--ink)}
.secondary:hover{background:#fff}
.primary:active,.secondary:active{transform:translate(var(--px),var(--px))}
.textbutton{border:0;background:none;padding:6px 0;font-size:14px;color:var(--muted);text-decoration:underline}
.scene{animation:enter .2s steps(3)}
.panel{background:var(--surface);padding:16px}
.panel h2,.scene>h2{font:700 34px/1.05 var(--f-num);margin:6px 0 12px;text-wrap:balance}
.eyebrow{font:700 13px/1 var(--f-num);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.days{display:flex;gap:4px;margin:0 0 14px}
.days span{flex:1;text-align:center;font:700 14px/1 var(--f-num);padding:6px 0 5px;background:var(--surface-2);color:var(--muted)}
.days .on{background:var(--ink);color:#fff}.days .past{background:var(--line);color:var(--surface)}
.notice{display:grid;gap:8px;margin-top:14px}
.fc{display:flex;gap:10px;align-items:center;font-size:15px;background:var(--surface);padding:9px 11px 9px 9px;--bw:2px;--bc:var(--line)}
.tag{font:700 12px/1 var(--f-num);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px 3px;flex-shrink:0;color:#fff}
.tag.confirmed{background:var(--go)}.tag.expected{background:var(--cash)}.tag.rumoured{background:var(--file)}.tag.none{background:var(--strain)}
.summary{display:grid;gap:6px;margin:14px 0}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 11px 8px 9px;background:var(--surface);font-size:15px;--bw:2px;--bc:var(--line)}
.srow .k{display:flex;align-items:center;gap:8px}
.srow .v{font:700 19px/1 var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.srow .v .was{color:var(--muted);font-size:16px}
.warning{display:flex;gap:8px;align-items:flex-start;font-size:15px;color:var(--strain);margin:8px 0}
.promise{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;padding:8px 0;border-bottom:2px dotted var(--line)}
.promise .st{font:700 13px/1 var(--f-num);text-transform:uppercase;letter-spacing:.08em;padding:4px 6px 3px;color:#fff}
.promise .st.open{background:var(--promise)}.promise .st.kept{background:var(--go)}.promise .st.broken{background:var(--strain)}

/* ---------- title ---------- */
.title{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:40px 0 60px;position:relative}
.title .logo{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.title h1{font:800 clamp(54px,15vw,84px)/.9 var(--f-num);letter-spacing:-.01em;text-transform:uppercase;margin:6px 0 16px}
.title h1 .sub{display:block;color:var(--water);font-size:.38em;letter-spacing:.04em;margin-top:8px}
.title .lead{font-size:19px;line-height:1.45}
.title .menu{display:grid;gap:10px;margin-top:26px;max-width:340px}
.title .menu button{text-align:left}
.title .quote{font-style:italic;font-size:17px;margin-top:30px;color:var(--muted)}
.title .quote span{display:block;font:700 12px var(--f-num);letter-spacing:.08em;text-transform:uppercase;font-style:normal;margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.ver{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));font:700 13px var(--f-num);letter-spacing:.05em;color:var(--muted)}
.cast{display:none}

/* ---------- dialogs ---------- */
dialog{border:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100% - 24px));max-height:86dvh;padding:22px;box-shadow:inset 0 0 0 3px var(--ink),6px 6px 0 rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(35,38,43,.55)}
dialog header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:16px}
dialog h2{font:700 32px/1 var(--f-num);text-transform:uppercase}
dialog h3{font:700 17px/1.2 var(--f-num);letter-spacing:.05em;text-transform:uppercase;margin:18px 0 6px;display:flex;align-items:center;gap:7px}
dialog p,dialog li{font-size:15px;margin:6px 0}
dialog .close{border:0;background:none;font-size:30px;line-height:1;padding:0 6px}
dialog .menu{display:grid;gap:8px}
dialog .menu button{text-align:left}
.entry{border-top:2px dotted var(--line);padding:12px 0}
.entry h3{margin:4px 0}.entry p{font-size:15px}
.person{display:flex;gap:12px;padding:12px 0;border-top:2px dotted var(--line)}
.person .portrait{width:48px;height:48px;font-size:22px}
.person p{font-size:14px}
.person .mem{font-size:15px;color:var(--ink);display:flex;gap:6px;align-items:flex-start}
.person strong{font:700 19px var(--f-num)}
kbd{font:700 13px var(--f-num);padding:1px 5px;background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--line)}

@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- landscape: HUD as a column on the left ---------- */
@media (min-width:900px) and (orientation:landscape){
  #app{max-width:1120px}
  .game{display:grid;grid-template-columns:330px minmax(0,640px);gap:0 44px;justify-content:center;align-content:start;flex:1}
  .game .top{grid-column:1/-1}
  .game .hud{align-self:start}
  .game .needs{grid-template-columns:1fr}
  .title{display:grid;grid-template-columns:1.1fr 1fr;gap:64px;align-items:center}
  .cast{display:block}
  .cast .person:first-child{border-top:0}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style></head><body><div id="app"></div><dialog id="dialog"></dialog>
<script>
(()=>{
// ---------- story.js ----------
// All quantities are abstract game units. A card: id, phase, speaker, title, text, two options, and an optional `when` (is it in today's deck).
// An option: label, effects (water food hygiene spirits cash errands), response, extra (flags; $promise / $keep / $break), chance.
// Any field can be a function of the state, for text or costs that depend on earlier choices.
const option=(label,fx,resp,extra={},chance=null)=>({label,fx,resp,extra,chance});
const card=(id,phase,speaker,title,text,a,b,opts={})=>({id,phase,speaker,title,text,choices:[a,b],...opts});
const people={

 Lejla:{role:'Your partner · 38',initial:'L',bio:'Repairs clothes at the kitchen table. Measures twice, cuts once. Has a dry sense of humour and little patience for being called resourceful by people with running water.'},
 Iman:{role:'Your daughter · 15',initial:'I',bio:'Makes recordings of the city on an old phone. Wants to be seen as capable, but would also like one afternoon when being capable is not required.'},
 Niko:{role:'Your son · turning 7',initial:'N',bio:'Keeps a list titled WHEN IT COMES BACK. Swimming is first. Washing the moon is second. He knows the moon is too far away. That is not the point.'},
 Vesna:{role:'Neighbour · fourth floor',initial:'V',bio:'A retired bus driver who knows every route across the city. Pretends she is borrowing things when she is really checking whether everyone is all right.'},

};

const CAP=40, RESERVE=8, ERRANDS=2, START={water:24,food:65,hygiene:65,spirits:65,cash:8,errands:ERRANDS,strain:0,evidence:0};
const NIGHT={food:-28,hygiene:-20,spirits:-18};      // nightly need decay, after the day's cards
const LOW=25, GOOD=50, STRAIN_MAX=3;
const WEEKDAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const LABEL={water:'water',food:'Food',hygiene:'Hygiene',spirits:'Spirits',cash:'credits',errands:'errand',evidence:'evidence'};

// Two supply schedules; one is picked at the start of each week. Deliveries are announced the night before (confirmed).
const SCHEDULES=[
  {id:'promises',supply:[0,8,0,8,0,10,6]},
  {id:'drymiddle',supply:[0,6,5,0,0,10,8]}
];
// Things the family can know about a day ahead, beyond the building delivery.
const EXPECT={2:[['expected','Depot tanker at midday · about even odds']],4:[['confirmed','Collection point across the river · takes both errands']],5:[['confirmed','Maintenance crew on your street']]};

// Promises: made on a card ($promise), resolved on a later card ($keep / $break), broken at bedtime if still open on the due day.
const PROMISES={
  sea:{who:'Niko',text:'A little sea for his birthday',due:6},
  sara:{who:'Iman',text:'Sara can come before the week is out',due:5}
};
const isOpen=(s,id)=>s.promises?.[id]?.state==='open';

// Seeded random so a week's uncertain outcomes are fixed at the start (reloading never rerolls them).
function rng(seed){let t=seed>>>0;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296};}

function newRun(seed=(Date.now()^Math.random()*1e9)>>>0){
  const r=rng(seed);
  return {v:SAVE_V,seed,schedule:Math.floor(r()*SCHEDULES.length),rolls:{tanker3:r()<.5},
    day:0,idx:0,stage:'brief',st:{...START},flags:{},promises:{},log:[],deck:[],arrival:null,
    zeroFood:0,supportUsed:0,helpAsked:0,morning:null,result:null,summary:null,ending:null};
}
const val=(x,s)=>typeof x==='function'?x(s):x;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const free=s=>Math.max(0,s.st.water-RESERVE);
const supplyFor=(s,d)=>SCHEDULES[s.schedule].supply[d]||0;

function startDay(s){
  const want=supplyFor(s,s.day), got=Math.min(want,CAP-s.st.water);
  s.st.water+=got; s.arrival={promised:want,received:got,overflow:want-got};
  s.st.errands=ERRANDS;
  if(s.day>0)s.st.cash+=2;                          // Lejla's repair work
  s.deck=days[s.day].cards.filter(c=>!c.when||c.when(s)).slice(0,6).map(c=>c.id);
  s.idx=0; s.stage='brief'; s.result=null;
  s.morning=null; s.morning=JSON.stringify(s);      // snapshot for "Replay this morning"
}
const cardById=id=>{for(const d of days)for(const c of d.cards)if(c.id===id)return c;};
const currentCard=s=>cardById(s.deck[s.idx]);

// What an option costs / gives, with chance outcomes listed separately (never hidden).
function optionView(o,s){
  const fx=val(o.fx,s)||{}; return {label:val(o.label,s),fx,chance:o.chance||null};
}
function allowed(o,s){const {fx}=optionView(o,s);return !deficits(o,s).length;}
function deficits(o,s){
  const {fx}=optionView(o,s),out=[];
  if(fx.water<0&&-fx.water>free(s))out.push(`Needs ${-fx.water} free water; ${free(s)} free.`);
  if(fx.cash<0&&-fx.cash>s.st.cash)out.push(`Needs ${-fx.cash} credits; you have ${s.st.cash}.`);
  if(fx.errands<0&&-fx.errands>s.st.errands)out.push(`Needs ${-fx.errands} errand${-fx.errands>1?'s':''}; ${s.st.errands} left today.`);
  return out;
}
const FALLBACK={label:'Make do.',fx:{spirits:-2},resp:'You find another way. It is not a better way, but it is a way.'};

// Apply one choice atomically: costs, capped gains, flags, promises, log, save.
function choose(s,c,o){
  const {label,fx}=optionView(o,s); let total={...fx};
  if(o.chance&&s.rolls[o.chance.key])for(const[k,v]of Object.entries(o.chance.win))total[k]=(total[k]||0)+v;
  const actual=applyFx(s,total);
  const extra=val(o.extra,s)||{};
  for(const[k,v]of Object.entries(extra)){
    if(k==='$promise'){if(!s.promises[v])s.promises[v]={state:'open',madeDay:s.day};}
    else if(k==='$keep'){if(isOpen(s,v))s.promises[v].state='kept';}
    else if(k==='$break'){if(isOpen(s,v)){s.promises[v].state='broken';}}
    else if(typeof v==='number')s.flags[k]=(s.flags[k]||0)+v;
    else s.flags[k]=v;
  }
  if(extra.evidence)s.st.evidence=s.flags.evidence;
  s.log.push({day:s.day,title:c.title,speaker:c.speaker,choice:label,fx:actual});
  s.result={speaker:c.speaker,choice:label,response:val(o.resp,s),actual};
  s.stage='after';
}
function applyFx(s,fx){
  const actual={};
  for(const[k,v]of Object.entries(fx)){
    if(!v)continue; const before=s.st[k];
    if(k==='water')s.st.water=clamp(before+v,0,CAP);
    else if(k==='food'||k==='hygiene'||k==='spirits')s.st[k]=clamp(before+v,0,100);
    else s.st[k]=Math.max(0,before+v);
    actual[k]=s.st[k]-before;
    if(k==='water'&&v>0&&before+v>CAP)actual.overflow=before+v-CAP;
  }
  return actual;
}
function advance(s){
  if(s.idx<s.deck.length-1){s.idx++;s.stage='card';return;}
  nightfall(s);
}
// Bedtime: reserve consumed once, needs decay once, strain from low needs, promises due today break.
function nightfall(s){
  const before={...s.st}, broke=[];
  for(const[id,p]of Object.entries(s.promises))if(p.state==='open'&&PROMISES[id].due<=s.day){p.state='broken';broke.push(id);s.st.spirits=clamp(s.st.spirits-8,0,100);}
  s.st.water=Math.max(0,s.st.water-RESERVE);
  for(const[k,v]of Object.entries(NIGHT))s.st[k]=clamp(s.st[k]+v,0,100);
  const low=['food','hygiene','spirits'].filter(k=>s.st[k]<LOW);
  let strain=low.length;
  if(!low.length&&['food','hygiene','spirits'].every(k=>s.st[k]>=GOOD)&&s.st.strain>0)strain=-1;
  s.st.strain=clamp(s.st.strain+strain,0,STRAIN_MAX);
  s.zeroFood=s.st.food===0?s.zeroFood+1:0;
  s.summary={before,after:{...s.st},low,strain,broke};
  s.stage='night';
}
function nextMorning(s){
  if(s.st.strain>=STRAIN_MAX||s.zeroFood>=2){s.stage='support';return;}
  if(s.day>=6){finish(s,'week');return;}
  s.day++; startDay(s);
}
function afterBrief(s){s.stage=s.st.water<RESERVE?'dawn':'card';}
function dawn(s,how){
  if(how==='buy'){s.st.cash-=3;s.st.water=clamp(s.st.water+10,0,CAP);}
  if(how==='ask'){s.helpAsked++;s.st.water=clamp(s.st.water+8,0,CAP);if(s.helpAsked>1)s.st.spirits=clamp(s.st.spirits-4,0,100);s.flags.askedBuilding=true;}
  if(how==='leave'){finish(s,'relocated');return;}
  s.stage='card';
}
function support(s,how){
  if(how==='help'){s.supportUsed++;s.flags.gotSupport=true;s.st.food=clamp(s.st.food+25,0,100);s.st.hygiene=clamp(s.st.hygiene+25,0,100);s.st.spirits=clamp(s.st.spirits+10,0,100);s.st.strain=1;s.zeroFood=0;
    if(s.day>=6){finish(s,'week');return;} s.day++; startDay(s); return;}
  finish(s,'relocated');
}
function finish(s,kind){s.ending=kind;s.stage='ending';}

// ---------- save ----------
let saveOK=true;
function save(s){try{localStorage.setItem(SAVE_KEY,JSON.stringify(s));saveOK=true;}catch(e){saveOK=false;}}
function load(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');return s&&s.v===SAVE_V&&s.stage!=='ending'?s:null;}catch(e){return null;}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}

const RCOL={water:'var(--water)',food:'var(--food)',hygiene:'var(--hygiene)',spirits:'var(--spirits)',cash:'var(--cash)',errands:'var(--errands)',strain:'var(--strain)',file:'var(--file)',evidence:'var(--file)',lock:'var(--water-res)',promise:'var(--promise)',warn:'var(--strain)',radio:'var(--file)',sun:'var(--cash)',moon:'var(--errands)'};
function px(name,size=18,color){
  const rows=PIX[name]; if(!rows)return '';
  const fill=color||RCOL[name]||'currentColor'; let r='';
  rows.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='X')r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;}));
  let o='';rows.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='o')o+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;}));
  return `<svg class="ico" width="${size}" height="${size}" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><g fill="${fill}">${r}</g><g fill="#fff">${o}</g></svg>`;
}
const NAME={water:'water',food:'Food',hygiene:'Hygiene',spirits:'Spirits',cash:'credits',errands:'errands',evidence:'evidence'};
// One chip per effect: icon + signed number. Gains filled, costs framed; screen readers get words.
function chip(k,v,cls){const kind=cls||(v<0?'cost':'gain');
  return `<span class="chip px ${kind}" style="--c:${RCOL[k]}" title="${sign(v)} ${NAME[k]}">${px(k,15,kind==='gain'?'#fff':null)}${sign(v)}<span class="sr">${NAME[k]}</span></span>`;}
function fxList(fx,chance){
  const out=[];
  for(const k of ['water','food','hygiene','spirits','cash','errands']){const v=fx[k];if(v)out.push(chip(k,v));}
  if(fx.overflow)out.push(`<span class="chip px spill" title="${fx.overflow} water spilled: the tank was full">${px('water',15,'var(--line)')}${fx.overflow} spilled</span>`);
  if(chance)for(const[k,v]of Object.entries(chance.win))out.push(`<span class="chip chance" style="--c:${RCOL[k]}" title="${sign(v)} ${NAME[k]} if it comes, ${chance.odds}">${px(k,15)}${sign(v)}?<span class="odds">${chance.odds.replace('about even odds','50%')}</span></span>`);
  return `<span class="chips">${out.length?out.join(''):'<span class="chip px none">No cost</span>'}</span>`;
}

// ---------- HUD ----------
function hud(preview){
  const s=S.st,p=preview||{},f=Math.max(0,s.water-RESERVE),res=Math.min(RESERVE,s.water),pw=p.water||0;
  const loss=pw<0?Math.min(-pw,f):0, gain=pw>0?Math.min(pw,CAP-s.water):0;
  // tank: one block per unit, reserve first, then free water; preview blinks the blocks that would go or come
  let cells='';for(let i=0;i<CAP;i++){let c='';if(i<res)c='r';else if(i<s.water)c=i>=s.water-loss?'lose':'f';else if(i<s.water+gain)c='gain';cells+=`<i class="${c}"></i>`;}
  const delta=(d,shown)=>d?`<span class="delta ${d>0?'gain':'cost'}">${sign(shown??d)}</span>`:'';
  const need=k=>{const v=s[k],d=p[k]||0,after=clamp(v+d,0,100),on=Math.ceil(v/10),onA=Math.ceil(after/10);
    let segs='';for(let i=0;i<10;i++){let c=i<Math.min(on,onA)?'on':'';if(d<0&&i>=onA&&i<on)c='lose';if(d>0&&i>=on&&i<onA)c='gain';segs+=`<i class="${c}"></i>`;}
    const low=after<LOW;
    return `<div class="tile need ${k} px dith ${low?'low':''}" role="group" aria-label="${NAME[k]} ${after} of 100${low?', low':''}"><div class="head"><span class="lbl">${px(k,16,low?null:'#fff')}${NAME[k]}</span>${low?'<span class="lowtag">LOW</span>':''}</div>
      <div class="num big">${after}${delta(d,after-v)}</div><div class="segs">${segs}</div></div>`;};
  return `<section class="hud" aria-label="Household">
    <div class="drop"><div class="tile watertile px dith" role="group" aria-label="${f} free water, ${res} reserved for drinking, ${s.water} of ${CAP} in the tank">
      <div class="head"><span class="lbl">${px('water',16,'#fff')}Water</span><span class="lbl" style="opacity:.9">${s.water} / ${CAP} in the tank</span></div>
      <div class="row"><span class="num big">${f}<small>free</small>${delta(pw,gain?gain:-loss)}</span><span class="res">${px('lock',14,'var(--water-res)')} ${res} kept for drinking</span></div>
      <div class="tank">${cells}</div></div></div>
    <div class="needs drop">${['food','hygiene','spirits'].map(need).join('')}</div>
    <div class="counters drop">
      <span class="ctr px" style="--bc:var(--cash);--bw:2px;color:var(--cash)">${px('cash',16)}<span class="n">${s.cash}</span>${delta(p.cash)}<span class="sr">credits</span></span>
      <span class="ctr px" style="--bc:var(--errands);--bw:2px;color:var(--errands)" title="Errands left today">${px('errands',16)}<span class="pips">${[0,1].map(i=>`<i class="${i<s.errands-(p.errands<0?-p.errands:0)?'on':''}"></i>`).join('')}</span><span class="sr">${s.errands} errands left</span>${delta(p.errands)}</span>
      <span class="ctr px" style="--bc:var(--strain);--bw:2px;color:var(--strain)" title="Strain: low needs at bedtime add one. At 3 the family needs help.">${px('strain',16)}<span class="pips">${[0,1,2].map(i=>`<i class="${i<s.strain?'on':''}"></i>`).join('')}</span><span class="sr">strain ${s.strain} of 3</span></span>
      ${s.evidence?`<span class="ctr px" style="--bc:var(--file);--bw:2px;color:var(--file)" title="Complaint file">${px('file',16)}<span class="n">${s.evidence}</span><span class="sr">complaint file entries</span></span>`:''}
    </div></section>`;
}

  rows.push(fcRow('rumoured',esc(d.news),px('radio',18)).replace('>rumoured<','>radio<'));
  shell(`<section class="scene"><div class="drop"><div class="panel px"><span class="eyebrow">${px('sun',16)} Morning</span><h2>${esc(d.title)}</h2>
    <div class="days">${['M','T','W','T','F','S','S'].map((x,i)=>`<span class="${i===S.day?'on':i<S.day?'past':''}">${x}</span>`).join('')}</div>
    <p class="prose">${esc(val(d.intro,S))}</p></div></div>
    <div class="notice drop">${rows.join('')}</div>
    <p class="under" style="text-align:left">${px('lock',14)} ${RESERVE} water is kept for drinking every night. You can spend the rest.</p>
    <div class="actions drop"><button class="primary px" data-act="next">Start the day →</button></div></section>`);
}
function speakerHead(n,eyebrow){return `<div class="cardhead">${portrait(n)}<div class="who"><span class="lbl">${eyebrow}</span><strong>${n==='City'?'The city':esc(n)}</strong><span>${esc(people[n].role)}</span></div></div>`;}
function dawnScreen(){
  const canBuy=S.st.cash>=3;
  shell(`<section class="scene"><div class="drop"><div class="card px">${speakerHead('Lejla','Before breakfast')}
    <h2>First, the essentials.</h2><p class="prose">“There isn’t enough for today’s drinking water.” Lejla sets the empty containers on the table. “We can ask. We don’t have to turn this into a test.”</p></div></div>
    <div class="choices drop"><button class="choice px" data-dawn="buy" ${canBuy?'':'disabled'}><span class="ct">Buy an emergency container.</span>${fxList({cash:-3,water:10})}${canBuy?'':`<span class="blocked">${px('warn',14)} Needs 3 credits.</span>`}</button>
    <button class="choice px" data-dawn="ask"><span class="ct">Ask the residents for help.</span>${fxList(S.helpAsked?{water:8,spirits:-4}:{water:8})}</button></div>
    <div class="actions"><button class="textbutton" data-dawn="leave">Arrange a stay with relatives instead (ends the week)</button></div></section>`);
}
function cardScreen(){
  const c=currentCard(S), os=c.choices.map(o=>({o,v:optionView(o,S),ok:allowed(o,S)}));
  const any=os.some(x=>x.ok);
  shell(`${progress()}<div class="cardwrap drop"><article class="card px" id="card" tabindex="0" aria-describedby="hint">
    <span class="lean l">← ${esc(os[0].v.label)}</span><span class="lean r">${esc(os[1].v.label)} →</span>
    ${speakerHead(c.speaker,`${esc(c.phase)} · ${S.idx+1} of ${S.deck.length}`)}
    <h2>${esc(c.title)}</h2><p class="prose">${esc(val(c.text,S))}</p></article></div>
    <div class="choices drop">${os.map((x,i)=>`<button class="choice px ${i?'r':'l'}" data-choice="${i}" ${x.ok?'':'disabled'}>
      <span class="ct">${i?`<span>${esc(x.v.label)}</span><span class="arrow">→</span>`:`<span class="arrow">←</span><span>${esc(x.v.label)}</span>`}</span>
      ${fxList(x.v.fx,x.v.chance)}${x.ok?'':`<span class="blocked">${px('warn',14)} ${esc(deficits(x.o,S).join(' '))}</span>`}</button>`).join('')}</div>
    ${any?'':`<div class="choices drop" style="grid-template-columns:1fr"><button class="choice px" data-act="fallback"><span class="ct">${FALLBACK.label}</span>${fxList(FALLBACK.fx)}</button></div>`}
    <p class="under" id="hint">Swipe the card or tap a choice · costs happen now, people remember later</p>`);
  bindSwipe(os);
}
function progress(){return `<div class="progress" aria-label="Decision ${S.idx+1} of ${S.deck.length}">${S.deck.map((_,i)=>`<span class="${i<S.idx?'done':i===S.idx?'now':''}"></span>`).join('')}</div>`;}
function afterScreen(){
  const r=S.result,last=S.idx>=S.deck.length-1;
  shell(`${progress()}<div class="drop"><section class="card px">${speakerHead(r.speaker,`${esc(currentCard(S).phase)} · after the decision`)}
    <div class="selected">${esc(r.choice)}</div><p class="outcome">${esc(r.response)}</p>${fxList(r.actual)}</section></div>
    <div class="actions drop"><button class="primary px" data-act="next">${last?'Put the day to bed':'Continue'} →</button></div>
    <p class="under" style="text-align:left">${saveOK?'Saved on this device.':'Saving is unavailable in this browser. Keep this tab open.'}</p>`);
}
const srow=(ic,k,v)=>`<div class="srow px"><span class="k">${ic}${k}</span><span class="v">${v}</span></div>`;
function nightScreen(){
  const r=S.summary,b=r.before,a=r.after,tomorrow=S.day<6?supplyFor(S,S.day+1):0;
  const warn=[];
  if(r.broke.length)warn.push(...r.broke.map(id=>`Promise broken: ${PROMISES[id].text.toLowerCase()} (${PROMISES[id].who}). −8 Spirits.`));
  if(r.low.length)warn.push(`${r.low.map(k=>NAME[k]).join(' and ')} ended the day low. +${r.low.length} strain.`);
  if(r.strain<0)warn.push('Everyone went to bed fed, clean and in decent spirits. −1 strain.');
  if(a.strain>=STRAIN_MAX)warn.push('The family is under too much strain. Tomorrow starts with asking for help.');
  else if(a.strain===2)warn.push('One more hard night and the family will need outside help.');
  if(S.zeroFood===1)warn.push('Food is at zero. A second night like this and the family needs help.');
  if(S.day<6&&a.water+tomorrow<RESERVE)warn.push('Tomorrow’s drinking reserve is short, even with the delivery.');
  const ch=(was,now)=>`<span class="was">${was} →</span> ${now}`;
  shell(`<section class="scene"><div class="drop"><div class="panel px"><span class="eyebrow">${px('moon',16)} Night · the apartment is quiet</span><h2>${S.day===6?'The end of a week.':'What carries into tomorrow.'}</h2>
    <p class="prose">${esc(nightLine())}</p></div></div>
    <div class="summary drop">${srow(px('lock',18),'Drinking water used',`−${Math.min(RESERVE,b.water)} · ${a.water} left`)}
    ${['food','hygiene','spirits'].map(k=>srow(px(k,18),NAME[k],ch(b[k],a[k]<LOW?`<span style="color:var(--strain)">${a[k]}</span>`:a[k]))).join('')}
    ${srow(px('strain',18),'Strain',`${a.strain} of ${STRAIN_MAX}`)}
    ${S.day<6?srow(px('water',18),'Tomorrow’s delivery',`<span class="tag ${tomorrow?'confirmed':'none'}">${tomorrow?'confirmed':'none'}</span> ${tomorrow}`):''}</div>
    ${warn.map(w=>`<p class="warning">${px('warn',16)}<span>${esc(w)}</span></p>`).join('')}
    <p class="under" style="text-align:left">Every night: ${RESERVE} water for drinking, Food −${-NIGHT.food}, Hygiene −${-NIGHT.hygiene}, Spirits −${-NIGHT.spirits}. A need under ${LOW} adds strain; all three at ${GOOD}+ removes one.</p>
    <div class="actions drop"><button class="primary px" data-act="next">${S.day===6&&a.strain<STRAIN_MAX?'Read the epilogue':'Tomorrow morning'} →</button></div></section>`);
}
function supportScreen(){
  const can=S.supportUsed<1;
  shell(`<section class="scene"><div class="drop"><div class="card px">${speakerHead('Lejla','Before breakfast')}
    <h2>${can?'We need help, and that’s allowed.':'It’s time to go somewhere easier.'}</h2>
    <p class="prose">${can?'“Nobody is sleeping. Niko asked if we’re being punished.” Lejla has the community centre’s leaflet. “They have a kitchen and showers. Vesna says nobody there asks questions.”':'“I called my sister.” Lejla says it before you can start a list. “A few weeks. The children can take the bus to school. This isn’t giving up. The pipes are not our job.”'}</p></div></div>
    <div class="choices drop">${can?`<button class="choice px" data-support="help"><span class="ct">Go to the community centre together.</span>${fxList({food:25,hygiene:25,spirits:10})}<span class="blocked" style="color:var(--go-dark)">${px('strain',14)} Strain back to 1</span></button>`:''}
    <button class="choice px" data-support="leave"><span class="ct">Stay with relatives for a while.</span><span class="chips"><span class="chip px none">Ends the week</span></span></button></div></section>`);
}

function nightLine(){const f=S.flags;return ['Lejla leaves the bowl under the tap. You leave it there too.','Iman’s recording is still on your phone. Through the wall, someone is boiling a kettle.','Niko’s notebook is open on the sofa. There are now more things on the second list.','The clean cups are upside down on a towel. For once, nobody needs the table for anything.','You find a paper boat in your shoe. Preparations are apparently under way.',f.seaReady?'There is a small sea under a tray on the kitchen counter. Tomorrow, somebody will discover it.':'The lighthouse lamp waits on the table. The boats are lined up beside it.','The candles have burned down to seven small puddles. You leave the paper boats out.'][S.day];}
function endingText(){
  const f=S.flags,s=S.st;
  if(S.ending==='relocated')return {title:'A few weeks somewhere easier.',paras:['You arrange a stay with Lejla’s sister. Lejla packs the sewing tin. Iman checks the chargers. Niko asks whether the boats can come. They can.','Leaving the apartment is a decision about care, too. The broken supply is not something your family was obliged to endure alone.',f.helpedVesna||f.fedHelpers?'Vesna promises to water the plants, then laughs at herself. She will keep the complaint numbers safe.':'Vesna waves from the fourth-floor window until the bus turns the corner.']};
  const repaired=f.crewShown&&(f.evidence||0)>=2;
  const p=[ 'On Monday morning, you try the tap. It coughs. This time, nobody mistakes the sound for a promise.',
    repaired?'The local valve has been repaired. It does not fix the whole network, but your block has a collection point that works. Vesna keeps the complaint numbers. You keep the foreman’s number.':(f.evidence||0)>=1?'The repair is still unfinished, but there is a complaint file now, with dates and photographs. People in the queue recognise each other.':'The repair is still unfinished. There are reference numbers, rumours and people who now recognise each other in the queue.',
    f.paidFee?(f.refusedFee?'':'The priority receipt is still folded in your wallet. Next week, the clerk’s fee has gone up.'):'You never paid the clerk. Your name is still on the standard list, which is the only list anyone admits exists.',
    S.promises.sea?.state==='kept'?'Niko’s birthday sea has been packed away. He has crossed it off his list, then written it again for next year. Some things are worth wanting twice.':S.promises.sea?.state==='broken'?'Niko remembers the sea you promised. He is not angry any more. He has added it to the list for when the water comes back, which is a kind of forgiveness.':'Niko’s lighthouse still stands on the windowsill. He turns it on every night, for boats with wheels you can’t see.',
    S.promises.sara?.state==='kept'||f.friendVisited?'Iman and Sara are making a second recording. This one has music in it.':S.promises.sara?.state==='broken'?'Iman hasn’t mentioned Sara again. You notice, and you put it at the top of next week’s list.':'Iman has a new recording on her phone. She plays it for you without being asked.',
    f.sharedPlan?'The notebook lives in the middle of the table now. Two handwritings, sometimes three.':'The notebook is still yours. Lejla has started a second one.'].filter(Boolean);
  const title=s.strain===0?'Together, and mostly all right.':s.strain===1?'Tired, and still together.':'Through the week, just.';
  return {title,paras:p};
}
function endingScreen(){
  const e=endingText(),pr=Object.entries(S.promises);
  app.innerHTML=`<section class="scene" style="padding:28px 0 60px;max-width:640px;margin:0 auto;width:100%"><div class="drop"><div class="panel px"><span class="eyebrow">${S.ending==='relocated'?`Day ${S.day+1} · the end of this week`:'Epilogue'}</span><h2>${esc(e.title)}</h2>
    ${e.paras.map(p=>`<p class="prose" style="margin-top:12px">${esc(p)}</p>`).join('')}
    ${pr.length?`<h3 class="eyebrow" style="margin-top:22px">Promises</h3>${pr.map(([id,p])=>`<div class="promise"><span>${px('promise',16)} ${esc(PROMISES[id].text)} · ${PROMISES[id].who}</span><span class="st ${p.state}">${p.state}</span></div>`).join('')}`:''}</div></div>
    <div class="summary drop">${srow(px('water',18),'Water left',S.st.water)}${srow(px('strain',18),'Strain',`${S.st.strain} of ${STRAIN_MAX}`)}${srow(px('file',18),'Complaint file',S.st.evidence)}${srow(px('promise',18),'Decisions',S.log.length)}</div>
    <div class="actions drop">${S.ending==='relocated'&&S.morning?'<button class="secondary px" data-act="replay">Replay this morning</button>':''}<button class="primary px" data-act="new">A new week</button><button class="secondary px" data-act="history">This week</button><button class="secondary px" data-act="totitle">Title</button></div></section>`;
}

// ---------- dialogs ----------
function modal(html){dlg.innerHTML=html;if(!dlg.open)dlg.showModal();}
function rulesHTML(){return `<header><h2>How to play</h2><button class="close" data-close aria-label="Close">×</button></header>
  <p>Seven days, six decisions a day. Each card is a situation with two choices. <strong>Swipe the card</strong> left or right, tap a choice, or press <kbd>←</kbd> <kbd>→</kbd>.</p>
  <p>Every choice shows what it does: ${chip('food',30)} is a gain, ${chip('water',-3)} is a cost, ${`<span class="chip chance" style="--c:var(--water)">${px('water',15)}+10?<span class="odds">50%</span></span>`} might happen.</p>
  <h3>${px('water',18)} Water</h3><p>The tank holds ${CAP}, one block per unit. Every night ${RESERVE} go to drinking (the pale blocks ${px('lock',14)}), so choices can only spend the white blocks: your free water. Building deliveries are confirmed the night before; tankers and rumours are labelled <em>expected</em>, never promised.</p>
  <h3>${px('food',18)} ${px('hygiene',18)} ${px('spirits',18)} Needs</h3><p>Food, Hygiene and Spirits run from 0 to 100 (each block is 10). Every night: Food −${-NIGHT.food}, Hygiene −${-NIGHT.hygiene}, Spirits −${-NIGHT.spirits}. A tile turns red under ${LOW}.</p>
  <h3>${px('strain',18)} Strain</h3><p>Every need under ${LOW} at bedtime adds a strain pip; all three at ${GOOD} or more removes one. At ${STRAIN_MAX} the family needs outside help, once; the next time they move in with relatives.</p>
  <h3>${px('cash',18)} Credits ${px('errands',18)} Errands</h3><p>Credits buy food and water; Lejla’s repair work brings 2 a day. Queues, paid jobs and civic work use one of your 2 daily errands.</p>
  <h3>${px('promise',18)} Promises</h3><p>Some choices are promises with a day they’re due. Keep them, or say honestly that you can’t. A promise still open on its day breaks at bedtime (−8 Spirits). Open <strong>Family</strong> to see them, and what everyone remembers.</p>
  <h3>${px('file',18)} The city</h3><p>The shortage is not your fault. Documenting the leaks builds a complaint file that can get a real repair. Paying the clerk works, today.</p>
  <h3>Keys</h3><p><kbd>←</kbd>/<kbd>→</kbd> choose · <kbd>Enter</kbd> continue · <kbd>F</kbd> family · <kbd>H</kbd> this week · <kbd>Esc</kbd> or <kbd>P</kbd> pause</p>`;}
function pauseHTML(){return `<header><h2>Paused</h2><button class="close" data-close aria-label="Close">×</button></header>
  <div class="menu"><button class="primary px" data-close>Resume</button><button class="secondary px" data-act="rules">How to play</button><button class="secondary px" data-act="history">This week so far</button>
  ${S.morning?'<button class="secondary px" data-act="replay">Replay this morning</button>':''}<button class="secondary px" data-act="totitle">Save and go to title</button><button class="textbutton" data-act="endrun">End this week (deletes the save)</button></div>
  <p class="muted" style="margin-top:16px;font-size:13px">${versionLabel()} · week ${S.seed%1000}</p>`;}
function familyHTML(){
  const pr=Object.entries(S.promises);
  return `<header><h2>Family</h2><button class="close" data-close aria-label="Close">×</button></header>
  ${pr.length?`<h3>${px('promise',18)} Promises</h3>${pr.map(([id,p])=>`<div class="promise"><span>${esc(PROMISES[id].text)} · ${PROMISES[id].who}${p.state==='open'?` · due ${WEEKDAYS[PROMISES[id].due]}`:''}</span><span class="st ${p.state}">${p.state}</span></div>`).join('')}`:''}
  ${['Samir','Lejla','Iman','Niko','Vesna'].map(n=>{const m=MEMORIES.filter(([w,f])=>w===n&&S.flags[f]).map(x=>x[2]);
    return `<div class="person">${portrait(n)}<div><strong>${n==='Samir'?'Samir (you)':n}</strong> <span class="muted" style="font-size:13px">${esc(people[n].role)}</span><p class="muted">${esc(people[n].bio)}</p>${m.map(x=>`<p class="mem">${px('spirits',14)}<span>${esc(x)}</span></p>`).join('')}</div></div>`;}).join('')}`;
}
function historyHTML(){
  return `<header><h2>This week</h2><button class="close" data-close aria-label="Close">×</button></header>${S.log.length?S.log.slice().reverse().map(e=>`<div class="entry"><span class="eyebrow">${WEEKDAYS[e.day]} · ${e.speaker==='City'?'The city':esc(e.speaker)}</span><h3>${esc(e.title)}</h3><p>${esc(e.choice)}</p>${fxList(e.fx)}</div>`).join(''):'<p class="muted">No decisions yet.</p>'}`;
}

// ---------- swipe ----------
function bindSwipe(os){
  const el=document.getElementById('card'); if(!el)return;
  let x0=null,dx=0,id=null; lean=null;
  const setLean=l=>{if(l===lean)return;lean=l;el.dataset.lean=l??'';document.querySelectorAll('.choice[data-choice]').forEach((b,i)=>b.classList.toggle('hot',i===l));setPreview(l==null?null:os[l].v.fx);};
  el.addEventListener('pointerdown',e=>{if(e.button>0)return;x0=e.clientX;dx=0;id=e.pointerId;el.setPointerCapture(id);el.classList.add('dragging');});
  el.addEventListener('pointermove',e=>{if(x0==null||e.pointerId!==id)return;dx=e.clientX-x0;el.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;setLean(dx<-30?0:dx>30?1:null);});
  const up=e=>{if(x0==null)return;el.classList.remove('dragging');const l=dx<-100?0:dx>100?1:null;x0=null;
    if(l!=null&&os[l].ok){el.style.transform=`translateX(${dx<0?-600:600}px) rotate(${dx/10}deg)`;el.style.opacity='0';setTimeout(()=>pick(l),180);}
    else{el.style.transform='';setLean(null);}};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  document.querySelectorAll('.choice[data-choice]').forEach((b,i)=>{
    b.addEventListener('mouseenter',()=>setLean(i));b.addEventListener('focus',()=>setLean(i));
    b.addEventListener('mouseleave',()=>setLean(null));b.addEventListener('blur',()=>setLean(null));});
}
function pick(i){const c=currentCard(S),o=c.choices[i];if(!o||!allowed(o,S))return;choose(S,c,o);commit();}

// ---------- input ----------
function commit(focus=true){if(S&&S.stage!=='ending')save(S);if(S&&S.stage==='ending')clearSave();render();if(focus)document.getElementById('scene')?.focus({preventScroll:true});scrollTo(0,0);}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-close]');if(!t)return;
  if(t.hasAttribute('data-close')){dlg.close();return;}
  if(t.dataset.choice!=null){pick(+t.dataset.choice);return;}
  if(t.dataset.dawn){dawn(S,t.dataset.dawn);commit();return;}
  if(t.dataset.support){support(S,t.dataset.support);commit();return;}
  const a=t.dataset.act;if(!a)return;
  ({continue(){S=load();if(S)commit();},
    new(){dlg.open&&dlg.close();S=newRun();startDay(S);commit();},
    rules(){modal(rulesHTML());},
    quit(){app.innerHTML=`<section class="title"><div><h1 style="font-size:44px">See you tomorrow.</h1><p class="lead">Your week is saved on this device. You can close this tab.</p><div class="menu"><button class="secondary" data-act="totitle">Back to the title</button></div></div></section>`;},
    next(){if(S.stage==='brief')afterBrief(S);else if(S.stage==='after')advance(S);else if(S.stage==='night')nextMorning(S);commit();},
    fallback(){const c=currentCard(S);choose(S,c,FALLBACK);commit();},
    pause(){modal(pauseHTML());},family(){modal(familyHTML());},history(){modal(historyHTML());},
    replay(){dlg.open&&dlg.close();const m=JSON.parse(S.morning);m.morning=S.morning;S=m;commit();},
    totitle(){dlg.open&&dlg.close();if(S&&S.stage!=='ending')save(S);S=null;render();},
    endrun(){dlg.close();clearSave();S=null;render();}}[a]||(()=>{}))();
});
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;
  if(dlg.open){return;}                    // Esc closes the dialog natively
  if(!S||S.stage==='ending')return;
  if(k==='Escape'||k==='p'||k==='P'){modal(pauseHTML());e.preventDefault();return;}
  if(k==='f'||k==='F'){modal(familyHTML());return;}
  if(k==='h'||k==='H'){modal(historyHTML());return;}
  if(S.stage==='card'){if(k==='ArrowLeft'||k==='1'){pick(0);e.preventDefault();}if(k==='ArrowRight'||k==='2'){pick(1);e.preventDefault();}return;}
  if((k==='Enter'||k===' ')&&document.querySelector('[data-act="next"]')&&!e.target.closest?.('button')){document.querySelector('[data-act="next"]').click();e.preventDefault();}
});
render();

})();
</script></body></html>
