<style>
/* Layout: portrait-first, one screen. Top: day tile + family/pause. HUD: a big water tank tile (one block per unit),
   three need tiles (10 blocks each), a strip of small counters. Middle: the decision card; two chunky choice buttons under it.
   Landscape (≥900px wide): the HUD becomes a left column.
   Look: light, neutral "pixel" — notched corners, hard offset shadows, dithered shading, one saturated colour per resource.
   Fonts are readable sans (no pixel fonts): Barlow Condensed for numbers and labels, Atkinson Hyperlegible for text. */
:root{
  --bg:#e8e6e0; --surface:#f8f7f3; --surface-2:#efede7; --ink:#23262b; --muted:#66655f; --line:#b9b6ad; --shade:rgba(35,38,43,.16);
  /* one colour per resource — the same everywhere: tiles, chips, icons */
  --water:#2a76c0; --water-res:#9cc0e2; --food:#cf6f12; --hygiene:#12938a; --spirits:#c63a72;
  --cash:#a7801a; --errands:#6a4fb0; --strain:#c33b2b; --file:#55677b; --promise:#b0782a;
  --go:#3f8a4a; --go-dark:#2d6a37;
  --tray:#d6d3ca; --tray-edge:#aeaaa0; --tray-key:#e4e1d9; /* the action tray under the card */
  --f-num:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-text:"Atkinson Hyperlegible","Helvetica Neue",Arial,sans-serif;
  --px:3px; /* pixel unit for notches, borders and shadows */
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-text);-webkit-text-size-adjust:100%;
  background-image:radial-gradient(rgba(35,38,43,.07) 1px,transparent 1.2px);background-size:6px 6px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--water);outline-offset:3px}
button:disabled{cursor:not-allowed}
h1,h2,h3,p{margin:0}
#app{min-height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:0 max(14px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.lbl{font:700 12px/1 var(--f-num);letter-spacing:.09em;text-transform:uppercase}
.num{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.muted{color:var(--muted)}

/* ---------- pixel frame: notched corners + inset border; shadows come from the parent's drop-shadow ---------- */
.px{--bc:var(--ink);--bw:var(--px);position:relative;
  clip-path:polygon(var(--px) 0,calc(100% - var(--px)) 0,calc(100% - var(--px)) var(--px),100% var(--px),100% calc(100% - var(--px)),calc(100% - var(--px)) calc(100% - var(--px)),calc(100% - var(--px)) 100%,var(--px) 100%,var(--px) calc(100% - var(--px)),0 calc(100% - var(--px)),0 var(--px),var(--px) var(--px));
  box-shadow:inset 0 0 0 var(--bw) var(--bc)}
.drop{filter:drop-shadow(var(--px) var(--px) 0 var(--shade))}
/* dithered shading on the lower part of coloured tiles */
.dith::after{content:"";position:absolute;left:var(--px);right:var(--px);bottom:var(--px);height:38%;pointer-events:none;
  background:repeating-conic-gradient(rgba(0,0,0,.13) 0 25%,transparent 0 50%) 0 0/4px 4px;
  -webkit-mask:linear-gradient(transparent,#000 90%);mask:linear-gradient(transparent,#000 90%)}
.ico{display:inline-block;flex-shrink:0;image-rendering:pixelated;vertical-align:middle}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 10px}
.daytile{display:flex;align-items:center;gap:10px;background:var(--surface);padding:7px 12px 6px;min-width:0}
.daytile .num{font-size:24px}
.daytile .t{min-width:0}
.daytile .t div{font:700 13px/1.15 var(--f-num);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daytile .t small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .btns{display:flex;gap:8px;flex-shrink:0}
.iconbtn{background:var(--surface);border:0;height:42px;min-width:42px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 14px var(--f-num);letter-spacing:.06em;text-transform:uppercase}
.iconbtn:hover{background:#fff}
.iconbtn svg{width:18px;height:18px}
.iconbtn .badge{background:var(--promise);color:#fff;font:700 12px/18px var(--f-num);padding:0 6px;min-width:18px}

/* ---------- HUD (v4.3): health bars with exact numbers ----------
   Each resource is one bar: the fill is how much you have, the number beside it is exact (24/40, 67/100).
   Faint notches every 10 units help you read it without counting. A dark notch marks LOW (25).
   When a value changes, the bar animates: a loss leaves a red chunk that drains away, a gain fills in, and the
   change floats up (−3, +30). Dragging or hovering a choice previews it: what would go blinks striped, what would come blinks outlined. */
.hud{display:grid;gap:8px;padding-bottom:12px}
.bar{--tb:#fff;background:var(--surface);padding:8px 10px 8px;--bc:color-mix(in srgb,var(--c) 55%,var(--surface));--bw:2px;position:relative}
.bar .bhead{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:24px}
.bar .lbl{display:flex;align-items:center;gap:5px;color:var(--c)}
.bar .val{font:700 25px/1 var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:baseline;gap:1px}
.bar .val small{font-size:15px;color:var(--muted)}
.bar .val .delta{top:-2px;margin-left:5px;box-shadow:inset 0 0 0 1.5px currentColor}
.track{position:relative;height:16px;margin-top:6px;background:color-mix(in srgb,var(--c) 14%,var(--tb));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 28%,var(--tb));overflow:hidden}
.track>i{position:absolute;top:0;bottom:0;left:0;display:block}
.track .ghost{width:0}
.track .fill{background:var(--c);box-shadow:inset 0 3px 0 rgba(255,255,255,.22),inset 0 -3px 0 rgba(0,0,0,.14)}
.track .resv{background:var(--water-res);box-shadow:inset 0 3px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.1)}
.track .notch{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 calc(var(--step) - 1px),rgba(255,255,255,.45) calc(var(--step) - 1px) var(--step))}
.track .mark{width:2px;left:var(--at);background:var(--ink);opacity:.55}
.track .pv{animation:blink .8s steps(2) infinite}
.track .pv.lose{background:repeating-linear-gradient(45deg,#fff 0 3px,#ea8f80 3px 6px)}
.track .pv.gain{background:color-mix(in srgb,var(--c) 35%,transparent);box-shadow:inset 0 0 0 2px var(--c)}
.bar .bfoot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:5px;font:700 12.5px/1.1 var(--f-num);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-height:15px}
.bar .bfoot>span{display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{font:700 11px/1 var(--f-num);letter-spacing:.07em;padding:3px 5px 2px;color:#fff;flex-shrink:0;text-transform:uppercase}
.state.low{background:var(--strain)}.state.warn{background:#d98a12}.state.ok{background:var(--go)}
.bar.low{--bc:var(--strain);--bw:3px}
.bar.low .val{color:var(--strain)}
.bar.warn{--bc:#d98a12}
.needs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.needs .bar{padding:7px 8px 7px}
.needs .bhead{flex-direction:column;align-items:flex-start;gap:3px}
.needs .bfoot{font-size:11.5px}
/* animation: losses drop fast and leave a red chunk that drains; gains show a light chunk the fill grows into */
.bar.down .fill{transition:width .25s ease-out .1s}
.bar.down .ghost{background:#ef8d7d;transition:width .8s ease-in-out .75s}
.bar.up .ghost{background:color-mix(in srgb,var(--c) 40%,var(--tb));transition:width .25s ease-out .1s}
.bar.up .fill{transition:width .8s cubic-bezier(.3,.7,.3,1) .45s}
.bar.down{animation:hit .4s steps(4) .1s}
.bar.up .track{animation:glow 1.2s ease-out .45s}
@keyframes hit{25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-1px)}}
@keyframes glow{0%{filter:brightness(1)}30%{filter:brightness(1.25)}100%{filter:brightness(1)}}
.float{position:absolute;z-index:60;margin-left:-6px;transform-origin:100% 100%;font:800 22px/1 var(--f-num);padding:3px 7px 2px;color:#fff;pointer-events:none;
  animation:floatup 1.6s ease-out forwards;box-shadow:2px 2px 0 var(--shade)}
.float.gain{background:var(--go)}.float.cost{background:var(--strain)}
@keyframes floatup{0%{opacity:0;transform:translate(-100%,8px) scale(.8)}12%{opacity:1;transform:translate(-100%,-4px) scale(1.08)}25%{transform:translate(-100%,-6px) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-100%,-26px)}}
.counters{display:flex;flex-wrap:nowrap;gap:8px}
.ctr{position:relative;display:inline-flex;align-items:center;gap:7px;background:var(--surface);padding:6px 10px 5px;font:700 14px/1 var(--f-num);letter-spacing:.04em;text-transform:uppercase}
.ctr .n{font-size:19px;font-variant-numeric:tabular-nums}
.ctr .n small{font-size:13px;color:var(--muted)}
.ctr .delta{top:0;padding:2px 4px 1px;margin-left:0;box-shadow:inset 0 0 0 1.5px currentColor}
.float.small{font-size:17px}
.ctr.bump{animation:hit .4s steps(4) .1s}
.pips{display:inline-flex;gap:3px}
.pips i{width:11px;height:11px;display:inline-block;box-shadow:inset 0 0 0 2px currentColor}
.pips i.on{background:currentColor}
.delta{font:700 15px/1 var(--f-num);padding:3px 6px 2px;background:#fff;color:var(--ink);font-variant-numeric:tabular-nums;position:relative;display:inline-block}
.delta.cost{color:var(--strain)}.delta.gain{color:var(--go-dark)}
@keyframes blink{50%{opacity:.35}}

/* ---------- stage ---------- */
main{flex:1;padding:4px 0 8px;display:flex;flex-direction:column}
.progress{display:flex;gap:4px;margin-bottom:12px}
.progress span{height:8px;flex:1;background:var(--line)}
.progress .done{background:var(--ink)}.progress .now{background:var(--water)}
.cardwrap{position:relative}
.card{background:var(--surface);padding:16px 16px 18px;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .2s steps(4);animation:enter .2s steps(3)}
.card.dragging{transition:none;cursor:grabbing}
.cardhead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
/* portrait slot: dithered frame in the speaker's colour, until the art arrives */
.portrait{width:64px;height:64px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;--bc:rgba(0,0,0,.3)}
/* voxel renders: drawn small, scaled by whole numbers, never smoothed */
.vox{display:block;width:64px;height:auto;max-width:none}
.vbust{position:relative;z-index:1;display:block}
.cardhead.small{margin-bottom:10px}.cardhead.small .portrait{width:48px;height:48px}.cardhead.small .vox{width:48px}
/* scenes: a soft-lit voxel room on top of the card, the brief and the night; everyone blinks now and then */
.art{position:relative;margin:-13px -13px 14px;aspect-ratio:215/100;overflow:hidden;border-bottom:2px dotted var(--line);
  background:linear-gradient(#f4f2ed,#e6e2d9)}
.art.t-Evening{background:linear-gradient(#f3e8dc,#e5dace)}.art.t-Night{background:linear-gradient(#dfe3ec,#cfd5e0)}
.art .frame{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 36%;display:block}
.art .blink{opacity:0;animation:eyes 7s step-end infinite}
.resultcard .art{pointer-events:none}
/* v4.3: on cards the scene sits at the bottom, under the text */
.art.bottom{margin:16px -13px -15px;border-bottom:0;border-top:2px dotted var(--line)}
.art.bottom.mid{margin-bottom:0;border-bottom:2px dotted var(--line)}
.choices.above{margin:0 0 10px}
.resfx{margin-top:12px}
.art.empty{aspect-ratio:auto;min-height:0;padding:10px 10px 0;border:0;background:none}
.speaker{position:absolute;left:8px;top:8px;z-index:2;display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;background:rgba(248,247,243,.94);--bw:2px;--bc:rgba(35,38,43,.35)}
.art.empty .speaker{position:static;display:inline-flex}
.speaker .portrait{width:40px;height:40px}.speaker .vox{width:40px}
.speaker strong{display:block;font:700 17px/1.05 var(--f-num);letter-spacing:.02em}
.speaker span{display:block;font-size:12px;line-height:1.2;color:var(--muted)}
.cardeye{display:block;margin:0 0 6px}
.title .art{margin:0 0 18px;aspect-ratio:16/9;border:0;background:none}
.vbust .blink{position:absolute;left:0;top:0;opacity:0;animation:eyes 6s step-end infinite;animation-delay:var(--bd,0s)}
@keyframes eyes{0%{opacity:0}92%{opacity:1}95%{opacity:0}}
.portrait::after{content:"";position:absolute;inset:var(--px);background:repeating-conic-gradient(rgba(0,0,0,.14) 0 25%,transparent 0 50%) 0 0/4px 4px;-webkit-mask:linear-gradient(transparent 45%,#000);mask:linear-gradient(transparent 45%,#000)}
.cardhead .who .lbl{color:var(--muted);display:block;margin-bottom:3px}
.cardhead .who strong{font:700 20px/1.1 var(--f-num);letter-spacing:.02em;display:block}
.cardhead .who span{font-size:13px;color:var(--muted)}
.card h2{font:700 30px/1.05 var(--f-num);letter-spacing:.01em;margin-bottom:10px;text-wrap:balance}
.prose{font-size:18px;line-height:1.55}
.lean{position:absolute;top:10px;font:700 13px/1.1 var(--f-num);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px 5px;opacity:0;background:var(--ink);color:#fff;max-width:62%;z-index:2}
.lean.l{left:10px}.lean.r{right:10px;text-align:right}
.card.dragging[data-lean="0"] .lean.l,.card.dragging[data-lean="1"] .lean.r{opacity:1}
/* The actions sit in a tray under the card: darker, flat, dashed seams. They lift only on hover, focus or drag,
   so the card reads as the situation and the tray as what you can do about it. */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;padding:8px;background:var(--tray);--bc:var(--tray-edge);--bw:2px}
.choices::before{content:"";position:absolute;inset:var(--px);pointer-events:none;
  background:repeating-conic-gradient(rgba(35,38,43,.06) 0 25%,transparent 0 50%) 0 0/4px 4px}
@media (max-width:420px){.choices{grid-template-columns:1fr}}
.choice{text-align:left;border:0;background:var(--tray-key);padding:11px 12px 12px;display:flex;flex-direction:column;gap:9px;--bw:2px;--bc:var(--tray-edge);position:relative;z-index:1;transition:transform .08s steps(2)}
.choice:not(:disabled):hover,.choice.hot{background:var(--surface);--bc:var(--ink);--bw:var(--px);transform:translate(calc(-1*var(--px)),calc(-1*var(--px)));filter:drop-shadow(var(--px) var(--px) 0 var(--shade))}
.choice.hot{--bc:var(--water)}
.choice:not(:disabled):active{transform:translate(0,0);filter:none}
.choice:disabled{background:transparent;color:var(--muted);--bc:var(--line)}
.choice:disabled .chips{opacity:.55}
.ct{display:flex;gap:9px;align-items:flex-start;font:700 18px/1.15 var(--f-num);letter-spacing:.02em}
/* a key cap on the outer edge ties each action to its swipe direction */
.ct .arrow{flex-shrink:0;width:24px;height:24px;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:15px;margin-top:-2px}
.choice:disabled .ct .arrow{background:var(--line)}
.choice.r .ct{justify-content:space-between}
.choices.one{grid-template-columns:1fr}
.chips{display:flex;flex-wrap:wrap;gap:5px}
/* a chip = icon + signed number. Gains are filled with the resource colour; costs are white with a coloured frame. */
.chip{--c:var(--ink);display:inline-flex;align-items:center;gap:4px;padding:4px 7px 3px 5px;font:700 16px/1 var(--f-num);font-variant-numeric:tabular-nums;--bw:2px;--px:2px}
.chip.gain{background:var(--c);color:#fff;--bc:rgba(0,0,0,.25)}
.chip.cost{background:#fff;color:var(--c);--bc:var(--c)}
.chip.chance{background:#fff;color:var(--c);--bc:var(--c);border:0;outline:2px dashed var(--c);outline-offset:-2px}
.chip.chance .odds{font-size:12px;color:var(--muted);margin-left:2px}
.chip.none{background:var(--surface-2);color:var(--muted);--bc:var(--line)}
.chip.spill{background:#fff;color:var(--muted);--bc:var(--line)}
.blocked{display:flex;align-items:center;gap:6px;font:700 14px/1.2 var(--f-num);letter-spacing:.02em;color:var(--strain)}
.under{font-size:13px;color:var(--muted);margin-top:12px;text-align:center}
.resultcard{display:block;width:100%;text-align:left;border:0;cursor:pointer;color:var(--ink);font:inherit}
.resultcard:hover,.resultcard:focus-visible{background:#fff;--bc:var(--water)}
.resultcard:active{transform:translate(var(--px),var(--px))}
.resultcard .cta{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:16px;padding-top:12px;border-top:2px dotted var(--line);
  font:700 18px/1 var(--f-num);letter-spacing:.06em;text-transform:uppercase;color:var(--go-dark)}
.resultcard .cta .arrow{width:32px;height:32px;display:grid;place-items:center;background:var(--go);color:#fff;font-size:18px}
.resultcard:hover .cta .arrow{background:var(--go-dark);animation:nudge .6s steps(2) infinite}
@keyframes nudge{50%{transform:translateX(3px)}}
.selected{font:700 16px/1.2 var(--f-num);letter-spacing:.03em;text-transform:uppercase;color:var(--muted);padding-bottom:10px;border-bottom:2px dotted var(--line)}
.outcome{font-size:20px;line-height:1.5;margin:14px 0 14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.primary,.secondary{border:0;padding:14px 22px 13px;font:700 18px/1 var(--f-num);letter-spacing:.06em;text-transform:uppercase}
.primary{background:var(--go);color:#fff;--bc:var(--go-dark)}
.primary:hover{background:#4a9a55}
.secondary{background:var(--surface);--bc:var(--ink)}
.secondary:hover{background:#fff}
.primary:active,.secondary:active{transform:translate(var(--px),var(--px))}
.textbutton{border:0;background:none;padding:6px 0;font-size:14px;color:var(--muted);text-decoration:underline}
.scene{animation:enter .2s steps(3)}
.panel{background:var(--surface);padding:16px}
.panel h2,.scene>h2{font:700 34px/1.05 var(--f-num);margin:6px 0 12px;text-wrap:balance}
.eyebrow{font:700 13px/1 var(--f-num);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.days{display:flex;gap:4px;margin:0 0 14px}
.days span{flex:1;text-align:center;font:700 14px/1 var(--f-num);padding:6px 0 5px;background:var(--surface-2);color:var(--muted)}
.days .on{background:var(--ink);color:#fff}.days .past{background:var(--line);color:var(--surface)}
.notice{display:grid;gap:8px;margin-top:14px}
.fc{display:flex;gap:10px;align-items:center;font-size:15px;background:var(--surface);padding:9px 11px 9px 9px;--bw:2px;--bc:var(--line)}
.tag{font:700 12px/1 var(--f-num);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px 3px;flex-shrink:0;color:#fff}
.tag.confirmed{background:var(--go)}.tag.expected{background:var(--cash)}.tag.rumoured{background:var(--file)}.tag.none{background:var(--strain)}
.summary{display:grid;gap:6px;margin:14px 0}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 11px 8px 9px;background:var(--surface);font-size:15px;--bw:2px;--bc:var(--line)}
.srow .k{display:flex;align-items:center;gap:8px}
.srow .v{font:700 19px/1 var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.srow .v .was{color:var(--muted);font-size:16px}
.warning{display:flex;gap:8px;align-items:flex-start;font-size:15px;color:var(--strain);margin:8px 0}
.promise{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;padding:8px 0;border-bottom:2px dotted var(--line)}
.promise .st{font:700 13px/1 var(--f-num);text-transform:uppercase;letter-spacing:.08em;padding:4px 6px 3px;color:#fff}
.promise .st.open{background:var(--promise)}.promise .st.kept{background:var(--go)}.promise .st.broken{background:var(--strain)}

/* ---------- title ---------- */
.title{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:40px 0 60px;position:relative}
.title .logo{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.title h1{font:800 clamp(54px,15vw,84px)/.9 var(--f-num);letter-spacing:-.01em;text-transform:uppercase;margin:6px 0 16px}
.title h1 .sub{display:block;color:var(--water);font-size:.38em;letter-spacing:.04em;margin-top:8px}
.title .lead{font-size:19px;line-height:1.45}
.title .menu{display:grid;gap:10px;margin-top:26px;max-width:340px}
.title .menu button{text-align:left}
.title .quote{font-style:italic;font-size:17px;margin-top:30px;color:var(--muted)}
.title .quote span{display:block;font:700 12px var(--f-num);letter-spacing:.08em;text-transform:uppercase;font-style:normal;margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.sndbtn{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));min-width:42px;padding:0}
.iconbtn[aria-pressed="false"]{color:var(--muted)}
.ver{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));font:700 13px var(--f-num);letter-spacing:.05em;color:var(--muted)}
.cast{display:none}

/* ---------- dialogs ---------- */
dialog{border:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100% - 24px));max-height:86dvh;padding:22px;box-shadow:inset 0 0 0 3px var(--ink),6px 6px 0 rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(35,38,43,.55)}
dialog header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:16px}
dialog h2{font:700 32px/1 var(--f-num);text-transform:uppercase}
dialog h3{font:700 17px/1.2 var(--f-num);letter-spacing:.05em;text-transform:uppercase;margin:18px 0 6px;display:flex;align-items:center;gap:7px}
dialog p,dialog li{font-size:15px;margin:6px 0}
dialog .close{border:0;background:none;font-size:30px;line-height:1;padding:0 6px}
dialog .menu{display:grid;gap:8px}
dialog .menu button{text-align:left}
.entry{border-top:2px dotted var(--line);padding:12px 0}
.entry h3{margin:4px 0}.entry p{font-size:15px}
.person{display:flex;gap:12px;padding:12px 0;border-top:2px dotted var(--line)}
.person .portrait{width:64px;height:64px}
.person p{font-size:14px}
.person .mem{font-size:15px;color:var(--ink);display:flex;gap:6px;align-items:flex-start}
.person strong{font:700 19px var(--f-num)}
kbd{font:700 13px var(--f-num);padding:1px 5px;background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--line)}

@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- landscape: HUD as a column on the left ---------- */
@media (min-width:900px) and (orientation:landscape){
  #app{max-width:1120px}
  .game{display:grid;grid-template-columns:330px minmax(0,640px);gap:0 44px;justify-content:center;align-content:start;flex:1}
  .game .top{grid-column:1/-1}
  .game .hud{align-self:start}
  .game .needs{grid-template-columns:1fr}
  .game .needs .bhead{flex-direction:row;align-items:center}
  .title{display:grid;grid-template-columns:1.1fr 1fr;gap:64px;align-items:center}
  .cast{display:block}
  .cast .person:first-child{border-top:0}
}
/* ---------- morning and night (v4.3): a new day has to feel like one ---------- */
/* Morning: warm paper, a sunrise header with the weekday big, and a sunrise card that lifts away on arrival. */
body[data-theme="morning"]{--bg:#f3ebdd;background-color:var(--bg)}
.dayhero{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:10px;--bc:#e3a35f;--bw:2px;
  background:linear-gradient(100deg,#ffd29a 0%,#ffe6c2 45%,#fdf4e6 100%)}
.dayhero .sunrise{width:54px;height:54px;flex-shrink:0;display:grid;place-items:center;background:#fff6e6;box-shadow:inset 0 0 0 2px #f0b46e}
.dayhero h1{font:800 44px/.95 var(--f-num);text-transform:uppercase;letter-spacing:.01em;color:#8a4a12}
.dayhero .eyebrow{color:#a7651f}
.morning .panel h2{margin-top:0}
.sect{display:flex;align-items:center;gap:6px;margin:16px 0 -4px}
.daysplash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none;
  background:linear-gradient(#f7a85e 0%,#ffd39c 45%,#fff1dc 100%);animation:splash 1.7s ease-in forwards}
.daysplash div{display:grid;justify-items:center;gap:8px;animation:splashin 1.7s ease-out forwards}
.daysplash span{font:700 18px/1 var(--f-num);letter-spacing:.14em;text-transform:uppercase;color:#a0561a}
.daysplash strong{font:800 clamp(64px,18vw,120px)/.9 var(--f-num);text-transform:uppercase;color:#7a3c0c}
@keyframes splash{0%,62%{transform:none;opacity:1}100%{transform:translateY(-100%);opacity:.6}}
@keyframes splashin{0%{transform:translateY(18px);opacity:0}25%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.daysplash{display:none}}
/* Night: the whole screen goes dark and starry, the HUD steps aside for the overnight summary. */
body[data-theme="night"]{--bg:#1a2030;--surface:#252d3f;--surface-2:#2e374b;--ink:#eef0f6;--muted:#a2abbf;--line:#465068;--shade:rgba(0,0,0,.4);
  background-color:var(--bg);background-image:radial-gradient(rgba(255,255,255,.55) 1px,transparent 1.5px),radial-gradient(rgba(255,255,255,.25) 1px,transparent 1.5px);
  background-size:97px 89px,41px 53px;background-position:0 0,17px 23px;color-scheme:dark}
body[data-theme="night"] .bar{--tb:#1a2030}
body[data-theme="night"] .iconbtn:hover{background:#323b52}
body[data-theme="night"] .delta{background:var(--surface-2)}
.nightscreen{animation:dusk .9s ease-out}
@keyframes dusk{from{opacity:0;filter:brightness(1.8)}to{opacity:1;filter:none}}
.nighthero{padding:6px 2px 4px}
.nighthero .eyebrow{display:flex;align-items:center;gap:7px;color:#b9b2e8}
.nighthero h2{font:700 36px/1.02 var(--f-num);margin:8px 0 8px;text-wrap:balance}
.nighthero .prose{color:var(--muted);font-size:17px}
.lowbox{margin-top:14px;--bc:var(--strain);--bw:3px}
.lowbox.fine{--bc:var(--go)}
.lowbox h3{display:flex;align-items:center;gap:7px;font:700 18px/1 var(--f-num);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.lowline{display:flex;gap:9px;align-items:flex-start;font-size:15.5px;line-height:1.35;padding:6px 0}
.lowline .state{margin-top:2px;min-width:40px;text-align:center}
.nightbars{display:grid;gap:8px;margin-top:12px}
.bar.wide .bfoot{font-size:13px}
.strainrow .pips.big{gap:4px;margin-right:9px;color:var(--strain);align-self:center}
.strainrow .pips.big i{width:15px;height:15px}
.art.nightart{margin:16px 0 4px;aspect-ratio:215/100;border:0;box-shadow:inset 0 0 0 2px var(--line)}
/* landscape without a HUD (the night): one centred column */
@media (min-width:900px) and (orientation:landscape){.game.nohud{grid-template-columns:minmax(0,640px)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- v4.4: illustrated, muted, soft ----------
   The pixel look goes: no notched corners, dithering or hard offset shadows. Soft rounded shapes on warm paper,
   one muted colour per resource (still distinct), and the scenes are flat vector illustrations with hatching. */
:root{
  --bg:#efede6; --surface:#faf8f3; --surface-2:#f2efe7; --ink:#3d3e40; --muted:#77736a; --line:#d6d1c5; --shade:rgba(61,62,64,.10);
  --water:#4f86a6; --water-res:#b8d1dc; --food:#c27537; --hygiene:#5b958b; --spirits:#b85a6b;
  --cash:#a5873b; --errands:#7a668f; --strain:#ad4a3b; --file:#6b7984; --promise:#b5813f;
  --go:#5f8a5e; --go-dark:#48704a;
  --tray:#e6e1d5; --tray-edge:#d3ccbc; --tray-key:#f6f3ec;
  --r:16px; --r-s:10px;
}
body{background-image:none}
.px{clip-path:none;border-radius:var(--r);--bc:rgba(61,62,64,.07);--bw:1px}
.drop{filter:drop-shadow(0 1px 0 rgba(61,62,64,.06)) drop-shadow(0 6px 14px rgba(61,62,64,.07))}
.dith::after,.portrait::after,.choices::before{display:none}
.ico{image-rendering:auto}
.iconbtn,.ctr,.chip,.state,.tag,.delta,.float,.promise .st,.speaker,.fc,.srow,.days span,kbd{border-radius:var(--r-s)}
.chip{border-radius:999px;padding:4px 9px 3px 6px}
.chip.chance{outline:0;box-shadow:none;border:2px dashed var(--c)}
.track,.track>i,.progress span{border-radius:999px}
.track .fill,.track .resv{box-shadow:inset 0 2px 0 rgba(255,255,255,.22)}
.pips i{border-radius:4px}
.bar{--bc:color-mix(in srgb,var(--c) 30%,var(--surface));--bw:1.5px}
.card{transition:transform .25s cubic-bezier(.2,.8,.3,1);animation:enter .35s ease-out;overflow:hidden}
.panel{overflow:hidden}
.scene{animation:enter .35s ease-out}
.bar.down,.ctr.bump{animation:hit .4s ease-out .1s}
.track .pv{animation:blink 1s ease-in-out infinite}
/* the scene: an illustration that bleeds to the card edges */
.art{border-bottom:0;background:#e9e4d8;margin-left:-16px;margin-right:-16px}
.art.bottom{border-top:0;margin-bottom:-18px;border-radius:0 0 var(--r) var(--r)}
.art.bottom.mid{border-bottom:0;border-radius:0}
.art svg.frame{position:absolute;inset:0;width:100%;height:100%;display:block}
.art.nightart{box-shadow:none;border-radius:var(--r)}
.title .art{border-radius:24px;overflow:hidden}
.speaker{background:rgba(250,248,243,.95);box-shadow:0 2px 10px rgba(61,62,64,.12)}
.portrait{border-radius:50%;--bw:0px}
.speaker .portrait{width:42px;height:42px}
.vbust,.vbust svg{display:block;width:100%;height:100%}
.portrait{align-items:stretch}
/* blinking: open eyes, then closed for a moment; each person on their own beat */
.ec{opacity:0}
@media (prefers-reduced-motion:no-preference){
  .eo{animation:eo 6.5s step-end infinite}.ec{animation:ec 6.5s step-end infinite}
  .b1{animation-delay:-1.3s}.b2{animation-delay:-2.9s}.b3{animation-delay:-4.1s}.b4{animation-delay:-.7s}.b5{animation-delay:-5.3s}.b6{animation-delay:-3.6s}
}
@keyframes eo{0%{opacity:1}93%{opacity:0}96%{opacity:1}}
@keyframes ec{0%{opacity:0}93%{opacity:1}96%{opacity:0}}
/* actions */
.choices{border-radius:calc(var(--r) + 4px);--bw:0px;background:var(--tray)}
.choice{border-radius:var(--r);--bw:1px;--bc:var(--tray-edge);transition:transform .15s ease,background .15s}
.choice:not(:disabled):hover,.choice.hot{--bw:2px;--bc:var(--ink);transform:translateY(-2px);filter:drop-shadow(0 6px 10px rgba(61,62,64,.10))}
.choice.hot{--bc:var(--water)}
.choice:not(:disabled):active{transform:none}
.ct .arrow,.resultcard .cta .arrow{border-radius:8px}
.primary,.secondary{border-radius:14px}
.primary:hover{background:#6b9869}
.resultcard:active,.primary:active,.secondary:active{transform:translateY(1px)}
.resultcard .cta,.selected,.entry,.person,.promise{border-color:var(--line);border-top-style:solid;border-bottom-style:solid;border-width:0}
.resultcard .cta{border-top-width:1.5px}.selected{border-bottom-width:1.5px}.entry,.person{border-top-width:1.5px}.promise{border-bottom-width:1.5px}
dialog{border-radius:22px;box-shadow:0 20px 60px rgba(40,40,40,.25)}
dialog::backdrop{background:rgba(61,62,64,.45)}
@keyframes hit{25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-1px)}}
/* morning and night, retinted to the palette */
body[data-theme="morning"]{--bg:#f2ebdf}
.dayhero{--bc:#e2c4a0;background:linear-gradient(100deg,#f1cfa6 0%,#f5e2c8 45%,#faf5ec 100%)}
.dayhero .sunrise{background:#fbf3e6;box-shadow:inset 0 0 0 2px #e2b98a;border-radius:50%}
.dayhero h1{color:#8e4f2c}.dayhero .eyebrow{color:#a8673f}
.daysplash{background:linear-gradient(#e7a77c 0%,#f1cfa6 45%,#f7efe3 100%)}
.daysplash span{color:#a05c38}.daysplash strong{color:#7c3f22}
body[data-theme="night"]{--bg:#2b3140;--surface:#353c4d;--surface-2:#3e4659;--ink:#eeece6;--muted:#aeb2bd;--line:#535b6e}

/* ---------- v5: four two-edged meters, portrait cards, pictograms, arrows ----------
   The HUD is four bars in a 2×2 grid (a column in landscape). Each bar has a danger zone at both ends
   (the top one only from level 2). A card is the speaker's portrait on a band coloured by place, the text,
   then two choices, each with a pictogram of what you'd do and arrow chips for which meters move. */
:root{--face:#7a668f}
.hud4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-bottom:12px}
.hud4 .bar{padding:7px 9px 7px}
.hud4 .bar .val{font-size:22px}
.track .edge{position:absolute;top:0;bottom:0;width:20%;background:repeating-linear-gradient(135deg,rgba(173,74,59,.16) 0 3px,transparent 3px 6px)}
.track .edge.lo{left:0}.track .edge.hi{right:0;left:auto}
.state.high{background:#c4703a}
.bar.high{--bc:#c4703a;--bw:3px}
.bar.high .val{color:#c4703a}
.abadge{font:800 12px/1 var(--f-num);letter-spacing:-.05em;padding:3px 5px 2px;border-radius:7px;margin-left:4px;color:#fff;background:var(--c)}
.abadge.down{background:#fff;color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.track .pv{opacity:.9}
.track .pv.gain{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 45%,transparent),color-mix(in srgb,var(--c) 15%,transparent))}
.track .pv.lose{background:repeating-linear-gradient(45deg,#fff 0 3px,#e9a597 3px 6px)}
.bar.previewing{--bc:var(--c);--bw:2px}
.achip b{font:800 14px/1 var(--f-num);letter-spacing:-.06em}
/* the card */
.pcard{padding:0 16px 18px}
.phead{display:flex;align-items:center;gap:14px;margin:0 -16px 14px;padding:14px 16px;background:var(--place);position:relative}
.portrait.big{width:76px;height:76px;flex-shrink:0;box-shadow:0 2px 0 rgba(61,62,64,.06),0 0 0 3px #fbf8f1}
.portrait.mini{width:40px;height:40px}
.phead .who{min-width:0}
.phead .who .lbl{display:block;color:var(--muted);margin-bottom:3px}
.phead .who strong{display:block;font:700 21px/1.05 var(--f-num);letter-spacing:.01em}
.phead .who span:last-child{display:block;font-size:13px;color:var(--muted);line-height:1.25}
.placetag{display:none;position:absolute;right:12px;top:10px;display:flex;align-items:center;gap:3px;font:700 11px/1 var(--f-num);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pcard h2{margin-top:2px}
/* the two choices: pictogram, label, arrows */
.choices{margin-top:10px}
.ct{align-items:center}
.ct .cl{flex:1}
.choice.r .ct{justify-content:flex-start}
.pict{width:42px;height:42px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink);--bw:1.5px;--bc:var(--tray-edge)}
.choice:not(:disabled):hover .pict,.choice.hot .pict{background:var(--ink);color:#fff}
.ct .arrow{margin-top:0;background:transparent;color:var(--muted);width:auto}
.selected{display:flex;align-items:center;gap:10px}
.selected .pict{width:34px;height:34px}
.resfx{display:grid;gap:6px}
/* the morning */
.reduc span{font-size:13px}
.reduc .added{background:repeating-linear-gradient(135deg,var(--surface-2) 0 4px,#ecd9cf 4px 8px);color:var(--strain)}
.reduc .on{background:var(--ink);color:#fff}.reduc .past{background:var(--line);color:var(--surface)}
.annc{display:flex;gap:10px;align-items:flex-start;background:#fbf7ee;padding:12px 13px;--bw:1.5px;--bc:#d9c9a6;position:relative;overflow:hidden}
.annc p{font:700 17px/1.3 var(--f-text);margin-top:4px}
.annc.ext{--bc:var(--strain);--bw:2px}
.annc .stamp{display:inline-block;margin-top:8px;font:800 12px/1 var(--f-num);letter-spacing:.12em;text-transform:uppercase;color:var(--strain);border:2px solid var(--strain);border-radius:6px;padding:4px 7px 3px;transform:rotate(-3deg)}
.jumpline{font-style:italic;color:var(--muted);margin:4px 2px 12px;font-size:16px}
body[data-theme="night"] .jumpline{color:#c9c3ef}
.intro h2{font-size:26px;line-height:1.1}
.intro p{font-size:15.5px;margin:4px 0}
.intro .hh,.intro .nbs{display:flex;flex-wrap:wrap;gap:12px 18px;margin:12px 0 4px}
.intro .who{display:flex;align-items:center;gap:9px}
.intro .who .portrait{width:52px;height:52px}
.intro .who .portrait.mini{width:42px;height:42px}
.intro .who strong{display:block;font:700 17px/1.05 var(--f-num)}
.intro .who span{display:block;font-size:12.5px;color:var(--muted)}
.intro .sect{margin:14px 0 2px}
/* household dialog */
.feel{font:700 11px/1 var(--f-num);letter-spacing:.07em;text-transform:uppercase;padding:3px 6px 2px;border-radius:6px;color:#fff;background:var(--muted);vertical-align:2px}
.feel.f-2,.feel.f-1{background:var(--strain)}.feel.f1,.feel.f2{background:var(--go)}
.entry.locked h3{color:var(--muted)}
/* title: the ladder */
.ladder{margin-top:28px}
.ladder p{font-size:15px;margin:6px 0 12px;max-width:440px}
.lvls{display:grid;gap:6px;max-width:440px}
.lvl{display:flex;align-items:center;gap:12px;background:var(--surface);padding:8px 12px}
.lvl .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:18px}
.lvl.cur{--bc:var(--water);--bw:2px}.lvl.cur .n{background:var(--water);color:#fff}
.lvl div{flex:1;min-width:0}.lvl strong{display:block;font:700 17px/1.1 var(--f-num)}.lvl small{color:var(--muted);font-size:12.5px}
.lvl.locked{opacity:.55}
.endscreen{padding:28px 0 60px;max-width:640px;margin:0 auto;width:100%}
.endscreen .art{margin:-16px -16px 14px;border-radius:var(--r) var(--r) 0 0}

  .game .hud4{grid-template-columns:1fr}

/* v5.0.1: one card. The bottom of the card is split into the two choices; leaning darkens one half and fades the other.
   The result keeps the same shape: its bottom strip says Tap to continue. */
.pcard.one{padding-bottom:0;overflow:hidden}
.halves{display:grid;grid-template-columns:1fr 1fr;margin:16px -16px 0;border-top:1.5px solid var(--line)}
.half{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:9px;padding:13px 14px 15px;min-height:96px;transition:background .15s,color .15s,opacity .15s}
.half.r{border-left:1.5px solid var(--line);align-items:flex-end;text-align:right}
.half .hl{display:flex;gap:6px;align-items:baseline;font:700 18px/1.15 var(--f-text)}
.half .ha{color:var(--muted);font-weight:700}
.half.r .chips{justify-content:flex-end}
.half:focus-visible{outline:3px solid var(--water);outline-offset:-3px}
.half.hot,.half:hover{background:var(--ink);color:#fff}
.half.hot .ha,.half:hover .ha{color:#fff}
.half.hot .chip.cost,.half:hover .chip.cost{background:#fff}
.halves:has(.hot) .half:not(.hot){opacity:.35}
.resultcard.one .cta{justify-content:center;margin:16px -16px 0;padding:15px 16px 16px;border-top:1.5px solid var(--line);color:var(--muted);font-size:16px}
.resultcard.one .cta .arrow{width:auto;height:auto;background:none;color:inherit;font-size:16px;animation:none}
.resultcard.one:hover .cta{color:var(--go-dark)}
/* v5.0.2: notes, the decisionless cards */
.notecard{text-align:center}
.nbody{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 6px 8px}
.nbig{font:700 28px/1.15 var(--f-num);letter-spacing:.01em;text-wrap:balance}
.nsmall{font-size:17px;line-height:1.45;color:var(--muted);text-wrap:balance}
.nrule{font:700 14px/1.3 var(--f-num);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.nppl{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 16px}
.nppl .who{display:flex;flex-direction:column;align-items:center;gap:4px;font:700 15px/1 var(--f-num)}
.nppl .portrait.mini{width:52px;height:52px}
.notecard .stamp{display:inline-block;font:800 12px/1 var(--f-num);letter-spacing:.12em;text-transform:uppercase;color:var(--strain);border:2px solid var(--strain);border-radius:6px;padding:4px 7px 3px;transform:rotate(-3deg)}
.notecard.ext .nbig{color:var(--strain)}
</style></head><body><div id="app"></div><dialog id="dialog"></dialog>
<script>
(()=>{
// ---------- content.js ----------
// Everything the game says, as data. The engine (below) knows how to roll a household, build a day's deck from the
// bag and apply a choice; this section is only who, where and what.
//
// A card: card(id, family, speaker, place, title, text, optionA, optionB, more)
//   family  routine | arc | circ | neighbour | city | event
//   speaker you | partner | a neighbour archetype (driver, elder, gossip, spiteful) | a city person | sib | radio
//   place   home | stair | street | office  (the colour behind the portrait)
//   text    a string, a list of variants (one is picked when the card is drawn) or a function of the state
//   more    when(s) can it appear · w weight (number or function) · cd cooldown in days · once · boost {event: x}
// An option: opt(label, pictogram, arrows, response, extra)
//   arrows  {water, spirits, face, money}: ±1 is ▲/▼ (about 8), ±2 is ▲▲/▼▼ (about 15). Never exact on the card.
//   extra   tag / tags · inc (counters) · disp (neighbour feeling) · sched [card, from, to days] · mem (what they remember)
//           promise · keep · brk · end (moves the promised end date) · ev (starts an event)
// Text slots: {you} {partner} {driver} {elder} {gossip} {spiteful} {sib} {clerk} {foreman} {official} {tanker} {reporter},
// with .he .him .his .He .His (pronouns) and .floor; {end} / {endDay} the promised last day; {wedDay} {examDay}.
const opt=(l,p,fx,r,x)=>({l,p,fx:fx||{},r,x:x||{}});
const card=(id,fam,who,place,title,text,a,b,more={})=>({id,fam,who,place,title,text,a,b,...more});
const has=(s,t)=>!!(s.tags&&s.tags[t]);
const cnt=(s,t)=>(s.tags&&+s.tags[t])||0;
const circ=(s,c)=>s.circ.includes(c);
const couple=s=>!!s.people.partner;
const disp=(s,a)=>s.people[a]?s.people[a].disp:0;
const lateIn=s=>s.day>=Math.ceil(s.announced*0.6);       // time has visibly passed
const bestNb=s=>['driver','elder','gossip','spiteful'].reduce((a,b)=>disp(s,b)>disp(s,a)?b:a);
const afterEnd=s=>s.day>s.announced;                      // the city broke its word

// ---------- names and looks ----------
const NAMES={m:['Almir','Damir','Haris','Jasmin','Kenan','Nermin','Senad','Tarik','Vedran','Goran','Igor','Dino','Adnan','Emir','Mario'],
  f:['Sanja','Aida','Selma','Amra','Lejla','Maja','Ivana','Nina','Emina','Merima','Azra','Jasna','Mirela','Lamija','Dijana'],
  oldm:['Mujo','Stjepan','Hamdija','Ivo','Rasim','Nikola'],oldf:['Vesna','Fadila','Ruža','Zora','Hajra','Milka']};
const LOOK={skin:['#e3bc98','#e8c4a2','#e6c19f','#d9ab86','#c99673','#ecc9a8','#d3a27c'],
  hair:['#3d3a38','#3e3b3b','#5a4a3e','#a3866a','#6b5444','#2f2f2f','#8a5a3c','#d4b880'],grey:['#b9b6b0','#d6d2cc','#a8a39c'],
  top:['#6f8f7e','#b6604e','#5f8296','#cfa349','#8a6f8f','#7d8a8f','#a8835a','#c98b7f','#62807f','#46546a'],
  bottom:['#4a4a4a','#46546a','#5c6a7a','#3d4757','#6b5444'],shoes:['#4a4a4a','#5b4a3e','#7c5244','#c4ad7f','#333333'],
  fstyle:['long','bob','wavy','bun','long','bob'],mstyle:['short','short','slick','bald'],
  tops:['sweater','turtle','cardigan','tee','puffer','coat','hoodie']};

// ---------- the building's people: archetypes (v5.0 has four; v5.1 adds the new family, the manager, the cousin) ----------
const ARCHETYPES={
  driver:{label:'The retired driver',kind:'kind',start:1,old:true,role:'Neighbour · retired bus driver',
    bio:'Knows every tanker route and every queue. Pretends to borrow things when {driver.he} is really checking on people.',styleF:'cardigan'},
  elder:{label:'The elder upstairs',kind:'kind, needs help',start:0,old:true,role:'Neighbour · lives alone',
    bio:'Can’t carry water up the stairs any more and hates asking. Pays back in jars of peppers and in good words about you.'},
  gossip:{label:'The gossip',kind:'neutral, dangerous',start:0,role:'Neighbour · knows everyone',
    bio:'Repeats whatever you say, a little improved. Can make you look wonderful or ridiculous by Thursday.'},
  spiteful:{label:'The spiteful one',kind:'spiteful',start:-1,role:'Neighbour · keeps notes',
    bio:'Counts other people’s containers. Has the city’s complaint line saved under Favourites.'},
};
// ---------- the city: the same people in every run ----------
const CITY={
  clerk:{name:'Mr Begić',g:'m',role:'Clerk · water depot, counter A17',cast:'Clerk',bio:'Has no water at home either. Has stopped believing anything he stamps will change anything.'},
  foreman:{name:'Zoran',g:'m',role:'Foreman · maintenance crew',cast:'Foreman',bio:'Digs where the work order says, even when he knows it’s the wrong valve. Has a mortgage.'},
  official:{name:'Spokesman Kovač',g:'m',role:'Municipal water service',cast:'Official',bio:'Believes about half of what he says at the microphone. Says all of it with conviction.'},
  tanker:{name:'Mira',g:'f',role:'Tanker driver',cast:'Tanker',bio:'Decides which street gets the last five hundred litres. Doesn’t sleep well.'},
  reporter:{name:'Lana',g:'f',role:'Reporter · City TV',cast:'Reporter',bio:'Needs a smiling family for the evening news. Would also take a crying one.'},
  radio:{name:'City radio',g:'m',role:'Municipal announcements',cast:'Official',bio:'Thank you for your patience.'},
};

// ---------- levels: the household is the difficulty ----------
const LEVELS=[null,
  {n:1,name:'Single person',short:'On your own',size:1,announced:5,maxLen:9,top:false,night:{water:-8,spirits:-4,money:-4},extP:[.8,0],extLen:[2,3],deliv:[8,13],delivP:.5,
    adds:'Learn the four meters. You need the neighbours.'},
  {n:2,name:'A couple',short:'Two of you',size:2,announced:7,maxLen:12,top:true,night:{water:-10,spirits:-3,money:-4},extP:[.8,.35],extLen:[3,4],deliv:[12,18],delivP:.6,
    adds:'Someone else’s Spirits. Who queues and who works. The top edges count now.'},
];
const MAXLEVEL=2;

// ---------- story contexts: one per run, the spine of its emotional arc. Beats are placed in time (A = announced end). ----------
const CONTEXTS={
  wedding:{name:'The wedding',line:'{sib}, your sibling, marries on {wedDay}: the day after the water comes back.',
    beats:A=>[['x_wed_1',2],['x_wed_2',Math.max(3,A-2)],['x_wed_3',A],['x_wed_4',A+1]]},
  exam:{name:'The exam',line:'Your licensing exam is on {examDay}, the last day. A year of studying.',
    beats:A=>[['x_exam_1',1],['x_exam_2',Math.max(2,A-3)],['x_exam_3',A-1],['x_exam_4',A]]},
  newhere:{name:'Just moved in',line:'You moved in nine days ago. Nobody here knows your name.',
    beats:A=>[['x_new_1',1],['x_new_2',3],['x_new_3',Math.max(4,A-1)],['x_new_4',A]]},
};
// ---------- circumstances: 1–2 per run; they change the mechanics ----------
const CIRCS={
  top:{name:'Top floor',line:'Fifth floor, no lift. Every container comes up the stairs.',rule:'Deliveries 3 smaller · carrying costs Spirits'},
  ground:{name:'Ground floor',line:'Ground floor, by the entrance. First to get water, first to be asked.',rule:'Deliveries 3 bigger · neighbours ask more often'},
  nightshift:{name:'Night shift',line:'You work nights at the bakery. You sleep through the morning queues.',rule:'+3 Money a night · queueing costs Spirits'},
  wfh:{name:'Works from home',line:'You work from home. The camera sees the kitchen.',rule:'+2 Money a night · video-call cards'},
};
// ---------- events: multi-day states that make related cards likelier ----------
const EVENTS={
  heat:{name:'Heatwave',len:[3,4],line:'A heatwave. Thirty-six in the shade, and the shade is rationed too.',rule:'Water −3 more each night'},
  strike:{name:'Tanker strike',len:[2,3],line:'The tanker drivers are on strike. They haven’t been paid since spring.',rule:'No building deliveries'},
  election:{name:'Election week',len:[3,3],line:'Election week. Suddenly everyone in a suit loves your street.',rule:'The city wants you to look fine'},
  burst:{name:'Burst main',len:[1,1],line:'A main has burst on Titova street. Water runs downhill into the drains.',rule:'May extend the reduction'},
};

// ---------- the radio: reassuring, then defensive, then silent ----------
const RADIO={
  calm:['“Supply will be fully restored on schedule. Citizens are thanked for their patience.”','“Engineers are working around the clock. Please use water responsibly.”','“There is no cause for concern. Supply is reduced, not interrupted.”','“A reminder: one shower a week is plenty for a healthy adult, say experts.”'],
  defensive:['“The extension is due to circumstances outside the service’s control.”','“Claims that some districts have water are misinformation.”','“The service rejects the word ‘crisis’. The correct term is ‘reduction’.”','“Residents who report leaks are asked to stop calling the same number.”'],
  silent:['The radio plays accordion music where the water update used to be.','The bulletin is about the football.','The announcer reads the weather. Nobody mentions water.','A jingle for AQUA RESIDENCES: “Live above it all.”'],
};

// ---------- the bag ----------
const CARDS=[
// ===== routine: meals, washing, laundry, the toilet bucket =====
// v5.0.2: situations are one or two short sentences, responses one line. Keep the detail that makes it personal.
card('r_porridge','routine','you','home','A pot is a commitment','Porridge needs a pot. A pot needs washing.',
  opt('Cook porridge.','cook',{water:-1,spirits:1},'Warm, and yours. The pot soaks in rinse water.'),
  opt('Buy a pastry.','pay',{money:-1,face:1},'You eat it on the bench, looking fine.'),{cd:3}),
card('r_shirt','routine','you','home','One clean shirt',['One clean shirt left. A meeting tomorrow.','The last clean shirt. Tomorrow people will look.'],
  opt('Sink-wash a shirt.','wash',{water:-1,face:1},'By morning you look like someone with running water.'),
  opt('Wear it inside out.','hide',{face:-1,spirits:1},'Someone studies your seams for a long time.'),{cd:3}),
card('r_bucket','routine','you','home','The bucket',['The toilet needs a bucket to flush. The dishwater is right there.','The bathroom smells like a decision.'],
  opt('Flush it properly.','pour',{water:-1,spirits:1},'It works. You feel grateful for plumbing.'),
  opt('Wait until evening.','wait',{spirits:-1,face:-1},'You keep the door shut. Visitors stay in the hall.'),{cd:2,w:1.3}),
card('r_dishes','routine','you','home','The pile','The dishes have become a structure.',
  opt('Wash everything.','wash',{water:-1,spirits:1},'For an hour, it’s an ordinary day.'),
  opt('Buy paper plates.','pay',{money:-1},'They bend under anything with sauce.'),{cd:3}),
card('r_coffee','routine','you','home','Coffee',['The kettle is the only happy thing in the kitchen.','Coffee at home, or the café on the corner, looking carefree?'],
  opt('Boil the kettle.','boil',{water:-1,spirits:1},'The kitchen smells like a morning should.'),
  opt('Go to the café.','pay',{money:-1,face:1},'You look fine. You are, for twenty minutes.'),{cd:3}),
card('r_plants','routine','you','home','The plants','The basil has given up. The monstera is thinking about it.',
  opt('Water them.','pour',{water:-1,spirits:1},'Something in this flat is thriving.'),
  opt('Let them go.','refuse',{spirits:-1},'You move them out of sight. It doesn’t help.'),{once:true}),
card('r_lunch','routine','you','home','Lunch money',['Bread, and nothing to put on it.','Lunch, or the money for lunch. Not both.'],
  opt('Skip lunch.','wait',{spirits:-1,money:1},'A glass of water instead. Then you remember its cost.'),
  opt('Buy a proper lunch.','pay',{money:-1,spirits:1},'Soup and a roll. You nearly fall asleep.'),{cd:2}),
card('r_mirror','routine','you','stair','The lift mirror','Four days without washing your hair. The lift mirror noticed.',
  opt('Wash at the depot.','wash',{face:1,spirits:-1},'Cold water under a sign: DRINKING ONLY.'),
  opt('Wear a cap.','hide',{face:-1},'The cap says you’ve given up a little.'),{when:s=>s.day>=3,cd:4}),
card('r_fridge','routine','you','home','The fridge is turning',s=>`The chicken is ${s.day>=6?'past':'nearly past'} saving.`,
  opt('Cook it, share it.','cook',{water:-1,spirits:1},'{elder} eats it in the doorway, telling old stories.',{disp:{elder:1},mem:{elder:'You brought a plate of chicken.'}}),
  opt('Bin it, restock.','pay',{money:-1,face:1},'The bin bag goes down at night, quietly.'),{when:s=>s.day>=4,once:true}),
card('r_lastshirt','routine','you','home','Nothing clean','Nothing clean left you’d wear in front of people.',
  opt('Hand-wash a load.','wash',{water:-2,face:1},'Raw knuckles. The balcony is a flag parade.'),
  opt('Buy a cheap shirt.','pay',{money:-2,face:1},'Wrong blue. Clean, which is the right blue.'),{when:s=>s.day>=5,once:true}),
card('r_heat_wash','routine','you','home','Sticky','The heat sits on you like a wet coat.',
  opt('A cold sponge bath.','wash',{water:-1,spirits:1,face:1},'A statue in a switched-off fountain.'),
  opt('Sit by the window.','wait',{spirits:-1},'Hot tar and other people’s laundry.'),{w:.3,boost:{heat:6},cd:2}),
card('r_heat_sleep','routine','you','home','Too hot to sleep','Two in the morning. The sheet is stuck to you.',
  opt('Wet towel, fan.','pour',{water:-1,spirits:1},'You fall asleep counting litres.'),
  opt('Sleep on the roof.','leave',{spirits:1,face:-1},'Half the building is up there. Someone takes a photo.'),{w:.2,boost:{heat:6},cd:3}),
// with a partner
card('r_hair','routine','partner','home','Hair',['“I want to wash my hair. Properly.” {partner} is holding the jug.','{partner} hasn’t mentioned {partner.his} hair in three days. That’s how you know.'],
  opt('Give {partner.him} the jug.','pour',{water:-2,spirits:2},'A towel turban, music on. The flat feels lighter.'),
  opt('Buy dry shampoo.','pay',{money:-1,spirits:-1},'“It smells like a hotel. A bad one.”'),{when:couple,cd:3}),
card('r_dinner','routine','partner','home','Lentils','{partner} holds up the lentils. “Or the grill on the corner?”',
  opt('Lentils, and the pot.','cook',{water:-1,spirits:1},'A kitchen that isn’t waiting for anything.'),

card('r_notebook','routine','partner','home','The tally','{partner} finds your water tally. “Just don’t make me ask to wash my hands.”',

card('r_bath','routine','partner','home','A real bath',s=>lateIn(s)?'“I want a bath. Not a wash. A bath.”':'“When it’s back, I’m having an hour-long bath.” {partner} half jokes.',

card('r_tired','routine','partner','home','Tired',s=>lateIn(s)?'“I’m tired.” That’s all.':'{partner} is asleep at the table at seven. The queue is at five.',

card('r_laundry','routine','partner','home','The laundry mountain','“A small load would change everything,” {partner} says to the pile.',

card('w_colleague','routine','you','office','How are you managing?','“How are you managing, with the water?” The whole office is listening.',
  opt('“Fine, really.”','smile',{face:1,spirits:-1},'“You’re so strong.” You are so tired.'),

card('w_gym','routine','you','street','The gym has showers','The gym has showers. MEMBERS ONLY.',

card('w_circ_call','circ','you','home','Camera on','Team call in five minutes. Cameras on. Your hair has its own weather.',

card('w_circ_stairs','circ','you','stair','Five floors','Twenty litres, five floors, no lift.',

card('n_driver_kettle','neighbour','driver','home','One kettle','{driver} holds an empty bottle half behind {driver.his} leg. “Just enough for tea.”',
  opt('Fill the bottle.','share',{water:-1,spirits:1},'“I’ll bring it back.” “The bottle?” “The favour.”',{disp:{driver:1},sched:['n_driver_favour',2,4],mem:{driver:'You filled {driver.his} bottle for tea.'}}),
  opt('“We count every cup.”','refuse',{face:-1},'“I know.” {driver.He} stays to ask how you are.',{disp:{driver:-1}}),{once:true}),
card('n_driver_favour','neighbour','driver','stair','A full bottle','{driver} returns your bottle, full, plus a second. “Tanker on Mostarska at noon.”',
  opt('Take both.','share',{water:2},'“Good. We’ve established water is useful.”'),
  opt('Take one, share one.','carry',{water:1,spirits:1},'The second goes up to {elder}.',{disp:{elder:1,driver:1}}),{sched:true}),
card('n_elder_carry','neighbour','elder','stair','The stairs','{elder} is on the landing with two empty containers. {elder.He} doesn’t ask.',
  opt('Carry them up.','carry',{spirits:-1,face:1},'{elder.He} thanks you at every landing.',{disp:{elder:1},sched:['n_elder_vouch',2,4],mem:{elder:'You carried {elder.his} water up the stairs.'}}),
  opt('“I can’t today.”','refuse',{face:-1},'An hour later, {elder.he}’s still there.',{disp:{elder:-1}}),{cd:4,w:1.3}),
card('n_elder_vouch','neighbour','elder','stair','A good word','“The one who carried my water!” {elder} presses roasted peppers on you.',
  opt('Take the peppers.','share',{spirits:1,money:1},'Two dinners, and a reputation.'),
  opt('“Keep them, please.”','refuse',{face:2},'Offended for one second, then delighted.'),{sched:true}),
card('n_elder_heat','neighbour','elder','stair','A closed door','{elder}’s door has been shut all day in the heat. Nobody’s seen {elder.him}.',
  opt('Bring a cold bottle.','knock',{water:-1,spirits:1},'You drink it together in the doorway.',{disp:{elder:1},mem:{elder:'You knocked in the heatwave.'}}),
  opt('Leave {elder.him} in peace.','wait',{spirits:-1},'You hear the fan through the floor all night.'),{w:.2,boost:{heat:5},once:true}),
card('n_gossip_ask','neighbour','gossip','stair','At the mailboxes','“So how are you managing, really? You can tell me.”',
  opt('“Wonderfully, actually.”','smile',{face:1},'You can hear the story being written.',{tag:'toldGossipFine',sched:['n_gossip_spread',1,3]}),
  opt('Tell {gossip.him} the truth.','complain',{spirits:1,face:-1},'Great sympathy. Great attention to detail.',{tag:'toldGossipTruth',sched:['n_gossip_spread',1,3],disp:{gossip:1}}),{once:true}),
card('n_gossip_spread','neighbour','gossip','stair','It got around',s=>has(s,'toldGossipFine')?'The building says you’re managing “wonderfully”. A cousin at the depot, maybe?':'The building says you’re “falling apart, poor thing”. Soup arrives. So does a camera.',
  opt('Laugh it off.','smile',{face:1,spirits:-1},'Everyone laughs. Nobody believes the laugh.'),
  opt('Confront {gossip}.','complain',{face:-1,spirits:1},'Hurt and fascinated. Next instalment.',{disp:{gossip:-1}}),{sched:true}),
card('n_gossip_low','neighbour','gossip','stair','People are talking','{gossip} stops talking when you come in. Then starts again, quieter.',
  opt('Bring {gossip.him} a coffee.','share',{money:-1,face:1},'The story gets a new part: you’re coping.',{disp:{gossip:1}}),
  opt('Walk past.','wait',{face:-1},'The voices pick up behind you.'),{when:s=>s.m.face<38,w:2.2,cd:3}),
card('n_gossip_trade','neighbour','gossip','stair','Inside information','“Next tanker time, if you tell me why {spiteful} was crying.”',
  opt('Trade.','share',{water:1,face:-1},'You guess. The tanker comes. So does your guess, to {spiteful}.',{disp:{spiteful:-1}}),
  opt('Decline.','refuse',{spirits:1},'“Suit yourself.” {gossip.He} asks someone louder.'),{once:true,when:s=>s.day>=2}),
card('n_spite_queue','neighbour','spiteful','street','The queue','An hour in the queue. {spiteful} steps in front of you. “I was here before.”',
  opt('Let it go.','wait',{water:-1,face:1},'The people behind you approve, silently.'),
  opt('Call it out.','complain',{face:-1,water:1},'The line backs you. {spiteful}’s look will keep.',{disp:{spiteful:-1},sched:['n_spite_revenge',2,5]}),{cd:4}),
card('n_spite_report','neighbour','spiteful','stair','5 am',s=>`{spiteful} saw you filling containers at five. “${s.m.water>70?'That’s a lot of water for one flat.':'Funny time to fill things.'} The city has a number for this.”`,
  opt('Give {spiteful.him} a container.','share',{water:-2},'No thanks. The number stays undialled. For now.',{disp:{spiteful:1}}),
  opt('“Mind your business.”','refuse',{face:-1},'{spiteful.He} smiles. That’s worse.',{disp:{spiteful:-1},sched:['n_spite_inspector',1,3]}),{when:s=>s.m.water>=60,w:s=>s.m.water>70?3:1.2,cd:3}),
card('n_spite_revenge','neighbour','spiteful','street','An accident','Your full container lies open by the entrance. {spiteful} holds a broom. “Terrible.”',
  opt('Say nothing.','wait',{water:-2,face:1},'You carry the little that’s left upstairs.'),
  opt('Say what you saw.','complain',{water:-1,face:-2,spirits:1},'A scene. Nobody is on anybody’s side.',{disp:{spiteful:-1}}),{sched:true}),
card('n_spite_inspector','neighbour','spiteful','home','An anonymous tip','An inspector: “A tip about excess storage.” Across the landing, a door is ajar.',
  opt('Show him your containers.','pour',{water:-2},'He “redistributes” two. He doesn’t say where.'),
  opt('Pay him off.','pay',{money:-2,face:-1},'Like buying a bus ticket. The door across clicks shut.',{tag:'paidInspector'}),{sched:true}),
card('n_spite_elitist','neighbour','spiteful','stair','Nice for some','“Heard you laughing last night. Nice for some.”',
  opt('Invite {spiteful.him} in.','share',{spirits:-1,water:-1},'{spiteful.He} tells you about {spiteful.his} daughter in Germany.',{disp:{spiteful:1},mem:{spiteful:'You invited {spiteful.him} in for coffee.'}}),
  opt('Close the door.','refuse',{face:-1},'“Elitists.” Then slow footsteps.',{disp:{spiteful:-1}}),{when:s=>s.m.spirits>=64,w:s=>s.m.spirits>74?3:1.2,cd:3}),
card('n_money_loan','neighbour','driver','stair','A small loan',s=>`{driver} doesn’t look at you. “${s.m.money>70?'I hear you’re doing all right.':'Only until the pension comes.'} Could you lend me something?”`,
  opt('Lend it.','share',{money:-2},'{driver.He} writes it in a little book, with the date.',{disp:{driver:1},mem:{driver:'You lent {driver.him} money until the pension.'}}),
  opt('“Things are tight.”','refuse',{face:-1},'“Of course,” {driver.he} says. “Of course.”',{disp:{driver:-1}}),{when:s=>s.m.money>=58,w:s=>s.m.money>70?2.5:1,once:true}),
card('n_spite_money','neighbour','spiteful','stair','Where’s it from?','“New bags every day. Some people are doing well out of this.”',
  opt('“Want to borrow some?”','pay',{money:-2},'Suspicious of the kindness. The rumour slows.',{disp:{spiteful:1}}),
  opt('Laugh.','smile',{face:-1},'By evening: a theory about your cousin at the depot.',{disp:{spiteful:-1}}),{when:s=>s.m.money>=65,w:s=>s.m.money>75?3:1,cd:4}),
card('n_meeting','neighbour','gossip','stair','The building meeting','A meeting on “fair use of shared water”. {spiteful} has a chart. {gossip} has popcorn.',
  opt('Volunteer for the rota.','carry',{spirits:-1,face:1},'The stairwell bucket is yours now. Everyone’s relieved.',{disp:{elder:1,spiteful:1},tag:'rota'}),
  opt('Stay home.','wait',{spirits:1,face:-1},'They decide things about you. {gossip} tells you which.',{disp:{spiteful:-1}}),{when:s=>s.day>=3,once:true}),
card('n_ask_container','neighbour','elder','stair','Just one','“Just one container. My grandson is coming.”',
  opt('Give {elder.him} one.','share',{water:-1,spirits:1},'{elder.He} brings the grandson down to meet you.',{disp:{elder:1}}),
  opt('“We don’t have enough.”','refuse',{face:-1},'{elder.He} nods and tries the next door.',{disp:{elder:-1}}),{cd:4,w:s=>circ(s,'ground')?1.6:.8}),

// ===== the city, and the people inside it =====
card('c_fee','city','clerk','office','An administrative shortcut','“Priority handling is extra.” Behind {clerk}: ALL HOUSEHOLDS EQUAL.',
  opt('Pay for priority.','pay',{money:-2,water:2},'You fold the receipt very small.',{tag:'paidFee'}),
  opt('Hold your place.','wait',{face:1,spirits:-1},'You ask for it in writing. He points at the sign.',{tag:'refusedFee'}),{cd:4,w:1.2}),
card('c_clerk_side','city','clerk','office','His side','{clerk} rubs his eyes. “My daughter washes her hair with a saucepan.”',
  opt('Give him a bottle.','share',{water:-1,spirits:1},'“I can’t take this.” He takes it.',{tag:'clerkKind'}),
  opt('“That’s not my problem.”','complain',{face:-1},'“It’s nobody’s problem. That’s the problem.”',{tag:'clerkCold'}),{when:s=>s.day>=2,once:true}),
card('c_clerk_petty','city','clerk','office','Lost in the system','“Your form may never have been submitted.” You watched him stamp it.',
  opt('Fill it in again.','wait',{spirits:-1},'This time you photograph the stamp.'),
  opt('Ask for the supervisor.','complain',{face:-1},'On holiday. You fill in a complaint form.',{inc:{complaint:1}}),{when:s=>has(s,'clerkCold')||s.m.face<40,cd:4}),
card('c_leak','city','driver','street','Water nobody gets','A pipe leaks behind the depot fence. “We carry it upstairs. They let it run.”',
  opt('Document the leak.','record',{spirits:-1},'Three old complaints about this pipe.',{tag:'leakSeen',inc:{complaint:1}}),
  opt('Fill your containers.','pour',{water:2,face:-1},'Free and clean. A man photographs you.'),{once:true}),
card('c_crew','city','foreman','street','The wrong valve',s=>cnt(s,'complaint')>=2?'The crew digs at the wrong valve again. {foreman} eyes your folder. “All right. Show me.”':'The crew digs at the wrong valve. {foreman} knows. “I can’t sign for it.”',
  opt('Show them the leak.','knock',{spirits:-1},s=>cnt(s,'complaint')>=2?'{foreman} signs for a repair. “Months late.”':'The right address, on the wrong form.',
    s=>cnt(s,'complaint')>=2?{tag:'repaired',end:-1,mem:{foreman:'You showed him the right pipe, with the paperwork.'}}:{inc:{complaint:1},tag:'crewShown'}),
  opt('Go to work.','pay',{money:1},'The trench is filled in. Good? Nobody knows.'),{when:s=>s.day>=3&&!has(s,'repaired'),cd:3}),
card('c_crew_thirsty','city','foreman','street','The crew is thirsty','{foreman}’s crew has dug since six. No water in the van either.',
  opt('Bring them water.','share',{water:-1,spirits:1},'They drink in the trench. {foreman} remembers your door.',{tag:'crewFriend',mem:{foreman:'You brought the crew water.'}}),
  opt('Not your job.','refuse',{face:-1},'They dig slower all afternoon.'),{when:s=>s.day>=2,once:true}),
card('c_tanker','city','tanker','street','The last five hundred litres','“Five hundred litres, three streets. Tell me why it should be yours.”',
  opt('Ask for your street.','knock',{water:2,face:-1},'She picks yours. Two streets watch her go.'),
  opt('Send her to {elder}’s.','share',{spirits:1,face:1},'{elder} was in that queue. You hear about it for days.',{disp:{elder:1},tag:'tankerFair'}),{when:s=>s.day>=2,cd:5}),
card('c_mic','city','official','street','Everything is under control','{official}, at a microphone: “Fully under control.” The camera turns to the crowd.',
  opt('Clap with everyone.','smile',{face:1,spirits:-1},'You’re on the news, clapping.'),
  opt('Shout “Under whose control?”','complain',{face:-2,spirits:1},'A laugh. Your face on the news, mid-shout.',{tag:'heckled',inc:{complaint:1}}),{cd:5,boost:{election:3}}),
card('c_reporter','city','reporter','street','For the evening news','“How is your household coping? We want a positive story.”',
  opt('“We’re managing fine.”','smile',{face:2,spirits:-1},'Your mother says you looked very well.'),
  opt('“Come see our bathroom.”','record',{face:-2},'They don’t air it. Someone leaks it.',{tag:'filmedBathroom',inc:{complaint:1}}),{cd:5,boost:{election:2}}),
card('c_resolved','city','radio','stair','Ticket closed','On the door: ISSUE RESOLVED. The tap is dry.',
  opt('File it again.','complain',{spirits:-1},'This time you copy the whole building.',{inc:{complaint:1}}),
  opt('Let it go.','wait',{face:1},'You’re not a troublemaker. Just thirsty.'),{when:s=>s.day>=2,cd:4}),
card('c_tips','city','radio','home','Helpful advice',['Radio tip: “Save water by showering with a friend.”','Radio tip: “A damp cloth is a shower in miniature.”'],
  opt('Laugh at the radio.','smile',{spirits:1,face:-1},'Someone through the wall laughs too.'),
  opt('Write to the station.','complain',{spirits:-1},'Polite. Then less polite. Sent.',{inc:{complaint:1}}),{cd:4}),
card('c_pool','city','radio','street','AQUA RESIDENCES open day','The private tower’s rooftop pool: free for residents, one hour. Photos may be taken.',
  opt('Go and swim.','wash',{spirits:2,face:1,money:-1},'Warm and blue. Your photo is on their website.',{tag:'swamTower'}),
  opt('Stay away.','refuse',{spirits:-1},'People come out wet-haired, embarrassed, clean.'),{once:true,when:s=>s.day>=2}),
card('c_fine','city','radio','home','Excess use','A fine for “excess use”, split by flat. There has been no use at all.',
  opt('Pay it.','pay',{money:-2,face:1},'Paying for a meal you didn’t eat.'),
  opt('Refuse, in writing.','complain',{face:-1},'Your letter goes in a file, in a cupboard.',{inc:{complaint:1}}),{when:s=>s.day>=3,once:true}),
card('c_hearing','city','official','office','A hearing',s=>`Your complaint file is ${cnt(s,'complaint')} entries thick. There’s a hearing at ten.`,
  opt('Go and speak.','complain',{face:-1,spirits:1},'Four minutes. Nobody interrupts. The end date moves.',{end:-1,tag:'spoke'}),
  opt('Send a written statement.','record',{spirits:-1},'Entered into the record. The record is very large.',{inc:{complaint:1}}),{when:s=>cnt(s,'complaint')>=2&&s.end-s.day>=2,w:2,once:true}),
card('c_extension','city','radio','home','Due to unforeseen circumstances',s=>`“…extended until ${dayName(s.end)}. Thank you for your patience.” ${couple(s)?'{partner} turns the radio off with {partner.his} elbow.':'You turn it off with your elbow.'}`,
  opt('“It’s fine. It’s fine.”','smile',{face:1,spirits:-1},'Twice. That’s how you know.'),
  opt('Say it out loud.','complain',{spirits:1,face:-1},'It echoes in the stairwell. Someone claps.'),{when:s=>s.ext>0&&s.extToday,w:9,cd:3}),
card('c_rota','city','radio','home','The new rota','The new rota has your street, on days ending in seven.',
  opt('Complain at the depot.','complain',{face:-1,water:1},'Your street is added to Tuesdays, in pencil.'),
  opt('Adjust and say nothing.','smile',{face:1,water:-1},'The rota changes again on Thursday.'),{when:s=>s.day>=2,once:true}),

// ===== events =====
card('e_strike','event','tanker','street','On strike','{tanker} stands by her full tanker: NOT PAID SINCE APRIL.',
  opt('Bring her a coffee.','share',{money:-1,spirits:1,face:-1},'“When this is over, your street is first.”',{tag:'tankerFriend',mem:{tanker:'You brought her coffee on the picket line.'}}),
  opt('“People are thirsty.”','complain',{face:1,spirits:-1},'“I know. Tell the people not paying me.”'),{w:0,boost:{strike:8},once:true}),
card('e_candidate','event','official','street','A bottle with a face','A candidate hands out water with his face on the label.',
  opt('Take one and smile.','smile',{water:1,face:1,spirits:-1},'You’re in his video, holding his face.'),
  opt('Refuse it.','refuse',{spirits:1,face:-1},'You’re in the opposition’s video by evening.'),{w:0,boost:{election:8},once:true}),
card('e_burst','event','driver','street','Water down the hill','The burst main pours down Titova street. People run out with saucepans.',
  opt('Fill everything you own.','carry',{water:2,face:-1},'Someone films you running uphill with a vase.'),
  opt('Help close it off.','knock',{spirits:1,face:1},'Wet to the knees. Furious, and proud.',{disp:{driver:1},inc:{complaint:1}}),{w:0,boost:{burst:9},once:true}),

// ===== story context arcs (placed in time; not drawn from the bag) =====
// The wedding: {sib} marries on the day after the promised end.
card('x_wed_1','arc','sib','home','After the water comes back','“{wedDay}! The day after the water’s back. You’ll be there, clean and smiling?”',
  opt('“Wouldn’t miss it.”','smile',{spirits:1,face:1},'{sib} cries a little. You write it in pen.',{promise:{id:'wedding',text:'Be at the wedding',who:'sib',due:s=>s.announced+1}}),
  opt('“If the water’s back.”','complain',{spirits:-1},'“Why wouldn’t it be?” You have no short answer.'),{fam:'arc'}),
card('x_wed_2','arc','sib','home','The outfit','Your wedding outfit needs washing. It’s white, or it used to be.',
  opt('Wash it by hand.','wash',{water:-2,face:1},'It dries like a flag of surrender. Clean.',{tag:'outfitClean'}),
  opt('Dry cleaner’s across town.','pay',{money:-2,face:1},'They have water. They charge like it.',{tag:'outfitClean'}),{fam:'arc'}),
card('x_wed_3','arc','sib','home','The venue is dry',s=>`“The restaurant has no water. ${has(s,'extended')?'Guests must bring their own. To a wedding!':'They want to cancel!'}”`,
  opt('Offer your containers.','share',{water:-2,spirits:1},'The chef hugs you. {sib} hugs you longer.',{tag:'helpedWedding',mem:{sib:'You brought your water to the wedding.'}}),
  opt('Suggest they postpone.','complain',{spirits:-1,face:-1},'“Until when?” Nobody knows.'),{fam:'arc'}),
card('x_wed_4','arc','sib','street','The day itself','The water isn’t back. {sib} is in white. There are buckets behind the bar.',
  opt('Go, smile for photos.','smile',{face:2,spirits:1,money:-1},'You look rested. Only {sib} knows what it took.',{keep:'wedding',tag:'atWedding'}),
  opt('Miss it for the tanker.','queue',{water:2,spirits:-2},'{sib} sends a photo of the cake. No message.',{brk:'wedding'}),{fam:'arc'}),
// The exam: yours, on the promised last day.
card('x_exam_1','arc','you','home','The exam','Exam on {examDay}. The library has working taps. Home has your notes.',
  opt('Study at the library.','leave',{face:1,spirits:-1},'You wash your face between chapters, like a spy.',{tag:'library'}),
  opt('Study at home.','wait',{spirits:1,water:-1},'Three pots of coffee. A chapter and a half.'),{fam:'arc'}),
card('x_exam_2','arc','you','street','The study group','The study group meets across the river. You’d miss the queue.',
  opt('Join the study group.','pay',{money:-1,spirits:1},'Two good hours. The café has a sink.',{tag:'studied'}),
  opt('Queue for water instead.','queue',{water:2,spirits:-1},'A stranger quizzes you on contract law.'),{fam:'arc'}),
card('x_exam_3','arc','you','home','The night before','Wash your hair, or sleep early. Not both.',
  opt('Wash properly.','wash',{water:-2,face:1},'Late, wet hair, a strange calm.',{tag:'examClean'}),
  opt('Sleep early.','wait',{spirits:2},'Nine hours. That hair.'),{fam:'arc'}),
card('x_exam_4','arc','you','office','Exam day','The hall is hot. The examiner looks too long. “Are you all right?”',
  opt('“Perfectly fine.”','smile',{face:1,spirits:-1},'Three hours. You forget water entirely.',{tag:'examDone'}),
  opt('“We have no water.”','complain',{face:-1,spirits:1},'“Mine neither.” A bottle, and ten extra minutes.',{tag:'examDone'}),{fam:'arc'}),
// Just moved in: nobody knows you yet.
card('x_new_1','arc','you','stair','New in the building','Boxes in the hall. Nobody knows your name. The water went off the day you arrived.',
  opt('Knock with biscuits.','knock',{money:-1,spirits:1},'Four doors open. One closes again.',{disp:{driver:1,elder:1,gossip:1,spiteful:1},tag:'introduced'}),
  opt('Keep to yourself.','hide',{face:1,spirits:-1},'Nobody bothers you. Or tells you about the tanker.'),{fam:'arc'}),
card('x_new_2','arc','gossip','stair','The group chat','The building’s group chat posts the tanker times. You’re not in it.',
  opt('Ask to be added.','share',{face:-1,water:1},'“The new one, poor thing.” Tanker at four.',{disp:{gossip:1},tag:'inChat'}),
  opt('Read the notices yourself.','wait',{spirits:-1},'Three days old. The street is empty.'),{fam:'arc'}),
card('x_new_3','arc','driver','stair','On your doormat',s=>`A full container on your doormat. “Welcome to the building. — {${bestNb(s)}}”`,
  opt('Keep it, gratefully.','share',{water:2,spirits:1},'The note is the first thing on your fridge.'),
  opt('Return it, with thanks.','knock',{spirits:1,face:1},'They invite you in. You stay an hour.',{dispBest:1}),{fam:'arc'}),
card('x_new_4','arc','spiteful','stair','The building decides',s=>{const warm=['driver','elder','gossip','spiteful'].filter(a=>disp(s,a)>0).length;return warm>=3?'Your name comes up at the meeting. {elder} says you’re all right. Even {spiteful} agrees.':warm>=2?'Your name comes up at the meeting. Some nod. {spiteful} asks who you are, exactly.':'Your name comes up at the meeting. Nobody knows you. {spiteful} suggests a rota for “newcomers”.';},
  opt('Stand up and speak.','complain',{face:-1,spirits:1},'Terrifying. Three people shake your hand.',{tag:'spokeMeeting'}),
  opt('Smile and nod.','smile',{face:1,spirits:-1},'You agree with all of it.'),{fam:'arc'}),
];
// (cards with sched:true only come when a choice schedules them; arc cards only when their beat comes up)

// ---------- endings: one for each edge, and the epilogue ----------
const EDGES={
  dry:{meter:'water',side:'low',title:'Dry.',sub:'Water ran out',
    text:['There’s nothing left in the containers, not even for drinking. You call {kin} and pack a bag.','You leave the key with {driver}. The building watches you go down the stairs with the empty containers, because you have nowhere else to put them.']},
  hoarder:{meter:'water',side:'high',title:'Hoarder.',sub:'Too much water',
    text:['{spiteful} reported you. An inspector counts your containers out loud in the hallway and “confiscates them for redistribution”.','Three days later you see the same blue containers stacked by the rooftop pool at AQUA RESIDENCES.']},
  falling:{meter:'spirits',side:'low',title:'Falling apart.',sub:'Spirits ran out',
    text:['Nobody is shouting any more, which is worse. {partnerLine}','The flat is locked up behind you. The containers stand in the hall, half full, waiting for someone.']},
  precious:{meter:'spirits',side:'high',title:'Too precious.',sub:'Spirits too high',
    text:['You kept home so nice it looked like nothing was wrong. The building noticed. {spiteful} started calling you “the hotel”.','Nobody tells you when the tanker comes any more. Nobody tells you anything. You are fine, and completely alone in it.']},
  cracked:{meter:'face',side:'low',title:'Cracked.',sub:'Face ran out',
    text:['It happens at the depot, in front of a camera. You shout. You don’t stop shouting.','The clip has a million views by morning. You are a “known troublemaker” now, and somehow your street has moved to the bottom of the delivery list.']},
  poster:{meter:'face',side:'high',title:'Poster family.',sub:'Face too high',
    text:['You were so convincingly fine that the city noticed. Your smiling face is on a billboard: EVERYTHING IS FINE. It is above a dry tap.','You walk past it every day. You can’t stand the act any more, and the act is now twelve metres wide.']},
  broke:{meter:'money',side:'low',title:'Broke.',sub:'Money ran out',

    text:['People assumed you were reselling water. The building manager wanted a cut, then the inspector wanted more.','Now you are reselling water. {clerk} slides an envelope across counter A17 to you every Friday. ALL HOUSEHOLDS EQUAL.']},

const EDGE_OF={water:{low:'dry',high:'hoarder'},spirits:{low:'falling',high:'precious'},face:{low:'cracked',high:'poster'},money:{low:'broke',high:'profiteer'}};
const EPILOGUE={
  wedding:s=>has(s,'atWedding')?'The wedding photos arrive. In all of them you look rested and clean. {sib} has framed the one where you’re laughing, because only {sib} knows what it cost.'
